apiVersion: v1
data:
  ClusterConfiguration: |
    apiServer:
      certSANs:
      - localhost
      - 127.0.0.1
      extraArgs:
      - name: runtime-config
        value: ""
    apiVersion: kubeadm.k8s.io/v1beta4
    caCertificateValidityPeriod: 87600h0m0s
    certificateValidityPeriod: 8760h0m0s
    certificatesDir: /etc/kubernetes/pki
    clusterName: pre48
    controlPlaneEndpoint: pre48-control-plane:6443
    controllerManager:
      extraArgs:
      - name: enable-hostpath-provisioner
        value: "true"
    dns: {}
    encryptionAlgorithm: RSA-2048
    etcd:
      external:
        caFile: /etc/kubernetes/pki/external/ca.crt
        certFile: /etc/kubernetes/pki/external/client.crt
        endpoints:
        - https://external-etcd-1:2379
        - https://external-etcd-2:2379
        - https://external-etcd-3:2379
        httpEndpoints:
        - https://external-etcd-1:2379
        - https://external-etcd-2:2379
        - https://external-etcd-3:2379
        keyFile: /etc/kubernetes/pki/external/client.key
    imageRepository: registry.k8s.io
    kind: ClusterConfiguration
    kubernetesVersion: v1.37.0
    networking:
      dnsDomain: cluster.local
      podSubnet: 10.244.0.0/16
      serviceSubnet: 10.96.0.0/16
    proxy: {}
    scheduler: {}
kind: ConfigMap
metadata:
  creationTimestamp: "2026-10-12T22:35:26Z"
