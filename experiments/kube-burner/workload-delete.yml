metricsEndpoints:
  - indexer:
      type: local
      metricsDirectory: '{{.METRICS_DIRECTORY}}'
global:
  gc: false
  requestTimeout: 20s
jobs:
  - name: mass-deletion
    jobType: delete
    qps: 20
    burst: 25
    maxWaitTimeout: 90s
    preLoadImages: false
    waitForDeletion: true
    objects:
      - kind: Deployment
        apiVersion: apps/v1
        labelSelector: {experiment.kube-burner/run: '{{.UUID}}'}
      - kind: Pod
        apiVersion: v1
        # Deployment Pods disappear through garbage collection; do not race it.
        labelSelector: {experiment.kube-burner/run: '{{.UUID}}', app: density-pause}
      - kind: Service
        apiVersion: v1
        labelSelector: {experiment.kube-burner/run: '{{.UUID}}'}
      - kind: ConfigMap
        apiVersion: v1
        labelSelector: {experiment.kube-burner/run: '{{.UUID}}'}
      - kind: Secret
        apiVersion: v1
        labelSelector: {experiment.kube-burner/run: '{{.UUID}}'}
      - kind: Namespace
        apiVersion: v1
        labelSelector: {experiment.kube-burner/run: '{{.UUID}}'}
