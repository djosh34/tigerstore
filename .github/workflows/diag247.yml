name: diag247
on:
  push:
    branches: [diag/247-cold-restart-elect]
permissions:
  contents: read
jobs:
  reproduction:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Equal-log control
        run: go test -v -count=50 ./internal/core -run '^TestDiag247EqualLogCanVote$'
      - name: Newer-log cold restart, 50 repetitions
        run: go test -v -count=50 ./internal/sim -run '^TestDiag247ColdRestart$'
