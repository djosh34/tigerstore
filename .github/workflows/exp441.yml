# Research #441, exp branch only: long seeds with timing marks and CPU
# profiles, and the checkers natively on their saved histories.
name: exp441
run-name: exp441 ${{ inputs.label }}

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: JSON list of seeds
        required: true
      label:
        description: Label
        default: ""

permissions:
  contents: read

jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(inputs.seeds) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/sim.sh ./internal/sim '^$'
      - run: nproc; free -m
      - name: Seed
        env:
          SEED: ${{ matrix.seed }}
          OUT: ${{ runner.temp }}/exp441
        run: scripts/exp441.sh
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: exp441-${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/exp441/seed.log
            ${{ runner.temp }}/exp441/cpu.*
            ${{ runner.temp }}/exp441/history.json.gz
          retention-days: 14
