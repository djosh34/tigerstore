# Research for #499 (exp branch only): the witness from the revisions on
# the busy no-fault histories of run 42119056245 (320 s, 191,599 ops, and
# 1,280 s, 825,606 ops), with main's checker and this branch's, three
# times each in turn, on one runner.
name: exp499busy2
on:
  push:
    branches: [exp/499-witness-busy2]
permissions:
  contents: read
  actions: read
jobs:
  witness:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: The histories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42119056245 --repo "$GITHUB_REPOSITORY" -n diag499-paired -D "$RUNNER_TEMP/a"
          find "$RUNNER_TEMP/a" -name 'history*' | xargs ls -la
      - name: Five times each, in turn
        env:
          # The commits to compare, by name=ref.
          REFS: phases=9fdf0f33f69af2bfa5ef2e4e710a7dc5cdd0f2fd
          REPS: '12'
          # Builds also run with the collector off.
          GCOFF: ''
        run: |
          for nr in $REFS; do
            n=${nr%%=*}; ref=${nr#*=}
            git worktree add -q "$RUNNER_TEMP/src-$n" "$ref"
            go build -C "$RUNNER_TEMP/src-$n" -o "$RUNNER_TEMP/chk-$n" ./cmd/checkhistory
          done
          # The 191,000 and 720,000 call points of the 1,280 s seed: its
          # prefixes up to those calls (cmd/cutprefix).
          go build -o "$RUNNER_TEMP/cutprefix" ./cmd/cutprefix
          go build -o "$RUNNER_TEMP/scanprobe" ./cmd/scanprobe
          h1280=$(find "$RUNNER_TEMP/a" -name 'history-1280*')
          mkdir -p "$RUNNER_TEMP/p"
          for n in 191000 720000; do
            "$RUNNER_TEMP/cutprefix" "$h1280" $n "$RUNNER_TEMP/p/prefix-$n.json.gz"
          done
          for rep in $(seq "$REPS"); do
            for h in "$RUNNER_TEMP/p/prefix-191000.json.gz" "$RUNNER_TEMP/p/prefix-720000.json.gz"; do
              echo "== probe $(basename "$h") $rep"
              "$RUNNER_TEMP/scanprobe" "$h" 2>/dev/null || true
              for nr in $REFS; do
                n=${nr%%=*}
                echo "== $n $(basename "$h") $rep"
                "$RUNNER_TEMP/chk-$n" -checkers witness-revisions -timeout 60m "$h" | cut -c1-400 || true
              done
              for n in $GCOFF; do
                echo "== $n-gcoff $(basename "$h") $rep"
                GOGC=off "$RUNNER_TEMP/chk-$n" -checkers witness-revisions -timeout 60m "$h" | cut -c1-400 || true
              done
            done
          done
