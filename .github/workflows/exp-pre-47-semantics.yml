name: exp pre-47 semantics
on:
  push:
    branches: [exp/pre-47-semantics]
    paths:
      - experiments/pre-47-semantics/**
      - .github/workflows/exp-pre-47-semantics.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Run the stock etcd probe
        working-directory: experiments/pre-47-semantics
        env:
          WORK: ${{ runner.temp }}/pre-47-semantics
        run: |
          test "$(date -u +%s)" -lt "$(date -u -d '2026-10-13T22:00:00Z' +%s)"
          bash run.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: semantics-results
          path: ${{ runner.temp }}/pre-47-semantics/results
          retention-days: 7
      - name: Delete output and caches
        if: always()
        run: |
          if [ -d '${{ runner.temp }}/pre-47-semantics/mod' ]; then
            chmod -R u+w '${{ runner.temp }}/pre-47-semantics/mod'
          fi
          rm -rf '${{ runner.temp }}/pre-47-semantics'
