# Benchmarks a tigerstore ref against a baseline ref, and etcd v3.7.2 if
# asked, back to back on one runner, with disk write barriers on and pinned
# cores: generator on CPU 3, leader on CPU 0, followers on CPUs 1 and 2.
# Each job first measures its runner (cmd/ceiling: the shared disk's
# durable bandwidth, a core's encode, encrypt and send rates, the kernel
# and CPU) and the generator's own ceiling against cmd/nullstore. The
# report puts every store against the benchmark's ceiling on the runner.
# A failed etcd run is reported and leaves the job green; a failed
# tigerstore run or a harness failure fails it (cmd/benchreport). Started
# by hand.
#
# Two grids (input grid):
# - quick, the default and the bench of every PR, in about 15 minutes on
#   the 18 or so runners a run gets at once: 4 seeds x 3 RTTs x 3
#   benchmarks is 36 jobs of 3 (put, txn) to 6.5 (k8s) minutes:
#   each benchmark x seed x RTT is its own job on its own runner, which
#   runs the baseline and the candidate once each, back to back, max only,
#   and no etcd unless asked. More seeds take the place of repeats, all of
#   them fresh and drawing crd-heavy for k8s (cmd/benchseeds), the shape
#   PRs are judged by; put and txn run on the same seeds. A last job merges
#   every job's results into one report, which judges each seed's paired
#   ratio, candidate over baseline on one runner, against the noise of
#   main against itself (bench/noise.json).
# - full: for #602's done claim, with repeats, rate runs and etcd at the
#   first RTT. k8s is one job that runs every seed at every RTT in turn,
#   so its RTTs share a runner. Every other benchmark has a job per RTT,
#   each on its own runner and measured right before it (#602: one put
#   job's disk slowed by a quarter two hours in, under its 10 ms runs).
#   The job of a later RTT measures etcd's max at the first RTT on its own
#   runner (the first target's without etcd), only for the rate of its
#   rate runs. The last job merges the
#   per-RTT jobs into one report, as in the quick grid.
# Every job of a seed of all measures its runner's disk again at its end:
# a cell whose disk slowed by more than 5% does not count (benchreport).
#
# bench/noise.json, the quick grid's A/A noise per benchmark, shape and RTT,
# is re-measured whenever this workflow, cmd/loadgen, the report's measure
# or the runners' type change: run the quick grid of main against itself,
# then jq -s 'add | map_values(.noise)' report/*/paired.json on its report
# artifact. Each value is the largest |ratio - 1| of the runs' pairs per
# shape and RTT.
#
# Each run draws fresh random seeds, unless -f seeds gives them, and every
# job and target runs on the same ones; the summary prints them and the
# command that replays the run. For k8s a seed draws a recorded cluster
# shape and its workload (bench/recordings).
name: bench

on:
  workflow_dispatch:
    inputs:
      grid:
        description: quick (one job per benchmark, seed and RTT, about 15 minutes) or full (one job per benchmark and RTT, k8s one job for every RTT, with repeats, rate runs and etcd)
        type: choice
        options: [quick, full]
        default: quick
      candidate:
        description: tigerstore ref to measure
        default: main
      baseline:
        description: tigerstore ref to compare against
        default: main
      benchmarks:
        description: space-separated benchmarks, put/txn/delete/range/list/watch with 1k or 10k, k8s (recorded Kubernetes control planes, max only), etcd-tool (etcd's own benchmark tool), or profile (the candidate leader's CPU per step, bench/profile.sh)
        default: put-1k txn-1k k8s
      rtts:
        description: round-trip times between nodes in ms; etcd runs at the first only. In the full grid every RTT's rate runs take the first RTT's rate, which each later RTT's job measures again on its own runner, and k8s runs them in this order on one runner; in the quick grid rate runs only at the first
        default: 0 2 10
      seeds:
        description: space-separated seeds to replay a run; empty draws 4 fresh ones that all draw crd-heavy for k8s in the quick grid, 3 of any shape in the full one
        default: ""
      targets:
        description: stores to run, etcd, baseline and candidate; empty is baseline candidate in the quick grid, etcd baseline candidate in the full one
        default: ""
      modes:
        description: max, rate (half etcd max), or both; empty is max in the quick grid, max rate in the full one
        default: ""
      reps:
        description: repetitions of each seed; empty is 1 in the quick grid, 3 in the full one
        default: ""
      profile_generator:
        description: write loadgen's CPU profile of every run into the artifact
        type: boolean
        default: false
      layouts:
        description: extra max runs of the tigerstore refs in the put-1k and txn-1k jobs at the first RTT, tmpfs (all nodes on tmpfs) and alone (followers on tmpfs)
        default: ""

      fetch_measure:
        description: Run the isolated original fetch campaign instead of the ordinary bench grid (immutable baseline/candidate SHAs required)
        type: boolean
        default: false
      fetch_race:
        description: Build both original-workload binaries with the race detector
        type: boolean
        default: false
      fetch_fsync_ms:
        description: Additional delay per durable O_DSYNC WAL batch (original 5-ms diagnostic)
        type: choice
        options: ['0', '5']
        default: '0'
      fetch_pr897:
        description: PR897 option-A relative gate; five pairs, each throughput >=0.98 and baseline-MAD p95 noise; 1 s / 3 s figures are information for issue 913
        type: boolean
        default: false
      fetch_profile_leader:
        description: One resident pair with leader CPU profiles, diagnostic only and never a gate
        type: boolean
        default: false
      fetch_resident:
        description: Named range-1k resident 3-GiB control, fixed load, never-populated fetch-cache proof, PR897 option A
        type: boolean
        default: false

jobs:
  fetch-original:
    if: inputs.fetch_measure
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      ETCD_UNSAFE_LOG_RING_BYTES: '536870912'
      FETCH_MEASURE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Record isolated runner and safe disk settings
        run: |
          sudo mount -o remount,barrier=1 /
          test "$(findmnt -T "$RUNNER_TEMP" -n -o FSTYPE)" = ext4
          if findmnt -T "$RUNNER_TEMP" -n -o OPTIONS | grep -Eq 'nobarrier|barrier=0'; then exit 1; fi
          { uname -a; lscpu; free -b; go version; findmnt -T "$RUNNER_TEMP"; } > "$RUNNER_TEMP/fetch-runner.txt"
      - name: Five isolated alternating pairs, ruling A with issue 913 information
        env:
          BASELINE: ${{ inputs.baseline }}
          CANDIDATE: ${{ inputs.candidate }}
          RACE: ${{ inputs.fetch_race }}
          SYNC_DELAY: ${{ inputs.fetch_fsync_ms }}
        run: |
          args=()
          if [ "$RACE" = true ]; then args+=(--race); fi
          python3 -B scripts/fetch-original-measure.py --baseline "$BASELINE" --candidate "$CANDIDATE" --sync-delay-ms "$SYNC_DELAY" "${args[@]}" --out "$RUNNER_TEMP/fetch-original-evidence"
      - name: Preserve evidence and report the actual gate state
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/fetch-original-evidence"
          rm -f "$RUNNER_TEMP/fetch-original-evidence/"*.test
          cp "$RUNNER_TEMP/fetch-runner.txt" "$RUNNER_TEMP/fetch-original-evidence/runner.txt"
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'fetch-original-evidence/manifest.json'
          report = json.loads(p.read_text()) if p.exists() else {'status':'INCOMPLETE', 'reason':'campaign failed before a manifest existed'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Original fetch measurement\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fetch-original-race${{ inputs.fetch_race }}-sync${{ inputs.fetch_fsync_ms }}
          path: ${{ runner.temp }}/fetch-original-evidence
          retention-days: 30
  fetch-pr897:
    if: ${{ inputs.fetch_pr897 && !inputs.fetch_measure }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      ETCD_UNSAFE_LOG_RING_BYTES: '536870912'
      FETCH_MEASURE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Record isolated runner and safe disk settings
        run: |
          sudo mount -o remount,barrier=1 /
          test "$(findmnt -T "$RUNNER_TEMP" -n -o FSTYPE)" = ext4
          if findmnt -T "$RUNNER_TEMP" -n -o OPTIONS | grep -Eq 'nobarrier|barrier=0'; then exit 1; fi
          { uname -a; lscpu; free -b; go version; findmnt -T "$RUNNER_TEMP"; } > "$RUNNER_TEMP/fetch-pr897-runner.txt"
      - name: Five PR897 relative pairs, stop on any failed pair or new failure
        env:
          BASELINE: ${{ inputs.baseline }}
          CANDIDATE: ${{ inputs.candidate }}
          RACE: ${{ inputs.fetch_race }}
          SYNC_DELAY: ${{ inputs.fetch_fsync_ms }}
        run: |
          args=()
          if [ "$RACE" = true ]; then args+=(--race); fi
          python3 -B scripts/fetch-pr897-measure.py --baseline "$BASELINE" --candidate "$CANDIDATE" --sync-delay-ms "$SYNC_DELAY" "${args[@]}" --out "$RUNNER_TEMP/fetch-pr897-evidence"
      - name: Preserve the distinct PR897 policy and raw evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/fetch-pr897-evidence"
          rm -f "$RUNNER_TEMP/fetch-pr897-evidence/"*.test
          cp "$RUNNER_TEMP/fetch-pr897-runner.txt" "$RUNNER_TEMP/fetch-pr897-evidence/runner.txt"
          python3 -B - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ['RUNNER_TEMP']) / 'fetch-pr897-evidence/manifest.json'
          report = json.loads(p.read_text()) if p.exists() else {'status':'INCOMPLETE', 'reason':'campaign failed before a manifest existed'}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## PR897 option-A relative gate (issue 913 figures are information)\n\n```json\n' + json.dumps(report, indent=2) + '\n```\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fetch-pr897-race${{ inputs.fetch_race }}-sync${{ inputs.fetch_fsync_ms }}
          path: ${{ runner.temp }}/fetch-pr897-evidence
          retention-days: 30
  fetch-resident:
    if: ${{ inputs.fetch_resident && !inputs.fetch_measure && !inputs.fetch_pr897 }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    env:
      FETCH_MEASURE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Safe isolated disk and runner record
        run: |
          sudo mount -o remount,barrier=1 /
          test "$(findmnt -T "$RUNNER_TEMP" -n -o FSTYPE)" = ext4
          if findmnt -T "$RUNNER_TEMP" -n -o OPTIONS | grep -Eq 'nobarrier|barrier=0'; then exit 1; fi
          { uname -a; lscpu; free -b; go version; findmnt -T "$RUNNER_TEMP"; } > "$RUNNER_TEMP/resident-runner.txt"
      - name: Install the standard pinned etcdctl for cluster control
        run: |
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" https://github.com/etcd-io/etcd/releases/download/v3.7.2/etcd-v3.7.2-linux-arm64.tar.gz
          echo "5e3ff99d428fabfcefdc95348f6560d1efe835f7b2d1ab3334fe0831076966b7  $RUNNER_TEMP/etcd.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
      - name: Five alternating qualified resident-control pairs
        env:
          BASELINE: ${{ inputs.baseline }}
          CANDIDATE: ${{ inputs.candidate }}
          FETCH_ETCDCTL: ${{ runner.temp }}/etcd-v3.7.2-linux-arm64/etcdctl
          PROFILE: ${{ inputs.fetch_profile_leader }}
        run: |
          args=()
          if [ "$PROFILE" = true ]; then args+=(--profile); fi
          python3 -B scripts/fetch-resident-measure.py --baseline "$BASELINE" --candidate "$CANDIDATE" "${args[@]}" --out "$RUNNER_TEMP/resident-evidence"
      - name: Preserve raw qualified or incomplete evidence
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/resident-evidence"
          rm -rf "$RUNNER_TEMP/resident-evidence/bins" "$RUNNER_TEMP/resident-evidence/certs"
          cp "$RUNNER_TEMP/resident-runner.txt" "$RUNNER_TEMP/resident-evidence/runner.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: fetch-resident-range-1k
          path: ${{ runner.temp }}/resident-evidence
          retention-days: 30
  plan:
    if: ${{ !inputs.fetch_measure && !inputs.fetch_pr897 && !inputs.fetch_resident }}
    runs-on: ubuntu-24.04-arm
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
      seeds: ${{ steps.plan.outputs.seeds }}
      at: ${{ steps.plan.outputs.at }}
    steps:
      - uses: actions/checkout@v7
        if: (inputs.grid || 'quick') == 'quick' && inputs.seeds == ''
      - uses: actions/setup-go@v7
        if: (inputs.grid || 'quick') == 'quick' && inputs.seeds == ''
        with:
          go-version-file: go.mod
      # The jobs: in the quick grid one per benchmark, seed and RTT, in the
      # full grid one per benchmark and RTT but one for k8s. The tools that
      # are not loadgen runs (profiles, the disk probe, etcd's own tool)
      # are one job each in both.
      - id: plan
        env:
          GRID: ${{ inputs.grid || 'quick' }}
          BENCHMARKS: ${{ inputs.benchmarks || 'put-1k txn-1k k8s' }}
          SEEDS: ${{ inputs.seeds }}
          RTTS: ${{ inputs.rtts || '0 2 10' }}
        run: |
          echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
          # The quick grid judges PRs by crd-heavy: its fresh seeds all draw
          # it, and put and txn run on the same seeds. The full grid draws
          # every shape.
          if [ -z "$SEEDS" ] && [ "$GRID" = quick ]; then
            SEEDS=$(go run ./cmd/benchseeds -n 4 -shape crd-heavy -min 4)
          elif [ -z "$SEEDS" ]; then
            SEEDS=$(shuf -i 1-999999999 -n 3 | tr '\n' ' ' | sed 's/ $//')
          fi
          echo "seeds=$SEEDS" >> "$GITHUB_OUTPUT"
          # k8s jobs, the longest, come first, so they start in the first
          # wave of runners.
          jobs=$(jq -cn --arg grid "$GRID" --arg b "$BENCHMARKS" --arg s "$SEEDS" --arg r "$RTTS" '
            def words: split(" ") | map(select(. != ""));
            [($b | words | sort_by(. != "k8s"))[] as $bench |
              if ($grid == "full" and $bench == "k8s") or ($bench | IN("profile", "profile-disk", "disk-probe", "etcd-tool"))
              then {bench: $bench, seed: "all", rtt: "all", name: $bench}
              elif $grid == "full"
              then ($r | words)[] as $rtt | {bench: $bench, seed: "all", rtt: $rtt, name: "\($bench)-rtt\($rtt)"}
              else ($s | words | to_entries)[] as $seed | ($r | words)[] as $rtt |
                {bench: $bench, seed: $seed.value, rtt: $rtt, name: "\($bench)-\($seed.value)-rtt\($rtt)",
                 flip: ($seed.key % 2 == 1)}
              end]')
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "Grid $GRID, seeds: $SEEDS, $(jq length <<<"$jobs") jobs" >> "$GITHUB_STEP_SUMMARY"

  bench:
    needs: plan
    name: ${{ matrix.job.name }}
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    runs-on: ubuntu-24.04-arm
    # GitHub ends a job after 6 hours. Every tigerstore cluster start
    # formats its nodes' log rings first, 8 GiB each at the bench's
    # budget: 70 to 95 s with all three on the runner's one disk, before
    # the measured part of the run. A quick-grid benchmark job runs 2.
    # - k8s, max only: a run takes about 2.5 minutes with its preload and
    #   ramp, plus the format. In the full grid, 3 seeds x 3 repetitions x
    #   (2 targets x 3 RTTs + etcd at the first) is 63 runs, 54 of them
    #   tigerstore starts; the job took 183 minutes when only the
    #   candidate had a ring, so about 215 now, against 330.
    # - Every other job of a seed of all gets 300: each full-grid job but
    #   k8s, and profile, profile-disk, disk-probe and etcd-tool in either
    #   grid, as the plan job sets them. A full put or txn job of one RTT
    #   starts 36 tigerstore clusters (max and rate), about 45 minutes of
    #   formats; with every RTT in one job it took about 190 (put) to 220
    #   (txn) minutes (#602's full bench of 31162e0b).
    timeout-minutes: ${{ matrix.job.seed != 'all' && 60 || matrix.job.bench == 'k8s' && 330 || 300 }}
    env:
      BENCH: ${{ matrix.job.bench }}
      SEEDS: ${{ matrix.job.seed == 'all' && needs.plan.outputs.seeds || matrix.job.seed }}
      RTTS: ${{ matrix.job.rtt == 'all' && (inputs.rtts || '0 2 10') || matrix.job.rtt }}
      TARGETS: ${{ inputs.targets || (inputs.grid == 'full' && 'etcd baseline candidate' || 'baseline candidate') }}
      MODES: ${{ inputs.modes || (inputs.grid == 'full' && 'max rate' || 'max') }}
      REPS: ${{ inputs.reps || (inputs.grid == 'full' && '3' || '1') }}
    steps:
      - id: start
        run: echo "at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # etcdctl drives every store's cluster (bench/cluster.sh), so the
      # release is installed even when etcd itself does not run.
      - name: Install etcd v3.7.2
        run: |
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" https://github.com/etcd-io/etcd/releases/download/v3.7.2/etcd-v3.7.2-linux-arm64.tar.gz
          echo "5e3ff99d428fabfcefdc95348f6560d1efe835f7b2d1ab3334fe0831076966b7  $RUNNER_TEMP/etcd.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
          mkdir -p bin
          cp "$RUNNER_TEMP/etcd-v3.7.2-linux-arm64/etcd" "$RUNNER_TEMP/etcd-v3.7.2-linux-arm64/etcdctl" bin/
      - name: Build the generator, the report and both tigerstore refs
        env:
          CANDIDATE: ${{ inputs.candidate || 'main' }}
          BASELINE: ${{ inputs.baseline || 'main' }}
        run: |
          go build -o bin/loadgen ./cmd/loadgen
          go build -o bin/benchreport ./cmd/benchreport
          go build -o bin/ceiling ./cmd/ceiling
          go build -o bin/nullstore ./cmd/nullstore
          for target in baseline candidate; do
            ref=$BASELINE
            if [ "$target" = candidate ]; then ref=$CANDIDATE; fi
            git worktree add --detach "$RUNNER_TEMP/$target" "origin/$ref" 2>/dev/null || git worktree add --detach "$RUNNER_TEMP/$target" "$ref"
            (cd "$RUNNER_TEMP/$target" && go build -o "$GITHUB_WORKSPACE/bin/$target" ./cmd/tigerstore)
            echo "$target $ref $(git -C "$RUNNER_TEMP/$target" rev-parse HEAD)" >> commits.txt
          done
          cat commits.txt
      - run: scripts/dev-certs.sh certs
      - run: sudo modprobe sch_netem
      - name: Turn disk write barriers on and record the runner
        env:
          LAYOUT: 3 0 1 2
        run: |
          sudo mount -o remount,barrier=1 /
          findmnt -T "$RUNNER_TEMP" -o TARGET,SOURCE,FSTYPE,OPTIONS
          test "$(findmnt -T "$RUNNER_TEMP" -n -o FSTYPE)" = ext4
          if findmnt -T "$RUNNER_TEMP" -n -o OPTIONS | grep -Eq 'nobarrier|barrier=0'; then exit 1; fi
          mkdir -p results
          {
            echo "## Runner"
            echo '```'
            lscpu | grep -E 'Model name|^CPU\(s\)|Thread'
            free -b | head -2
            findmnt -T "$RUNNER_TEMP" -n -o SOURCE,FSTYPE,OPTIONS
            uname -r
            go version
            bin/etcd --version | head -1
            cat commits.txt
            echo "generator, scripts and report: $GITHUB_SHA"
            echo "layout (generator, leader, followers): $LAYOUT"
            echo "both stores: 3 nodes on 127.0.0.1, client and peer TLS with client certificates, fresh data directory per run"
            echo "RTT between nodes (ms): $RTTS, netem on the peer ports of lo, half the RTT per packet, the same qdiscs at 0; client to node without delay (bench/netem.sh)"
            if [ "$BENCH" = k8s ]; then
              echo "k8s: a recorded Kubernetes 1.37 control plane per seed (bench/recordings), 64 copies of it on all endpoints, 3 connections x 64 streams, which the recorded watches share; both stores GOMEMLIMIT=3GiB"
            fi
            echo "seeds: $SEEDS"
            echo "grid: ${{ inputs.grid || 'quick' }}, targets: $TARGETS, modes: $MODES, repeats: $REPS"
            echo "both stores: --quota-backend-bytes 8 GiB; etcd only: --log-level warn, --peer-client-cert-auth, default safe persistence"
            echo "tigerstore: at least two Go processors on its one CPU (its own rule), peer certificates always verified"
            echo '```'
          } | tee results/runner.md
      # Nothing else runs yet: the disk and the CPU are the runner's alone.
      # In the quick grid only the job of the first seed and RTT measures:
      # the report takes one runner's measure for all, the runners being
      # of one type.
      - name: Measure the runner
        id: measure
        if: matrix.job.bench != 'profile' && matrix.job.bench != 'profile-disk' && matrix.job.bench != 'disk-probe' && matrix.job.bench != 'etcd-tool' && (matrix.job.seed == 'all' || startsWith(format('{0} ', needs.plan.outputs.seeds), format('{0} ', matrix.job.seed)) && startsWith(format('{0} ', inputs.rtts || '0 2 10'), format('{0} ', matrix.job.rtt)))
        run: |
          taskset -c 3 bin/ceiling -dir "$RUNNER_TEMP" \
            -disk "$(findmnt -T "$RUNNER_TEMP" -n -o SOURCE)" \
            -cpu "$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)" | tee results/ceiling.json
      - name: Measure the generator against nullstore
        if: matrix.job.bench != 'profile' && matrix.job.bench != 'profile-disk' && matrix.job.bench != 'disk-probe' && matrix.job.bench != 'etcd-tool' && (matrix.job.seed == 'all' || startsWith(format('{0} ', needs.plan.outputs.seeds), format('{0} ', matrix.job.seed)) && startsWith(format('{0} ', inputs.rtts || '0 2 10'), format('{0} ', matrix.job.rtt)))
        env:
          BINS: bin
          CERTS: certs
          LAYOUT: 3 0 1 2
          MODES: generator
        run: bench/run.sh "${{ matrix.job.bench }}" results
      - name: Run ${{ matrix.job.bench }}
        env:
          BINS: bin
          CERTS: certs
          LAYOUT: 3 0 1 2
          PROFILE_GENERATOR: ${{ inputs.profile_generator && 'yes' || '' }}
          LAYOUTS: ${{ (matrix.job.bench == 'put-1k' || matrix.job.bench == 'txn-1k') && inputs.layouts || '' }}
          ALL_RTTS: ${{ inputs.rtts || '0 2 10' }}
        run: |
          if [ "$BENCH" = disk-probe ]; then
            bench/disk-probe.sh "$RUNNER_TEMP" "$(basename "$(findmnt -T "$RUNNER_TEMP" -n -o SOURCE)")" | tee results/disk-probe.txt
            exit 0
          fi
          if [ "$BENCH" = profile-disk ]; then
            DISK=$(basename "$(findmnt -T "$RUNNER_TEMP" -n -o SOURCE)")
            # k8s replays the recording that the run's first seed draws.
            for b in put-1k txn-1k k8s; do
              SEED=${SEEDS%% *} DISK=$DISK DATA="$RUNNER_TEMP/bench-data" bench/profile-disk.sh bin/candidate "$b" results/profile-disk
            done
            exit 0
          fi
          if [ "$BENCH" = profile ]; then
            for wl in put txn range list; do
              TMPFS_DIR=/dev/shm/bench-profile bench/profile.sh bin/candidate "$wl" results/profile
            done
            exit 0
          fi
          if [ "$BENCH" = etcd-tool ]; then
            git clone -q --depth 1 -b v3.7.2 https://github.com/etcd-io/etcd "$RUNNER_TEMP/etcd-src"
            (cd "$RUNNER_TEMP/etcd-src/tools/benchmark" && go build -o "$GITHUB_WORKSPACE/bin/benchmark" .)
            DATA="$RUNNER_TEMP/bench-data" bench/etcdbench.sh bin/benchmark results/etcd-tool
            exit 0
          fi
          DISK=$(basename "$(findmnt -T "$RUNNER_TEMP" -n -o SOURCE)")
          export DISK DATA="$RUNNER_TEMP/bench-data"
          read -r -a rtts <<<"$RTTS"
          first=results/rtt-${rtts[0]}
          # In the quick grid a job runs one RTT. etcd and the layouts run
          # only in the jobs of the first RTT asked for, as in the full
          # grid; the other RTTs have no shared rate, so their rate runs
          # are left out, and say so (norate).
          read -r -a asked <<<"$ALL_RTTS"
          # A quick-grid job runs each store once, so the store that runs
          # second on a runner would always be the candidate: an A/A run
          # measured the second store faster by about 3 % in nearly every
          # cell. Every other seed runs its stores in the other order.
          if [ "${{ matrix.job.flip }}" = true ]; then
            TARGETS=$(echo "$TARGETS" | tr ' ' '\n' | grep -v '^$' | tac | tr '\n' ' ')
            export TARGETS
          fi
          norate=""
          if [ "${rtts[0]}" != "${asked[0]}" ]; then
            first=none
            if [ "${{ matrix.job.seed }}" = all ] && [[ " $MODES " == *" rate "* ]]; then
              # A full-grid job of a later RTT: the rate of every RTT is
              # half of the median max at the first RTT of etcd, or of the
              # first target without etcd, as bench/run.sh picks it. This
              # job measures that max first, on its own runner, for the
              # rate alone; the runs stay in rate-probe/ and are reported
              # nowhere, the first RTT's job's being the reported ones.
              # The median is run.sh's (its rate step).
              read -r -a tg <<<"$TARGETS"
              ref=etcd
              if [[ " $TARGETS " != *" etcd "* ]]; then ref=${tg[0]}; fi
              bench/netem.sh on "${asked[0]}"
              TARGETS=$ref MODES=max LAYOUTS="" bench/run.sh "$BENCH" results/rate-probe
              bench/netem.sh off
              maxes=()
              for f in results/rate-probe/"$BENCH"/"$ref"-max-*.json; do
                if [ -f "$f" ] && [ ! -f "${f%.json}.failed" ]; then maxes+=("$f"); fi
              done
              if [ "${#maxes[@]}" -gt 0 ]; then
                RATE_FALLBACK=$(jq -s 'map(.throughput) | sort | (if length % 2 == 0 then (.[length / 2 - 1] + .[length / 2]) / 2 else .[length / 2 | floor] end) / 2 | floor' "${maxes[@]}")
                export RATE_FALLBACK
              else
                # No rate of the shared definition: none at all, rather
                # than run.sh's max of a store at this RTT.
                norate="no rate runs: $ref's max at the first RTT, ${asked[0]} ms, measured on this RTT's runner for the rate, made no result"
                MODES=$(echo "$MODES" | tr ' ' '\n' | grep -vx rate | tr '\n' ' ')
              fi
            elif [[ " $MODES " == *" rate "* ]]; then
              norate="rate runs only at the first RTT, ${asked[0]} ms, in the quick grid"
              MODES=$(echo "$MODES" | tr ' ' '\n' | grep -vx rate | tr '\n' ' ')
            fi
            TARGETS=$(echo "$TARGETS" | tr ' ' '\n' | grep -vx etcd | tr '\n' ' ')
            export TARGETS MODES LAYOUTS=""
          fi
          measure() {
            if [ -z "${MODES// /}" ]; then
              # Only rate was asked, which this RTT leaves out; run.sh
              # would take no modes for both.
              mkdir -p "$out/$BENCH"
            elif [ "$out" = "$first" ]; then
              bench/run.sh "$BENCH" "$out"
            else
              # Layouts measure disk and CPU, not the network: once is
              # enough. etcd is there for comparison: once is enough too.
              TARGETS=$(echo "$TARGETS" | tr ' ' '\n' | grep -vx etcd | tr '\n' ' ') \
                LAYOUTS="" RATE_FALLBACK=${RATE_FALLBACK:-$(cat "$first/$BENCH/rate" 2>/dev/null || true)} bench/run.sh "$BENCH" "$out"
            fi
          }
          for rtt in "${rtts[@]}"; do
            out=results/rtt-$rtt
            mkdir -p "$out"
            bench/netem.sh on "$rtt"
            bench/netem.sh probe | tee "$out/probe.txt"
            measure
            # A quick-grid job whose failed runs all failed by a stall of
            # the runner's disk (benchreport -disk-stall: every node's
            # syncs stalled together, the leader went silent by #233's
            # failover rule, a new leader came after) measures its pair
            # once more, both stores back to back; the first measure stays
            # in the artifact under retried/. A second failure stays.
            if [ "${{ matrix.job.seed }}" != all ] && compgen -G "$out/$BENCH/*.failed" >/dev/null &&
              bin/benchreport -disk-stall results >"$RUNNER_TEMP/stall.txt"; then
              cat "$RUNNER_TEMP/stall.txt"
              mkdir -p "results/retried/rtt-$rtt"
              mv "$out/$BENCH" "results/retried/rtt-$rtt/$BENCH"
              measure
              cp "$RUNNER_TEMP/stall.txt" "$out/$BENCH/retried-${{ matrix.job.seed }}"
            fi
            # run.sh refuses a directory that holds results already, so the
            # note goes in after it.
            if [ -n "$norate" ]; then echo "$norate" >"$out/$BENCH/norate"; fi
            bench/netem.sh show >"$out/netem.txt"
            bench/netem.sh off
          done
      # The disk again at the job's end, on the runner as the runs left
      # it: benchreport sets it against the start's, and a cell whose disk
      # slowed by more than 5% does not count (#602).
      - name: Measure the runner's disk again
        if: ${{ !cancelled() && steps.measure.outcome == 'success' && matrix.job.seed == 'all' }}
        run: |
          taskset -c 3 bin/ceiling -dir "$RUNNER_TEMP" \
            -disk "$(findmnt -T "$RUNNER_TEMP" -n -o SOURCE)" \
            -cpu "$(lscpu | sed -n 's/^Model name: *//p' | head -n 1)" | tee results/ceiling-end.json
      # A harness failure leaves no comparison. The raw results are
      # uploaded either way. In the quick grid the report job reports a
      # benchmark's jobs together.
      - name: Report
        if: matrix.job.seed == 'all'
        env:
          LAYOUTS: ${{ inputs.layouts }}
          JOB_START: ${{ steps.start.outputs.at }}
        run: |
          {
            cat results/runner.md
            sha() { awk -v t="$1" '$1 == t { print $3 }' commits.txt; }
            echo "Replay: \`gh workflow run bench.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }} -f candidate=$(sha candidate) -f baseline=$(sha baseline) -f grid=${{ inputs.grid || 'quick' }} -f benchmarks=$BENCH -f seeds=\"$SEEDS\" -f rtts=\"$RTTS\" -f targets=\"$TARGETS\" -f modes=\"$MODES\" -f reps=$REPS -f layouts=\"$LAYOUTS\"\`, with ${{ github.ref_name }} at $GITHUB_SHA, which ran the generator, the scripts and the report. The job took $(( ($(date +%s) - JOB_START) / 60 )) minutes up to the report."
            if [ "$BENCH" = disk-probe ]; then
              echo '```'; cat results/disk-probe.txt; echo '```'
            elif [ "$BENCH" = profile-disk ]; then
              echo "profiles in the artifact"
            elif [ "$BENCH" = profile ]; then
              cat results/profile/*.steps.md
            elif [ "$BENCH" = etcd-tool ]; then
              echo '```'
              echo "test | store | requests/s per repetition | p99 ms per repetition"
              cat results/etcd-tool/summary.txt
              echo '```'
            else
              echo '```'
              for rtt in $RTTS; do
                echo "RTT $rtt ms: $(tr '\n' ' ' <"results/rtt-$rtt/probe.txt")"
              done
              echo '```'
              bin/benchreport results
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: bench-${{ matrix.job.name }}
          path: results
          retention-days: 30

  # The report of the benchmarks split over jobs, every benchmark of the
  # quick grid and every one but k8s of the full grid: every job's runs of
  # a benchmark in one report, seed by seed and shape by shape. The jobs ran
  # on runners of one type. In the quick grid the ceilings and the
  # generator's measure are the first job's; in the full grid each RTT has
  # its own job's ceilings, and the first RTT's job describes the runner.
  report:
    needs: [plan, bench]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build -o bin/benchreport ./cmd/benchreport
      - uses: actions/download-artifact@v7
        with:
          pattern: bench-*
          path: jobs
      - name: Report
        env:
          JOBS: ${{ needs.plan.outputs.jobs }}
          SEEDS: ${{ needs.plan.outputs.seeds }}
          GRID: ${{ inputs.grid || 'quick' }}
          RTTS: ${{ inputs.rtts || '0 2 10' }}
          TARGETS: ${{ inputs.targets || (inputs.grid == 'full' && 'etcd baseline candidate' || 'baseline candidate') }}
          MODES: ${{ inputs.modes || (inputs.grid == 'full' && 'max rate' || 'max') }}
          REPS: ${{ inputs.reps || (inputs.grid == 'full' && '3' || '1') }}
          START: ${{ needs.plan.outputs.at }}
          BENCH_RESULT: ${{ needs.bench.result }}
        run: |
          status=0
          read -r first _ <<<"$RTTS"
          {
            echo "## ${GRID^} grid"
            echo "Seeds: $SEEDS; RTTs: $RTTS; targets: $TARGETS; modes: $MODES; repeats: $REPS. The run took $(( ($(date +%s) - START) / 60 )) minutes up to this report, plan to report."
            echo "Replay: \`gh workflow run bench.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }} -f grid=$GRID -f candidate=${{ inputs.candidate || 'main' }} -f baseline=${{ inputs.baseline || 'main' }} -f benchmarks=\"${{ inputs.benchmarks || 'put-1k txn-1k k8s' }}\" -f seeds=\"$SEEDS\" -f rtts=\"$RTTS\" -f targets=\"$TARGETS\" -f modes=\"$MODES\" -f reps=$REPS\`"
            if [ "$BENCH_RESULT" != success ]; then
              echo "Some jobs did not succeed ($BENCH_RESULT): their runs are missing below, or their failures listed."
              status=1
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # The retries of the whole bench, every workload's together.
          retries=$(find jobs -path '*/rtt-*/*/retried-*' | wc -l)
          if [ "$retries" -gt 0 ]; then
            {
              echo "Pairs measured again after a stall of the runner's disk, in the whole bench: $retries of at most 3."
              if [ "$retries" -gt 3 ]; then echo "More than 3: the bench fails."; fi
            } >> "$GITHUB_STEP_SUMMARY"
            if [ "$retries" -gt 3 ]; then status=1; fi
          fi
          for bench in $(jq -r '[.[] | select(.rtt != "all") | .bench] | unique | .[]' <<<"$JOBS"); do
            dir=merged/$bench
            mkdir -p "$dir"
            for job in jobs/bench-"$bench"-*; do
              [ -d "$job" ] || continue
              cp -rn "$job"/rtt-* "$dir"/
              # A full-grid job ran one RTT on its own runner: its measures
              # at its start and end go with that RTT (benchreport).
              if [ "$GRID" = full ]; then
                for r in "$job"/rtt-*; do
                  for f in ceiling.json ceiling-end.json; do
                    if [ -f "$job/$f" ]; then cp "$job/$f" "$dir/$(basename "$r")/"; fi
                  done
                done
              fi
              # The runner block goes with the measure: both from the job
              # that measured, in the full grid the first RTT's.
              if [ -f "$job/ceiling.json" ] && { [ "$GRID" = quick ] || [ -d "$job/rtt-$first" ]; }; then
                for f in ceiling.json ceiling-end.json "generator-$bench.json" runner.md; do
                  if [ -f "$job/$f" ]; then cp "$job/$f" "$dir/"; fi
                done
              elif [ ! -f "$dir/runner.md" ] && [ -f "$job/runner.md" ]; then
                cp "$job/runner.md" "$dir/"
              fi
            done
            {
              echo "## $bench"
              if [ "$GRID" = full ]; then
                echo "Each RTT ran in its own job, on its own runner: its ceilings are that runner's, measured at the job's start, and its disk was measured again at the job's end. The runner and the generator's measure below are the first RTT's job's."
              else
                echo "The ceilings and the generator's measure below are those of the job of the first seed and RTT; every job ran on a runner of the same type."
              fi
              if [ -f "$dir/runner.md" ]; then cat "$dir/runner.md"; fi
              echo '```'
              for p in jobs/bench-"$bench"-*/rtt-*/probe.txt; do
                [ -f "$p" ] && echo "$(basename "$(dirname "$(dirname "$p")")"): $(tr '\n' ' ' <"$p")"
              done
              echo '```'
              bin/benchreport -noise bench/noise.json "$dir" || status=1
            } >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$status"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: report
          path: merged
          retention-days: 30
