name: bench
on:
  workflow_dispatch:
jobs:
  research576gouring:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: bench/research576/gouring/go.mod
      - name: Tools and runner
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace
          mkdir -p results
          { uname -a; lscpu; go version; ulimit -l; cat /proc/sys/kernel/io_uring_disabled; grep -E 'Seccomp|Cap' /proc/self/status; } | tee results/runner.txt
          cd bench/research576/gouring
          go test ./...
          go build -o "$GITHUB_WORKSPACE/gouring576" .
      - name: Measure
        run: bash bench/research576/gouring/run.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: research576gouring
          path: results
          retention-days: 30
