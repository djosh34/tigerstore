# Throwaway extension of PR86 bench. Never merge this workflow.
name: bench
on:
  workflow_dispatch:
    inputs:
      cases:
        description: JSON list of workload-size-ingress-cN or workload-size-ingress-open
        default: '["put-1k-leader-c256"]'
      reps:
        default: '5'
      duration:
        default: '3s'
      rates:
        description: JSON object of target to rate array for open-loop jobs
        default: '{}'
      targets:
        default: 'tigerstore etcd'
      warmup:
        default: '1s'
      conns:
        description: Connections. Keep18 for balanced primary runs.
        default: '18'
      profile:
        description: none, cpu or trace. Diagnostic runs, not headline measurements.
        default: 'none'
permissions:
  contents: read
jobs:
  bench:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: ${{ fromJSON(inputs.cases) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v7
      - name: Deadline
        run: test "$(date -u +%s)" -lt "$(date -ud 2026-10-13T22:00:00Z +%s)"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install etcd v3.7.2
        run: |
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" https://github.com/etcd-io/etcd/releases/download/v3.7.2/etcd-v3.7.2-linux-arm64.tar.gz
          echo "5e3ff99d428fabfcefdc95348f6560d1efe835f7b2d1ab3334fe0831076966b7  $RUNNER_TEMP/etcd.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
          mkdir -p bin
          cp "$RUNNER_TEMP/etcd-v3.7.2-linux-arm64/etcd" "$RUNNER_TEMP/etcd-v3.7.2-linux-arm64/etcdctl" bin/
      - name: Build
        run: |
          go build -o bin/loadgen ./cmd/loadgen
          go build -o bin/tigerstore ./cmd/tigerstore
          ln -s tigerstore bin/tigerstore-static
          go test -short -parallel 2 ./cmd/loadgen ./internal/osfs
      - name: Build and test byte-cap controls
        if: contains(inputs.targets, 'cap')
        run: bash experiments/shape/build-caps.sh
      - name: Measure
        env:
          CASE: ${{ matrix.case }}
          REPS: ${{ inputs.reps }}
          DURATION: ${{ inputs.duration }}
          WARMUP: ${{ inputs.warmup }}
          RATES: ${{ inputs.rates }}
          TARGETS: ${{ inputs.targets }}
          PROFILE: ${{ inputs.profile }}
          CONNS: ${{ inputs.conns }}
        run: bash experiments/shape/run.sh
      - name: Profile analysis
        if: always() && inputs.profile != 'none'
        run: |
          mkdir -p results/binaries
          cp bin/tigerstore bin/loadgen results/binaries/
          find results -name '*cpu.pb.gz' -print0 | while IFS= read -r -d '' f; do
            go tool pprof -top -nodecount=100 bin/tigerstore "$f" > "$f.top.txt"
          done
          find results -name '*.trace' -print0 | while IFS= read -r -d '' f; do
            for kind in sched syscall sync net; do
              go tool trace -pprof="$kind" "$f" > "$f.$kind.pb.gz"
              go tool pprof -top -nodecount=60 "$f.$kind.pb.gz" > "$f.$kind.txt"
            done
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shape-${{ matrix.case }}
          path: results
