# Research #580 only (branch research/580-ablations): mixed-k8s ablations
# and primitive microbenchmarks on ubuntu-24.04-arm, pinned like the bench
# (generator CPU 3, leader 0, followers 1 and 2).
name: bench

on:
  workflow_dispatch:
    inputs:
      what:
        description: ablate or micro
        default: ablate
      variants:
        description: ablation variants
        default: base nogc plain follow nolist bold
      reps:
        description: repetitions
        default: "3"

jobs:
  run:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install etcdctl v3.7.2
        run: |
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" https://github.com/etcd-io/etcd/releases/download/v3.7.2/etcd-v3.7.2-linux-arm64.tar.gz
          echo "5e3ff99d428fabfcefdc95348f6560d1efe835f7b2d1ab3334fe0831076966b7  $RUNNER_TEMP/etcd.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
          mkdir -p bin
          cp "$RUNNER_TEMP/etcd-v3.7.2-linux-arm64/etcdctl" bin/
      - name: Build
        run: |
          go build -o bin/loadgen ./cmd/loadgen
          go build -o bin/tigerstore ./cmd/tigerstore
          scripts/dev-certs.sh certs
          sudo mount -o remount,barrier=1 /
          mkdir -p results
          { uname -a; lscpu | grep -E 'Model name|^CPU\(s\)'; free -b | head -2; go version; git rev-parse HEAD; } | tee results/runner.txt
      - name: Ablations
        if: inputs.what == 'ablate'
        env:
          VARIANTS: ${{ inputs.variants }}
          REPS: ${{ inputs.reps }}
        run: bench/research580.sh
      - name: Microbenchmarks
        if: inputs.what == 'micro'
        run: |
          go test -c -o bin/r580.test ./bench/research580
          taskset -c 3 bin/r580.test -test.run '^$' -test.bench . -test.benchtime 1s -test.count 3 -test.cpu 1 | tee results/micro.txt
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat results/runner.txt; cat results/summary.jsonl 2>/dev/null; cat results/failures 2>/dev/null; grep -h Benchmark results/micro.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: research580-${{ inputs.what }}
          path: results
          retention-days: 30
