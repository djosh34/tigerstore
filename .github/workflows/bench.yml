name: research574
on:
  workflow_dispatch:
jobs:
  census:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      max-parallel: 2
      matrix:
        include:
          - {name: current-1, seed: 1, mix: '18,10,2,50,12,8'}
          - {name: current-5, seed: 5, mix: '18,10,2,50,12,8'}
          - {name: old-1, seed: 1, mix: '25,0,10,40,15,10'}
    env:
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p bin results
          go build -o bin/loadgen ./cmd/loadgen
          go build -o bin/candidate ./cmd/tigerstore
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" https://github.com/etcd-io/etcd/releases/download/v3.7.2/etcd-v3.7.2-linux-arm64.tar.gz
          echo "5e3ff99d428fabfcefdc95348f6560d1efe835f7b2d1ab3334fe0831076966b7  $RUNNER_TEMP/etcd.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/etcd-v3.7.2-linux-arm64/etcdctl" bin/
          scripts/dev-certs.sh certs
      - name: Record response reuse, not throughput
        env:
          SEED: ${{ matrix.seed }}
          MIX: ${{ matrix.mix }}
          CERTS: certs
          ETCDCTL: bin/etcdctl
          BENCH_GOMEMLIMIT: 3GiB
          RESEARCH574: '1'
        run: |
          sudo mount -o remount,barrier=1 /
          dir="$RUNNER_TEMP/cluster"
          trap 'bench/cluster.sh stop "$dir"' EXIT
          bench/cluster.sh start tigerstore "$PWD/bin/candidate" "$dir" 0 1 2
          cp "$dir/placement.json" results/
          { git rev-parse HEAD; uname -a; lscpu; free -b; go version; } > results/runner.txt
          sample() {
            for ep in $(tr ',' ' ' < "$dir/endpoints"); do
              curl -fsS --cacert certs/ca.pem --cert certs/client.pem --key certs/client-key.pem "https://$ep/metrics" > "results/metrics-$1-${ep##*:}.txt"
            done
          }
          # Before includes no preload; after includes preload and warmup.
          sample before
          taskset -c 3 bin/loadgen -endpoints "$(cat "$dir/endpoints")" \
            -cacert certs/ca.pem -cert certs/client.pem -key certs/client-key.pem \
            -pids "$(cat "$dir/pids")" -workload mixed -keys 1000000 \
            -conns 6 -streams 48 -warmup 3s -duration 10s -seed "$SEED" \
            -mix "$MIX" -out results/result.json 2>&1 | tee results/census.log
          sample after
          cp "$dir"/n*.log results/
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: research574-${{ matrix.name }}
          path: results/
