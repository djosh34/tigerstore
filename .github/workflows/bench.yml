# Research-only replacement on research/577-primitive-budget. Never a campaign
# or ceiling change. Independent primitive loops; no tigerstore server is run.
name: bench
on:
  workflow_dispatch:
    inputs:
      candidate:
        default: main
      baseline:
        default: main
      benchmarks:
        default: primitives-577
      rtts:
        default: "0"
      targets:
        default: candidate
      modes:
        default: max
      reps:
        default: "3"
      layouts:
        default: ""
jobs:
  primitives:
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    env:
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build independent primitives and prepare certificates
        run: |
          go build -o bin/research577 ./cmd/research577
          scripts/dev-certs.sh certs
      - name: Measure CPU 0, with a separate TCP source or drainer on CPU 3
        run: |
          mkdir -p results
          { git rev-parse HEAD; lscpu; free -b; uname -a; go version; } > results/runner.txt
          taskset -c 0 bin/research577 -certs certs -reps 3 -duration 400ms | tee results/primitives.jsonl
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: research-577-${{ matrix.repetition }}
          path: results
          retention-days: 30
