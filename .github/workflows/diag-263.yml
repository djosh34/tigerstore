name: diag 263 silent removed member
on:
  push:
    branches: [diag/263-removed-member]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Silent removed member, 10 repetitions
        run: go test -v -count=10 -timeout=90s ./internal/peer -run '^TestDiag263SilentRemovedMember$'
