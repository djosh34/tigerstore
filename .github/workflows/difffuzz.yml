# The long differential fuzzing run of #148: scripts/difffuzz.sh against a
# fresh etcd v3.7.2 and a fresh 3-node tigerstore, in four jobs with seeds
# of their own, for the given duration each. Started by hand:
#   gh workflow run difffuzz.yml -f duration=2h
# A mismatch is shrunk into a named case and uploaded; commit it to
# difftest/testdata/fuzz, where TestDiffFuzzFound runs it on every PR.
name: difffuzz

on:
  workflow_dispatch:
    inputs:
      duration:
        description: How long each job fuzzes, a Go duration
        required: true
        default: 2h

permissions:
  contents: read

jobs:
  fuzz:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install etcd v3.7.2
        run: |
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" https://github.com/etcd-io/etcd/releases/download/v3.7.2/etcd-v3.7.2-linux-arm64.tar.gz
          echo "5e3ff99d428fabfcefdc95348f6560d1efe835f7b2d1ab3334fe0831076966b7  $RUNNER_TEMP/etcd.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
      - name: Fuzz
        env:
          ETCD: ${{ runner.temp }}/etcd-v3.7.2-linux-arm64/etcd
          DURATION: ${{ inputs.duration }}
          RUN_ID: ${{ github.run_id }}
          SHARD: ${{ matrix.shard }}
        run: SEED=$(( ((RUN_ID % 1000000000) * 4 + SHARD) * 1000000000 + 1 )) scripts/difffuzz.sh
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: difffuzz-mismatch-${{ matrix.shard }}
          path: difftest/testdata/fuzz/
