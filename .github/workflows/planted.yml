# The planted bugs guard the checkers and the simulator. They run on the
# push to main, nightly, and on a pull request that changes one of those.
# This workflow is not part of the required check ci.
name: planted

on:
  pull_request:
    paths:
      - "check/**"
      - "internal/sim/**"
      - "internal/simrun/**"
      - "scripts/sim.sh"
      - "tools/gosim/**"
      - ".github/workflows/planted.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      bugs:
        description: "The bugs to run, separated by spaces; all if empty"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # A dispatch runs on its own: several can run a ref's bugs side by side.
  group: planted-${{ github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every node a test starts formats a log ring of 512 MiB, not the 2 GiB a
# quota's default sizes (#602's ruling: tests format no gigabytes); the
# bench, the release and the soak, which sizes it from its disk budget,
# keep theirs.
env:
  ETCD_UNSAFE_LOG_RING_BYTES: "536870912"

jobs:
  # Every planted bug (internal/planted) in turn must be caught within its
  # seed budget, under gosim; TestPlanted fails otherwise, and a crash is
  # a failure too. TestPlantedInventory checks that BUGS names every bug.
  # A bug that is not caught prints the command that runs it again; a
  # seed that failed on another check prints its own. The run that caught
  # each bug is uploaded, in sim-out/<bug>/, with its trace, history,
  # disks, hashes and replay command.
  planted:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      BUGS: B01a B01b B02 B03 B04a B04b B04c B05 B06a B06b B06c B06d B07 B08 B09a B09b B10 B11 B12 B15 B16 B17 B18 B19 B20 B21 B22 B23 B24 B27 B28 B31 B33 B34 B35 B36
      TAGS: planted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Builds the simulator's gosim and native test binaries, and runs
      # no test.
      - run: scripts/sim.sh ./internal/sim '^$'
      - name: Catch every planted bug
        shell: bash
        env:
          SIM_OUT: ${{ runner.temp }}/sim-out
          ONLY: ${{ inputs.bugs }}
        run: |
          set -uo pipefail
          export GOSIMTOOL="$GITHUB_WORKSPACE/.gosim/bin/gosim"
          status=0
          mkdir -p "$RUNNER_TEMP/logs"
          (cd internal/sim && "$GITHUB_WORKSPACE/.gosim/bin/sim-planted.test" -test.run 'TestPlantedInventory$') 2>&1 | tee "$RUNNER_TEMP/logs/inventory.log" || { status=1; echo "::error::TestPlantedInventory failed; replay: go test -tags planted -count=1 ./internal/sim/ -run '^TestPlantedInventory$'"; }
          for bug in ${ONLY:-$BUGS}; do
            echo "::group::$bug"
            (cd internal/sim && SIM_PLANTED="$bug" SIM_OUT="$SIM_OUT/$bug" "$GITHUB_WORKSPACE/.gosim/bin/sim-planted.test" -test.run '^TestPlanted$' -test.v -test.timeout 28m) 2>&1 | tee "$RUNNER_TEMP/logs/$bug.log" || {
              status=1
              echo "::error::$bug was not caught; replay: SIM_PLANTED=$bug TAGS=planted scripts/sim.sh ./internal/sim '^TestPlanted$'"
            }
            echo "::endgroup::"
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: planted
          path: |
            ${{ runner.temp }}/sim-out
            ${{ runner.temp }}/logs
          retention-days: 30
