name: planted
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  b20-seed-one:
    strategy:
      fail-fast: false
      matrix:
        storage: [e3243229, 2fef0b5d]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Select storage implementation
        env:
          STORAGE: ${{ matrix.storage }}
        run: git checkout "$STORAGE" -- check internal/osfs internal/wal
      - name: Replay only B20 seed 1
        env:
          SIM_OUT: ${{ runner.temp }}/sim-out
        run: |
          set -o pipefail
          go test -tags planted -count=1 -v -timeout 2m ./internal/sim/ -run '^TestPlanted$/^1$' -args -planted=B20 2>&1 | tee "$RUNNER_TEMP/replay.log"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diag-296-${{ matrix.storage }}
          path: |
            ${{ runner.temp }}/replay.log
            ${{ runner.temp }}/sim-out
