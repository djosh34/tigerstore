name: planted
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cancellation:
    strategy:
      fail-fast: false
      matrix:
        fix: [without, with]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Remove only the proposed cancellation guard
        if: matrix.fix == 'without'
        run: git checkout f4d7b9f9 -- internal/node/node.go
      - name: Queued input at cancellation
        run: |
          set -o pipefail
          go test -count=1 -v -timeout 1m ./internal/node/ -run '^TestCommitStopsAfterCancelledTurn$' 2>&1 | tee "$RUNNER_TEMP/cancel.log"
      - name: Replay only B20 seed 1
        if: always()
        env:
          SIM_OUT: ${{ runner.temp }}/sim-out
        run: |
          set -o pipefail
          go test -tags planted -count=1 -v -timeout 2m ./internal/sim/ -run '^TestPlanted$/^1$' -args -planted=B20 2>&1 | tee "$RUNNER_TEMP/replay.log"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diag-296-${{ matrix.fix }}
          path: |
            ${{ runner.temp }}/cancel.log
            ${{ runner.temp }}/replay.log
            ${{ runner.temp }}/sim-out
