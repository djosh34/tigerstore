name: diag-287

on:
  workflow_dispatch:
    inputs:
      remove_fix:
        description: Remove the candidate fix to demonstrate red again
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  snapshot-catch:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        revision: [250b8881, 6b952fef, fa55dee2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Overlay only the reproduction and candidate fix on the comparison revision
        env:
          REVISION: ${{ matrix.revision }}
          REMOVE_FIX: ${{ inputs.remove_fix }}
        run: |
          cp internal/sim/diag287_test.go "$RUNNER_TEMP/diag287_test.go"
          git diff 250b8881 -- internal/sim/planted_test.go > "$RUNNER_TEMP/fix.patch"
          git checkout "$REVISION"
          cp "$RUNNER_TEMP/diag287_test.go" internal/sim/diag287_test.go
          if [ "$REMOVE_FIX" != true ] && [ -s "$RUNNER_TEMP/fix.patch" ]; then
            git apply "$RUNNER_TEMP/fix.patch"
          fi
          git diff -- internal/sim/planted_test.go
      - name: Deterministic snapshot detection (one test, no seed campaign)
        run: go test -v -tags planted -count=1 -timeout 60s ./internal/sim -run '^TestDiag287SnapshotCatch$'
      - name: Original seed 1 only
        if: success() && matrix.revision == '250b8881'
        run: go test -v -tags planted -count=1 -timeout 90s ./internal/sim -run '^TestPlanted$/^1$' -args -planted=B04c
