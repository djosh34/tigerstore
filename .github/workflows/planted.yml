# The planted bugs guard the checkers and the simulator. They run on the
# push to main, nightly, and on a pull request that changes one of those.
# This workflow is not part of the required check ci.
name: planted

on:
  pull_request:
    paths:
      - "check/**"
      - "internal/sim/**"
      - "internal/simrun/**"
      - "scripts/sim.sh"
      - "tools/gosim/**"
      - ".github/workflows/planted.yml"
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planted-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every planted bug (internal/planted) in turn must be caught within its
  # seed budget, under gosim; TestPlanted fails otherwise, and a crash is
  # a failure too. TestPlantedInventory checks that BUGS names every bug.
  # A bug that is not caught prints the command that runs it again; a
  # seed that failed on another check prints its own. The run that caught
  # each bug is uploaded, in sim-out/<bug>/, with its trace, history,
  # disks, hashes and replay command.
  planted:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      BUGS: B01a B01b B02 B03 B04a B04b B04c B05 B06a B06b B06c B06d B07 B08 B09a B09b B10 B11 B12 B13 B14 B15 B16 B17 B18 B19 B20 B21 B22 B23 B24 B25 B26 B27 B28 B29 B30 B31 B32
      TAGS: planted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Builds each package's gosim and native test binaries, and runs
      # no test.
      - run: for pkg in sim node peer; do scripts/sim.sh "./internal/$pkg" '^$'; done
      - name: Catch every planted bug
        shell: bash
        env:
          SIM_OUT: ${{ runner.temp }}/sim-out
        run: |
          set -uo pipefail
          export GOSIMTOOL="$GITHUB_WORKSPACE/.gosim/bin/gosim"
          status=0
          mkdir -p "$RUNNER_TEMP/logs"
          (cd internal/sim && "$GITHUB_WORKSPACE/.gosim/bin/sim-planted.test" -test.run 'TestPlantedInventory$') 2>&1 | tee "$RUNNER_TEMP/logs/inventory.log" || { status=1; echo "::error::TestPlantedInventory failed; replay: go test -tags planted -count=1 ./internal/sim/ -run '^TestPlantedInventory$'"; }
          for bug in $BUGS; do
            echo "::group::$bug"
            for pkg in sim node peer; do
              (cd "internal/$pkg" && SIM_PLANTED="$bug" SIM_OUT="$SIM_OUT/$bug" "$GITHUB_WORKSPACE/.gosim/bin/$pkg-planted.test" -test.run '^TestPlanted$' -test.v -test.timeout 28m) 2>&1 | tee "$RUNNER_TEMP/logs/$bug-$pkg.log" || {
                status=1
                echo "::error::$bug was not caught in internal/$pkg; replay: SIM_PLANTED=$bug TAGS=planted scripts/sim.sh ./internal/$pkg '^TestPlanted$'"
              }
            done
            echo "::endgroup::"
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: planted
          path: |
            ${{ runner.temp }}/sim-out
            ${{ runner.temp }}/logs
          retention-days: 30
