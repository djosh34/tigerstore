name: diag 302 B22

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Compare four revisions on the same short reproduction
        shell: bash
        run: |
          set -uo pipefail
          diag="$GITHUB_SHA"
          mkdir -p "$RUNNER_TEMP/diag302"
          cp internal/sim/diag302_test.go "$RUNNER_TEMP/diag302_test.go"
          status=0
          for rev in e3243229 8c720710 01deaf78 3e026b7d; do
            git checkout --detach "$rev"
            cp "$RUNNER_TEMP/diag302_test.go" internal/sim/diag302_test.go
            echo "::group::$rev deterministic reproduction"
            go test -v -tags planted -count=1 -timeout=2m ./internal/sim/ -run '^TestDiag302' 2>&1 | tee "$RUNNER_TEMP/diag302/$rev-regression.log" || status=1
            echo '::endgroup::'
            echo "::group::$rev seed 34"
            SIM_OUT="$RUNNER_TEMP/diag302/$rev-seed" go test -v -tags planted -count=1 -timeout=2m ./internal/sim/ -run '^TestPlanted$/^34$' -args -planted=B22 2>&1 | tee "$RUNNER_TEMP/diag302/$rev-seed.log"
            echo '::endgroup::'
            rm internal/sim/diag302_test.go
          done
          git checkout --detach "$diag"
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diag302
          path: ${{ runner.temp }}/diag302
          retention-days: 30
