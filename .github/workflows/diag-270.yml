name: diag-270
on:
  push:
    branches: [diag/270-lazyfs-checksum]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 8965025883
            steps: 4
          - seed: 8746132061
            steps: 8
          - seed: 7663907164
            steps: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install FUSE build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake g++ libfuse3-dev fuse3
      - name: Build
        run: |
          echo "LAZYFS=$(scripts/lazyfs.sh "$RUNNER_TEMP/lazyfs")" >> "$GITHUB_ENV"
          go build -o "$RUNNER_TEMP/tigerstore" ./cmd/tigerstore
          go build -o "$RUNNER_TEMP/chaos" ./cmd/chaos
      - name: Replay only the failing prefix
        run: |
          status=0
          for attempt in 1 2 3 4; do
            "$RUNNER_TEMP/chaos" -tigerstore "$RUNNER_TEMP/tigerstore" -seed ${{ matrix.seed }} -diag-steps ${{ matrix.steps }} -out "$RUNNER_TEMP/evidence/attempt-$attempt" -env -lazyfs "$LAZYFS" || status=1
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diag-270-${{ matrix.seed }}
          path: ${{ runner.temp }}/evidence
          retention-days: 7
