name: Compression prototype (#135)
on:
  push:
    branches: [exp/135-compress]
    paths:
      - 'experiments/compress135/**'
      - '.github/workflows/exp-compress135.yml'
permissions:
  contents: read
jobs:
  compress:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
          cache: false
      - name: Cluster, trace, dump and measure
        run: bash experiments/compress135/run.sh
      - name: Upload aggregates only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compress135-results
          path: experiments/compress135/results/
          retention-days: 14
