name: exp485-stack
on:
  push:
    branches: [exp/485-sim-ceiling]
    paths: ['research/485/stack/**', '.github/workflows/exp485-stack.yml']
permissions:
  contents: read
jobs:
  stack:
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install fio
        run: sudo apt-get update -qq && sudo apt-get install -y fio
      - name: Benchmark retained production stack and runner
        run: bash research/485/stack/run.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: exp485-stack-${{ matrix.runner }}
          path: research/485/stack/results
          retention-days: 30
