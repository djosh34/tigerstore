name: Correctness round 2 clocks
on:
  push:
    branches: [exp/correct-round2-clocks]
    paths:
      - '.github/workflows/correct-round2-clocks.yml'
      - 'experiments/correct-round2-clocks/campaign.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      cases: ${{ steps.plan.outputs.cases }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        shell: bash
        run: |
          test "$(date -u +%s)" -lt "$(date -u -d 2026-10-13T22:00:00Z +%s)"
          echo "cases=$(jq -c . experiments/correct-round2-clocks/campaign.json)" >> "$GITHUB_OUTPUT"
  faults:
    needs: plan
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.cases) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      GOFLAGS: -p=2
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build pinned product and test tools
        shell: bash
        run: |
          test "$(date -u +%s)" -lt "$(date -u -d 2026-10-13T22:00:00Z +%s)"
          mkdir -p bin evidence
          product=5d964228952d6983ba273bc2e6813770aad796c6
          git worktree add --detach "$RUNNER_TEMP/product" "$product"
          (cd "$RUNNER_TEMP/product" && go build -o "$GITHUB_WORKSPACE/bin/tigerstore" ./cmd/tigerstore)
          (cd experiments/correct-round1 && go test -parallel 2 ./client && go vet ./client && go build -o "$GITHUB_WORKSPACE/bin/chaos-client" ./client)
          go build -o bin/clock-canary experiments/correct-round2-clocks/canary.go
          gcc -O2 -Wall -o bin/clockwrap experiments/correct-round2-clocks/clockwrap.c
          python3 -m unittest discover -s experiments/correct-round1 -p 'test_*.py'
          printf 'product=%s\ntooling=%s\n' "$product" "$GITHUB_SHA" > evidence/commits.txt
          go version >> evidence/commits.txt
      - name: Install stock etcd v3.7.2
        shell: bash
        run: |
          case "$(uname -m)" in
            aarch64) arch=arm64; sha=5e3ff99d428fabfcefdc95348f6560d1efe835f7b2d1ab3334fe0831076966b7;;
            x86_64) arch=amd64; sha=3a3679bc51a4ee9d30bccea1da7cd4fe62c6fc1d2ca1255068d2c53bf3026135;;
            *) exit 1;;
          esac
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" "https://github.com/etcd-io/etcd/releases/download/v3.7.2/etcd-v3.7.2-linux-$arch.tar.gz"
          echo "$sha  $RUNNER_TEMP/etcd.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/etcd-v3.7.2-linux-$arch/etcd" bin/etcd
      - name: Record runner and disk barriers
        shell: bash
        run: |
          sudo mount -o remount,barrier=1 /
          { uname -a; lscpu; free -b; findmnt -T "$RUNNER_TEMP" -o TARGET,SOURCE,FSTYPE,OPTIONS; bin/etcd --version; } > evidence/runner.txt
          test "$(findmnt -T "$RUNNER_TEMP" -n -o FSTYPE)" = ext4
          ! findmnt -T "$RUNNER_TEMP" -n -o OPTIONS | grep -Eq 'nobarrier|barrier=0'
      - name: Run faults
        id: faults
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SCENARIO: ${{ matrix.scenario }}
          SEED: ${{ matrix.seed }}
          REP: ${{ matrix.rep }}
          DURATION: ${{ matrix.duration }}
          VALUE_SIZE: ${{ matrix.value_size }}
          NEAR: ${{ matrix.near_limit }}
          ROLE: ${{ matrix.role }}
          QUOTA: ${{ matrix.quota || 5 }}
        run: |
          test "$(date -u +%s)" -lt "$(date -u -d 2026-10-13T22:00:00Z +%s)"
          flags=()
          if test "$NEAR" = true; then flags+=(--near-limit); fi
          rate=1
          if test "$VALUE_SIZE" = 1024; then rate=5; fi
          sudo -E python3 experiments/correct-round2-clocks/runner.py \
            --target "$TARGET" --scenario "$SCENARIO" --server "$PWD/bin/$TARGET" --client "$PWD/bin/chaos-client" \
            --clockwrap "$PWD/bin/clockwrap" --canary "$PWD/bin/clock-canary" \
            --out "$PWD/evidence/run" --seed "$SEED" --repetition "$REP" --duration "$DURATION" \
            --value-size "$VALUE_SIZE" --rate "$rate" --fault-role "$ROLE" --quota-percent "$QUOTA" "${flags[@]}" \
            2>&1 | tee evidence/controller.log
      - name: Run every checker including on failed histories
        if: always() && steps.faults.outcome != 'skipped'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo -E python3 experiments/correct-round2-clocks/run-checks.py \
            --client "$PWD/bin/chaos-client" --backend "$TARGET" --out "$PWD/evidence/run" 2>&1 | tee evidence/checks.log
      - name: Preserve attempt metadata
        if: always()
        shell: bash
        env:
          CASE: ${{ toJSON(matrix) }}
          JOB_STATUS: ${{ job.status }}
          CONTROLLER_OUTCOME: ${{ steps.faults.outcome }}
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('evidence/attempt.json').write_text(json.dumps({
            'case': json.loads(os.environ['CASE']), 'job_status': os.environ['JOB_STATUS'],
            'controller_outcome': os.environ['CONTROLLER_OUTCOME'], 'tooling': os.environ['GITHUB_SHA'],
            'run_id': os.environ['GITHUB_RUN_ID'], 'product': '5d964228952d6983ba273bc2e6813770aad796c6'}, indent=2)+'\n')
          PY
          sudo chmod -R a+rX evidence
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: clocks-${{ matrix.runner }}-${{ matrix.target }}-${{ matrix.scenario }}-${{ matrix.role }}-${{ matrix.seed }}-${{ matrix.rep }}
          path: evidence
          retention-days: 30
