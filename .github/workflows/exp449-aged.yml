# Research #449, exp branch only: an aged cluster and forks from it
# (TestAgedForks). Each cell is a job.
name: exp449-aged
on:
  push:
    branches: [exp/449-aged-state-proto]
permissions:
  contents: read
jobs:
  cell:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: r1-1k-age20-forks0to2, objects: 1000, age: 20, forks: 3, fork: 60, check: 0, calm: 0, twice: 0, first: 0}
          - {name: r2-1k-age20-fork2-alone, objects: 1000, age: 20, forks: 1, fork: 60, check: 0, calm: 0, twice: 0, first: 2}
          - {name: r3-10k-age60-forks0to2, objects: 10000, age: 60, forks: 3, fork: 120, check: 0, calm: 0, twice: 0, first: 0}
          - {name: r4-10k-age60-fork2-alone, objects: 10000, age: 60, forks: 1, fork: 120, check: 0, calm: 0, twice: 0, first: 2}
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/sim.sh ./internal/sim '^$'
      - name: Cell
        env:
          SIM_SEED: "7"
          SIM_AGE_OBJECTS: ${{ matrix.objects }}
          SIM_AGE_MINUTES: ${{ matrix.age }}
          SIM_FORKS: ${{ matrix.forks }}
          SIM_FORK_SECONDS: ${{ matrix.fork }}
          SIM_FORK_FIRST: ${{ matrix.first || 0 }}
          SIM_FORK_RESEED: "1"
          SIM_AGE_CHECK: ${{ matrix.check }}
          SIM_AGE_CALM: ${{ matrix.calm }}
          SIM_TWICE: ${{ matrix.twice }}
        run: bash scripts/exp449.sh
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.name }}
          path: ${{ runner.temp }}/cell.log
          retention-days: 14
