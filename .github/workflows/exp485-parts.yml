# Research #485, exp branch only: short seeds at faulted phases of 5 to
# 1,280 simulated seconds, with real-time marks per phase, CPU profiles
# and four processes at once; and TestSeeds on main as shipped.
name: exp485-parts
run-name: exp485-parts ${{ github.event.head_commit.message }}
on:
  push:
    branches: [exp/485-sim-ceiling]
    paths: ['research/485/parts/**', '.github/workflows/exp485-parts.yml']
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      cells: ${{ steps.p.outputs.cells }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        run: echo "cells=$(jq -c . research/485/parts/cells.json)" >>"$GITHUB_OUTPUT"
  cell:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        cell: ${{ fromJSON(needs.plan.outputs.cells) }}
    runs-on: ${{ matrix.cell.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/sim.sh ./internal/sim '^$'
      - run: nproc; free -m
      - name: Cell
        env:
          TEST: ${{ matrix.cell.test }}
          D: ${{ matrix.cell.d }}
          SEEDS: ${{ matrix.cell.seeds }}
          PROCS: ${{ matrix.cell.procs }}
          PROFILE: ${{ matrix.cell.profile }}
          FAULTS: ${{ matrix.cell.faults }}
          FIRST: "1"
          OUT: ${{ runner.temp }}/cell
        run: research/485/parts/run.sh
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: exp485-parts-${{ matrix.cell.name }}
          path: ${{ runner.temp }}/cell
          retention-days: 14
