# Research #441, exp branch only: long seeds with timing marks and CPU
# profiles, and the checkers natively on their saved histories.
name: kube-sim
run-name: exp441 ${{ inputs.label }}

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: JSON list of seeds
        required: true
      label:
        description: Label
        default: ""
      minutes:
        description: Virtual minutes of each seed, 240 when empty
        default: ""

permissions:
  contents: read

jobs:
  seed:
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(inputs.seeds) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/sim.sh ./internal/sim '^$'
      - run: nproc; free -m
      - name: Seed
        env:
          SEED: ${{ matrix.seed }}
          EXP441_MINUTES: ${{ inputs.minutes }}
          OUT: ${{ runner.temp }}/exp441
        run: |
          if [[ "$SEED" != *" "* ]]; then
            exec scripts/exp441.sh
          fi
          # Several seeds at once on this runner.
          mkdir -p "$OUT"
          for s in $SEED; do
            OUT=$OUT/$s SEED=$s NOPKILL=1 NOCHECK=1 scripts/exp441.sh >"$OUT/$s.txt" 2>&1 &
          done
          ( peak=0; while sleep 5; do m=$(free -m | awk '/Mem:/ {print $3}'); [ "$m" -gt "$peak" ] && peak=$m && echo "$peak" >"$OUT/peak-used-mib"; done ) &
          wait $(jobs -p | head -n -1)
          echo "peak used memory of the runner: $(cat "$OUT/peak-used-mib") MiB"
          for s in $SEED; do echo "== $s"; head -1 "$OUT/$s.txt"; grep -E 'driver gosim|phase (run|own-checks|hashes|checkable|witness|checkers)' "$OUT/$s.txt"; mkdir -p "$OUT/par"; cp "$OUT/$s.txt" "$OUT/par/"; done
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: exp441-${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/exp441/seed.log
            ${{ runner.temp }}/exp441/cpu.*
            ${{ runner.temp }}/exp441/history.json.gz
            ${{ runner.temp }}/exp441/par
            ${{ runner.temp }}/exp441/*/cpu.*
          retention-days: 14
