name: pre47 batch256 experiment
on:
  push:
    branches: [exp/pre-47-batch256]
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'experiments/pre47batch256/**'
      - '.github/workflows/pre47batch256.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: Short diagnostic ablations
        env:
          CLIENTS: '256'
          MODE: diagnose
        run: timeout --kill-after=5s 820s bash experiments/pre47batch256/run.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pre47-batch256-diagnose
          path: evidence/pre47batch256
          retention-days: 14
