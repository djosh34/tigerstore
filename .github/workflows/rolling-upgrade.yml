name: rolling-upgrade

on:
  workflow_dispatch:
    inputs:
      diagnostic_saved_wal:
        description: Same-VM off-gate main/candidate scans of the original failed node1 WAL
        type: boolean
        default: false
      diagnostic_no_profile:
        description: Preserve exact unobserved race binaries and original component-test prelude
        type: boolean
        default: false
      diagnostic_repeats:
        description: Original 148/174 sequence repetitions, all retained
        type: choice
        options: ['1', '4']
        default: '1'
      diagnostic_174:
        description: Matched main and PR race diagnosis, isolated 174 and original 148/174 sequence, with CPU chunks
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read
  actions: read

# Every node a test starts formats a log ring of 512 MiB, not the 2 GiB a
# quota's default sizes (#602's ruling: tests format no gigabytes); the
# bench, the release and the soak, which sizes it from its disk budget,
# keep theirs.
env:
  ETCD_UNSAFE_LOG_RING_BYTES: "536870912"

jobs:
  savedWAL:
    if: inputs.diagnostic_saved_wal
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Same-VM immutable saved-WAL component isolation (not rolling reproduction)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/saved-wal-diagnostic.py --out "$RUNNER_TEMP/saved-wal-diagnostic"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: saved-wal-component-DIAGNOSTIC-NOT-GATE
          path: ${{ runner.temp }}/saved-wal-diagnostic
          retention-days: 14
  diagnostic174:
    if: inputs.diagnostic_174
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: main
            ref: 55b32bb9e6ef692cdb9d1b0e3cdb16542811dec4
          - label: candidate
            ref: 2f61154a8a95a8ce56b71e8bbd02775ce4c1ea2f
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Record runner
        run: |
          { uname -a; lscpu; free -b; go version; } > "$RUNNER_TEMP/rolling-runner.txt"
      - name: Race reproduction and CPU diagnosis, never a gate waiver
        env:
          NODE_REF: ${{ matrix.ref }}
          NO_PROFILE: ${{ inputs.diagnostic_no_profile }}
          REPEATS: ${{ inputs.diagnostic_repeats }}
        run: |
          args=()
          if [ "$NO_PROFILE" = true ]; then args+=(--no-profile); fi
          python3 -B scripts/rolling174-diagnostic.py --ref "$NODE_REF" --out "$RUNNER_TEMP/rolling-diagnostic" --repeats "$REPEATS" "${args[@]}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rolling174-diagnostic-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/rolling-diagnostic
            ${{ runner.temp }}/rolling-runner.txt
          retention-days: 30
  rolling:
    if: ${{ !inputs.diagnostic_174 && !inputs.diagnostic_saved_wal }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race, rollback-before-announcement, confirmation-removed]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          gofmt -d cmd/chaos/rolling_test.go > "$RUNNER_TEMP/formatting.patch"
          test ! -s "$RUNNER_TEMP/formatting.patch"
      - name: Build the two format ranges
        env:
          MODE: ${{ matrix.mode }}
        run: |
          # The old build reads and writes batch format 1, the new one
          # formats 1 and 2 (internal/wl/format.go). The old build also
          # acts on the wire as a release before the refusal frame
          # (internal/wl/refusal.go, #814): it marks no proposal and
          # knows no refusal.
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path.cwd()
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          rel = 'internal/wl/format.go'
          for name, format in [('old', 1), ('new', 2)]:
              source = (root / rel).read_text()
              assert source.count('const maxFormat = 1\n') == 1
              source = source.replace('const maxFormat = 1\n', f'const maxFormat = {format}\n')
              if os.environ['MODE'] == 'confirmation-removed':
                  # The cluster takes a format on support alone.
                  guard = 'if m.confirmed != n.formatEpoch {'
                  assert source.count(guard) == 1
                  source = source.replace(guard, 'if false {')
              target = tmp / f'{name}-format.go'
              target.write_text(source)
              replace = {str(root / rel): str(target)}
              if name == 'old':
                  refusal = 'internal/wl/refusal.go'
                  source = (root / refusal).read_text()
                  assert source.count('const peerRefusals = true\n') == 1
                  target = tmp / 'old-refusal.go'
                  target.write_text(source.replace('const peerRefusals = true\n', 'const peerRefusals = false\n'))
                  replace[str(root / refusal)] = str(target)
              (tmp / f'{name}.json').write_text(json.dumps({'Replace': replace}))
          PY
          flags=()
          if [ "$MODE" = race ]; then flags=(-race); fi
          go build "${flags[@]}" -overlay "$RUNNER_TEMP/old.json" -o "$RUNNER_TEMP/tigerstore-old" ./cmd/tigerstore
          go build "${flags[@]}" -overlay "$RUNNER_TEMP/new.json" -o "$RUNNER_TEMP/tigerstore-new" ./cmd/tigerstore
          sha256sum "$RUNNER_TEMP"/tigerstore-{old,new}
      - name: The gate's component tests, in both builds
        if: matrix.mode == 'normal' || matrix.mode == 'race'
        env:
          MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [ "$MODE" = race ]; then flags=(-race); fi
          for build in old new; do
            go test "${flags[@]}" -overlay "$RUNNER_TEMP/$build.json" -count=1 -v ./internal/wl -run 'Test(TheClusterTakesAFormat|AMemberThatIsDownHoldsTheFormat|AStaleRunsAnnouncement|AMembershipChangeAsksForConfirmations|ACheckpointKeepsTheGate|TheApplyChecksABatchsFormat|EachStartHasALaterRun|EachRunNamesItsBatchesAfresh|ANamedBatchOfAnEarlierRun|TheLogOfAStoppedNodeReadsBack)'
          done
      - name: Lint the chaos tests
        if: matrix.mode == 'normal'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./cmd/chaos/...
      - name: Rolling upgrade under load
        env:
          MODE: ${{ matrix.mode }}
          ROLLING_OLD: ${{ runner.temp }}/tigerstore-old
          ROLLING_NEW: ${{ runner.temp }}/tigerstore-new
          ROLLING_OUT: ${{ runner.temp }}/rolling
        run: |
          set -o pipefail
          flags=()
          if [ "$MODE" = race ]; then flags=(-race); fi
          test='^TestRollingUpgrade$'
          if [ "$MODE" = rollback-before-announcement ]; then test='^TestRollingRollbackBeforeAnnouncement$'; fi
          if [ "$MODE" = confirmation-removed ]; then
            if go test -count=1 -timeout 8m -v ./cmd/chaos -run '^TestRollingRollbackBeforeAnnouncement$' 2>&1 | tee "$RUNNER_TEMP/result.log"; then
              echo 'The rollback regression missed the removed confirmation check.'
              exit 1
            fi
            grep -q 'format 2 activated while the rollback node was down; want 1 (#174)' "$RUNNER_TEMP/result.log"
            grep -q 'this binary is too old for the cluster' "$ROLLING_OUT/seed-175/old-binary-refused.log"
          else
            go test "${flags[@]}" -count=1 -timeout 8m -v ./cmd/chaos -run "$test" 2>&1 | tee "$RUNNER_TEMP/result.log"
          fi
      # The previous release runs main's engine, so the step from it is
      # offline (TestReleaseUpgrade): its snapshot restored with this
      # source's binary.
      - name: Offline upgrade from the previous release
        if: matrix.mode == 'normal'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ROLLING_OUT: ${{ runner.temp }}/release
        run: |
          set -euo pipefail
          previous=$(gh api "repos/$REPO/releases" -q '[.[] | select(.draft == false and .prerelease == false) | .tag_name][0]')
          gh release download "$previous" --repo "$REPO" --pattern "tigerstore-$previous-linux-arm64" --dir "$RUNNER_TEMP/previous"
          export ROLLING_OLD=$RUNNER_TEMP/previous/tigerstore-$previous-linux-arm64
          export ROLLING_NEW=$RUNNER_TEMP/tigerstore-candidate
          chmod +x "$ROLLING_OLD"
          go build -o "$ROLLING_NEW" ./cmd/tigerstore
          echo "upgrading from $previous"
          go test -count=1 -timeout 8m -v ./cmd/chaos -run '^TestReleaseUpgrade$' 2>&1 | tee "$RUNNER_TEMP/release.log"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rolling-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/rolling
            ${{ runner.temp }}/result.log
            ${{ runner.temp }}/release
            ${{ runner.temp }}/release.log
            ${{ runner.temp }}/formatting.patch
            ${{ runner.temp }}/old.json
            ${{ runner.temp }}/new.json
            ${{ runner.temp }}/old-format.go
            ${{ runner.temp }}/new-format.go
            ${{ runner.temp }}/old-refusal.go
          retention-days: 30
