name: rolling-upgrade

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  rolling:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [normal, race, rollback-before-announcement, confirmation-removed]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          gofmt -d cmd/chaos/rolling_test.go > "$RUNNER_TEMP/formatting.patch"
          test ! -s "$RUNNER_TEMP/formatting.patch"
      - name: Build the two version ranges
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          root = pathlib.Path.cwd()
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          for name, version in [('old', 1), ('new', 2)]:
              replacements = {}
              for rel in ['internal/core/version.go', 'internal/peer/peer.go']:
                  source = (root / rel).read_text()
                  if rel.endswith('version.go'):
                      assert source.count('const MaxVersion = 3') == 1
                      source = source.replace('const MaxVersion = 3', f'const MaxVersion = {version}')
                      if os.environ['MODE'] == 'confirmation-removed':
                          guard = 'if a.hasEpoch {'
                          assert source.count(guard) == 1
                          source = source.replace(guard, 'if false {')
                  else:
                      assert source.count('maxVersion = 2') == 1
                      source = source.replace('maxVersion = 2', f'maxVersion = {version + 1}')
                  target = tmp / f'{name}-{pathlib.Path(rel).name}'
                  target.write_text(source)
                  replacements[str(root / rel)] = str(target)
              (tmp / f'{name}.json').write_text(json.dumps({'Replace': replacements}))
          PY
          flags=()
          if [ "$MODE" = race ]; then flags=(-race); fi
          go build "${flags[@]}" -overlay "$RUNNER_TEMP/old.json" -o "$RUNNER_TEMP/tigerstore-old" ./cmd/tigerstore
          go build "${flags[@]}" -overlay "$RUNNER_TEMP/new.json" -o "$RUNNER_TEMP/tigerstore-new" ./cmd/tigerstore
          sha256sum "$RUNNER_TEMP"/tigerstore-{old,new}
      - name: Version and peer component tests
        if: matrix.mode == 'normal' || matrix.mode == 'race'
        env:
          MODE: ${{ matrix.mode }}
        run: |
          flags=()
          if [ "$MODE" = race ]; then flags=(-race); fi
          go test "${flags[@]}" -count=1 -v ./internal/core -run 'Test(Announce|LateAnnouncement|LegacyAnnouncements|VersionWaits|OldBinary|NewRunAnnounces)'
          go test "${flags[@]}" -count=1 -v ./internal/peer -run 'Test(Pick|SharedVersion|DisjointVersions|RejectsBadPreface|FetchAfterHandshake)'
      - name: Lint the chaos tests
        if: matrix.mode == 'normal'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./cmd/chaos/...
      - name: Rolling upgrade under load
        env:
          MODE: ${{ matrix.mode }}
          ROLLING_OLD: ${{ runner.temp }}/tigerstore-old
          ROLLING_NEW: ${{ runner.temp }}/tigerstore-new
          ROLLING_OUT: ${{ runner.temp }}/rolling
        run: |
          set -o pipefail
          flags=()
          if [ "$MODE" = race ]; then flags=(-race); fi
          test='^TestRollingUpgrade$'
          if [ "$MODE" = rollback-before-announcement ]; then test='^TestRollingRollbackBeforeAnnouncement$'; fi
          if [ "$MODE" = confirmation-removed ]; then
            if go test -count=1 -timeout 8m -v ./cmd/chaos -run '^TestRollingRollbackBeforeAnnouncement$' 2>&1 | tee "$RUNNER_TEMP/result.log"; then
              echo 'The rollback regression missed the removed confirmation check.'
              exit 1
            fi
            grep -q 'version 2 activated while the rollback node was down; want 1 (#174)' "$RUNNER_TEMP/result.log"
            grep -q 'this binary is too old for the cluster' "$ROLLING_OUT/seed-175/old-binary-refused.log"
          else
            go test "${flags[@]}" -count=1 -timeout 8m -v ./cmd/chaos -run "$test" 2>&1 | tee "$RUNNER_TEMP/result.log"
          fi
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: rolling-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/rolling
            ${{ runner.temp }}/result.log
            ${{ runner.temp }}/formatting.patch
            ${{ runner.temp }}/old.json
            ${{ runner.temp }}/new.json
            ${{ runner.temp }}/old-version.go
            ${{ runner.temp }}/new-version.go
            ${{ runner.temp }}/old-peer.go
            ${{ runner.temp }}/new-peer.go
          retention-days: 30
