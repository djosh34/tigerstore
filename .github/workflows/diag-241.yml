name: diag 241 netem heal
on:
  push:
    branches: [diag/241-heartbeat-after-corrupt]
permissions:
  contents: read
jobs:
  reproduction:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Verify the existing peer write deadline
        run: go test ./internal/peer -run '^TestStalledPeerIsDropped$' -count=1 -timeout=45s -v
      - name: Compile only the targeted environment tests
        run: go test -c -tags chaosenv -o "$RUNNER_TEMP/diag241.test" ./chaos/env
      - name: Reproduce retained impairments in an isolated namespace, 20 repetitions
        run: |
          set -o pipefail
          sudo -n unshare --net bash -c 'ip link set lo up; exec "$1" -test.run "^TestDiag241NetemHeal" -test.count=20 -test.timeout=60s -test.v' -- "$RUNNER_TEMP/diag241.test" 2>&1 | tee "$RUNNER_TEMP/diag241.log"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: diag241-netem
          path: ${{ runner.temp }}/diag241.log
