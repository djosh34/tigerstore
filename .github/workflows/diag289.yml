name: diag289 witness timeout
on:
  push:
    branches: [diag/289-witness-timeout]
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        witness: [pr282, main]
        race: [plain, race]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Select witness
        if: matrix.witness == 'main'
        run: git show fa55dee2:check/witness_revisions.go > check/witness_revisions.go
      - name: Replay exact saved history and reduced case
        shell: bash
        env:
          DIAG289: '1'
          RACE: ${{ matrix.race }}
        run: |
          mkdir -p evidence
          flags=()
          if [ "$RACE" = race ]; then flags=(-race); fi
          set +e
          go test "${flags[@]}" -v -count=1 -timeout=4m ./check -run '^TestDiag289History$' -cpuprofile="$PWD/evidence/cpu.pprof" -memprofile="$PWD/evidence/mem.pprof" 2>&1 | tee evidence/history.log
          history_status=${PIPESTATUS[0]}
          go test "${flags[@]}" -v -count=1 -timeout=30s ./check -run '^TestDiag289Reduced284$' 2>&1 | tee evidence/reduced.log
          reduced_status=${PIPESTATUS[0]}
          go tool pprof -top -nodecount=50 check.test evidence/cpu.pprof > evidence/cpu-top.txt
          go tool pprof -top -cum -nodecount=50 check.test evidence/cpu.pprof > evidence/cpu-cum.txt
          go tool pprof -top -alloc_space -nodecount=40 check.test evidence/mem.pprof > evidence/alloc-top.txt
          cat evidence/cpu-top.txt evidence/cpu-cum.txt
          echo "history_status=$history_status reduced_status=$reduced_status" | tee evidence/status.txt
          if [ "$history_status" != 0 ] || [ "$reduced_status" != 0 ]; then exit 1; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: diag289-${{ matrix.witness }}-${{ matrix.race }}
          path: evidence/
          retention-days: 30
