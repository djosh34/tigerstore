name: Diagnosis 303 pause check
on:
  workflow_dispatch:
    inputs:
      replay:
        type: choice
        options: [pause, kubernetes]
        default: pause
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PRODUCT_SHA: 3e026b7dd0eaa929e5ff9cb98f1d4d81824ba6ae
      GOFLAGS: -p=2
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        if: inputs.replay == 'kubernetes'
        with:
          go-version-file: go.mod
      - name: Replay blocked writer or Kubernetes traffic
        env:
          REPLAY: ${{ inputs.replay }}
        run: |
          mkdir -p results/diag-303
          if [[ $REPLAY == pause ]]; then
            set -o pipefail
            python3 scripts/jepsen/diag-303-pause.py 2>&1 | tee results/diag-303/replay.log
          else
            bash scripts/jepsen/robustness.sh tigerstore kubernetes
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-303-${{ inputs.replay }}
          path: results
          retention-days: 30
