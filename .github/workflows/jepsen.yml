name: Jepsen and upstream robustness
on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [all, jepsen, robustness, tools]
        default: all
      workloads:
        description: Jepsen workload array as JSON
        default: '["append","lock-etcd-set","set","register","watch","wr"]'
      nemeses:
        description: Jepsen nemesis array as JSON
        default: '["kill","pause","partition","lazyfs"]'
      stores:
        description: Products as JSON
        default: '["tigerstore"]'
      product_sha:
        description: Product commit to test, blank uses the workflow commit
        default: ''
permissions:
  contents: read
  actions: read
env:
  PRODUCT_SHA: ${{ inputs.product_sha || github.sha }}
jobs:
  diag299-extra:
    if: inputs.suite == 'tools'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the second failure and pinned client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results/diag299-extra .jepsen
          gh run download 39344287487 -R djosh34/tigerstore -n jepsen-tigerstore-watch-lazyfs -D results/diag299-extra/original
          git clone https://github.com/jepsen-io/etcd.git .jepsen/etcd
          git -C .jepsen/etcd checkout b47cc401f27bfb7c28afd9ac088b5f0dca4501b8
          cp scripts/jepsen/diag299_extra_test.clj .jepsen/etcd/test/jepsen/etcd/
          git show 8c720710:scripts/jepsen/patch-db.py > .jepsen/baseline-patch.py
          python3 .jepsen/baseline-patch.py .jepsen/etcd
          docker pull ghcr.io/nurturenature/jepsen-docker/jepsen-control@sha256:b0d8e672156022baa30818bd38bf84ab8e10f5045c62d5fe81e7b4a7205c9145
      - name: Red, ca4f1bcc mapping only
        id: red
        continue-on-error: true
        run: |
          set -o pipefail
          docker run --rm --entrypoint /bin/bash -v "$PWD:/diag" -w /diag/.jepsen/etcd -e LEIN_ROOT=true -e DIAG299_HISTORY=/diag/results/diag299-extra/original/store/current/history.edn ghcr.io/nurturenature/jepsen-docker/jepsen-control@sha256:b0d8e672156022baa30818bd38bf84ab8e10f5045c62d5fe81e7b4a7205c9145 -lc 'lein test jepsen.etcd.diag299-extra-test' 2>&1 | tee results/diag299-extra/red.txt
      - name: Green, recognize channel closed too
        run: |
          set -o pipefail
          git -C .jepsen/etcd reset --hard b47cc401f27bfb7c28afd9ac088b5f0dca4501b8
          python3 scripts/jepsen/patch-db.py .jepsen/etcd
          docker run --rm --entrypoint /bin/bash -v "$PWD:/diag" -w /diag/.jepsen/etcd -e LEIN_ROOT=true -e DIAG299_HISTORY=/diag/results/diag299-extra/original/store/current/history.edn ghcr.io/nurturenature/jepsen-docker/jepsen-control@sha256:b0d8e672156022baa30818bd38bf84ab8e10f5045c62d5fe81e7b4a7205c9145 -lc 'lein test jepsen.etcd.diag299-extra-test' 2>&1 | tee results/diag299-extra/green.txt
          test '${{ steps.red.outcome }}' = failure
      - name: Retain the EOF location and later archived bytes
        if: always()
        run: |
          mkdir -p results/diag299-extra/n1
          tar -xjf results/diag299-extra/original/store/current/n1/data.tar.bz2 -C results/diag299-extra/n1
          wal=results/diag299-extra/n1/opt/etcd/n1.etcd/wal/0000000000000001.wal
          { stat -c '%n %s bytes' "$wal"; od -An -tc -j 99726 -N 4 "$wal"; } | tee results/diag299-extra/archived-value.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag299-extra-replay
          path: results/diag299-extra
          retention-days: 30
  tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check runner scripts and summary regressions
        shell: bash
        run: |
          bash -n scripts/jepsen/run.sh scripts/jepsen/robustness.sh
          # run.sh refuses every nemesis but the four of #148 before it starts anything.
          for nemesis in all clock kill,all; do
            rc=0; bash scripts/jepsen/run.sh tigerstore append "$nemesis" || rc=$?
            [[ $rc == 2 ]] || { echo "nemesis $nemesis: exit $rc, want 2"; exit 1; }
          done
          pip install edn_format==0.7.5
          python3 -m unittest discover -s scripts/jepsen -p 'test_*.py'
  jepsen:
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'jepsen'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        workload: ${{ fromJSON(inputs.workloads || '["append","lock-etcd-set","set","register","watch","wr"]') }}
        nemesis: ${{ fromJSON(inputs.nemeses || '["kill","pause","partition","lazyfs"]') }}
        store: ${{ fromJSON(inputs.stores || '["tigerstore"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        if: matrix.store == 'tigerstore'
        with:
          go-version-file: go.mod
      - name: Run upstream Jepsen on three nodes
        shell: bash
        run: bash scripts/jepsen/run.sh '${{ matrix.store }}' '${{ matrix.workload }}' '${{ matrix.nemesis }}' 90 50
      - if: failure()
        run: |
          echo "replay: bash scripts/jepsen/run.sh '${{ matrix.store }}' '${{ matrix.workload }}' '${{ matrix.nemesis }}' 90 50"
      - name: Require a definite verdict and observed faults
        if: always()
        shell: bash
        run: |
          pip install edn_format==0.7.5
          mkdir -p results/jepsen
          python3 -m unittest discover -s scripts/jepsen -p 'test_*.py'
          python3 scripts/jepsen/summarize.py results/jepsen | tee results/jepsen/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jepsen-${{ matrix.store }}-${{ matrix.workload }}-${{ matrix.nemesis }}
          path: results/jepsen
          retention-days: 30
  robustness:
    if: github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'robustness'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        traffic: [etcd-put-delete-lease, etcd-put, etcd-delete, kubernetes, kubernetes-create-delete]
        store: ${{ fromJSON(inputs.stores || '["tigerstore"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run upstream traffic and black-box KV checker on three nodes
        shell: bash
        env:
          GOFLAGS: -p=2
          GOMEMLIMIT: 2GiB
        run: bash scripts/jepsen/robustness.sh '${{ matrix.store }}' '${{ matrix.traffic }}'
      - if: failure()
        run: |
          echo "replay: bash scripts/jepsen/robustness.sh '${{ matrix.store }}' '${{ matrix.traffic }}'"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robustness-${{ matrix.store }}-${{ matrix.traffic }}
          path: results/robustness
          retention-days: 30
