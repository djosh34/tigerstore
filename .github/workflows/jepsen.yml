name: Jepsen and upstream robustness
on:
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [all, jepsen, robustness]
        default: all
      product_sha:
        description: Main commit to test, blank uses the pinned prework baseline
        default: '40e7c0a009a08d6ba80f369dd2e66c9735512dbb'
permissions:
  contents: read
env:
  PRODUCT_SHA: ${{ inputs.product_sha || '40e7c0a009a08d6ba80f369dd2e66c9735512dbb' }}
jobs:
  jepsen:
    if: inputs.suite != 'robustness'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        store: [etcd, tigerstore]
        workload: [append, lock-set, lock-etcd-set, set, register, watch, wr]
        nemesis: [kill, pause, partition, lazyfs]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        if: matrix.store == 'tigerstore'
        with:
          go-version-file: go.mod
      - name: Run upstream Jepsen on three nodes
        shell: bash
        run: bash scripts/jepsen/run.sh '${{ matrix.store }}' '${{ matrix.workload }}' '${{ matrix.nemesis }}' 90 50
      - name: Require a definite verdict and observed faults
        if: always()
        shell: bash
        run: |
          pip install edn_format==0.7.5
          python3 scripts/jepsen/summarize.py results/jepsen > results/jepsen/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jepsen-${{ matrix.store }}-${{ matrix.workload }}-${{ matrix.nemesis }}
          path: results/jepsen
          retention-days: 30
  robustness:
    if: inputs.suite != 'jepsen'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        store: [etcd, tigerstore]
        traffic: [etcd-put-delete-lease, etcd-put, etcd-delete, kubernetes, kubernetes-create-delete]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Run upstream traffic and black-box KV checker on three nodes
        shell: bash
        env:
          GOFLAGS: -p=2
          GOMEMLIMIT: 2GiB
        run: bash scripts/jepsen/robustness.sh '${{ matrix.store }}' '${{ matrix.traffic }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: robustness-${{ matrix.store }}-${{ matrix.traffic }}
          path: results/robustness
          retention-days: 30
