name: Jepsen external store experiment
on:
  push:
    branches: [exp/jepsen]
    paths: ['experiments/jepsen/run.sh', 'experiments/jepsen/patch-db.py', '.github/workflows/jepsen-experiment.yml']
permissions:
  contents: read
jobs:
  jepsen:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        store: [tigerstore]
        workload: [register]
        nemesis: [none, partition, kill, pause]
        include:
          - store: tigerstore
            workload: register
            nemesis: clock
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        if: matrix.store == 'tigerstore'
        with:
          go-version: '1.27.2'
      - name: Run upstream Jepsen
        shell: bash
        run: bash experiments/jepsen/run.sh '${{ matrix.store }}' '${{ matrix.workload }}' '${{ matrix.nemesis }}' 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jepsen-${{ matrix.store }}-${{ matrix.workload }}-${{ matrix.nemesis }}-${{ github.run_attempt }}
          path: experiments/jepsen/results
          retention-days: 14
