# Runs chosen k8s.io/apiserver storage tests many times against tigerstore
# and stock etcd v3.7.2 in the same job, alternating, both as 3-node TLS
# clusters from apiservertest/factory, to tell a slow runner from a slow
# store. Started by hand, or by a push to probe/apiserver-compare with the
# defaults.
name: apiserver-compare

on:
  push:
    branches: [probe/apiserver-compare]
  workflow_dispatch:
    inputs:
      version:
        description: k8s.io/apiserver version
        default: v0.37.0
      run:
        description: go test -run pattern
        default: ^TestCompact$
      rounds:
        description: rounds; each runs the tests once per store
        default: "20"

jobs:
  compare:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install etcd v3.7.2
        run: |
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" https://github.com/etcd-io/etcd/releases/download/v3.7.2/etcd-v3.7.2-linux-arm64.tar.gz
          echo "5e3ff99d428fabfcefdc95348f6560d1efe835f7b2d1ab3334fe0831076966b7  $RUNNER_TEMP/etcd.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
      - name: Compare
        env:
          VERSION: ${{ inputs.version || 'v0.37.0' }}
          RUN: ${{ inputs.run || '^TestCompact$' }}
          ROUNDS: ${{ inputs.rounds || '20' }}
        run: |
          export WORK="$RUNNER_TEMP/work"
          # Builds everything and checks that the tests compile.
          apiservertest/run.sh "$VERSION" -run '^$'
          for i in $(seq "$ROUNDS"); do
            for store in tigerstore etcd; do
              etcd=
              if [ "$store" = etcd ]; then etcd="$RUNNER_TEMP/etcd-v3.7.2-linux-arm64/etcd"; fi
              ETCD=$etcd apiservertest/run.sh "$VERSION" -v -run "$RUN" >"$RUNNER_TEMP/$store-$i.log" 2>&1 || true
              echo "$store round $i: $(grep -c -- '^--- PASS' "$RUNNER_TEMP/$store-$i.log") passed, $(grep -c -- '^--- FAIL' "$RUNNER_TEMP/$store-$i.log") failed"
              # A round that ran no test at all, such as one whose servers
              # did not start, must not vanish from the totals.
              if ! grep -q -- '^--- \(PASS\|FAIL\)' "$RUNNER_TEMP/$store-$i.log"; then echo "$store round $i ran no test" >>"$RUNNER_TEMP/empty.txt"; fi
            done
          done | tee "$RUNNER_TEMP/rounds.txt"
          {
            echo "## $VERSION, -run $RUN, $ROUNDS rounds"
            for store in tigerstore etcd; do
              echo "- $store: $(cat "$RUNNER_TEMP"/$store-*.log | grep -c -- '^--- PASS') passed, $(cat "$RUNNER_TEMP"/$store-*.log | grep -c -- '^--- FAIL') failed"
            done
            if [ -s "$RUNNER_TEMP/empty.txt" ]; then echo "- rounds that ran no test:"; sed 's/^/  - /' "$RUNNER_TEMP/empty.txt"; fi
          } >>"$GITHUB_STEP_SUMMARY"
          mkdir -p logs && cp "$RUNNER_TEMP"/*.log "$RUNNER_TEMP/rounds.txt" logs/
          if [ -s "$RUNNER_TEMP/empty.txt" ]; then cat "$RUNNER_TEMP/empty.txt"; exit 1; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: apiserver-compare
          path: logs
