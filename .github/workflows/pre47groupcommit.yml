name: pre47 group commit experiment
on:
  push:
    branches: [exp/pre-47-groupcommit]
    paths:
      - 'internal/**'
      - 'cmd/**'
      - 'experiments/**'
      - '.github/workflows/pre47groupcommit.yml'
permissions:
  contents: read
jobs:
  paired:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        clients: [16, 64, 256]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.2'
      - name: Baseline, prototype and etcd back to back
        env:
          CLIENTS: ${{ matrix.clients }}
        run: timeout --kill-after=5s 820s bash experiments/pre47groupcommit/run.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pre47-groupcommit-${{ matrix.clients }}
          path: evidence/pre47groupcommit
          retention-days: 14
