name: diag-298
on:
  push:
    branches: [diag/298-loadgen-put-ops]
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install etcd v3.7.2
        run: |
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" https://github.com/etcd-io/etcd/releases/download/v3.7.2/etcd-v3.7.2-linux-arm64.tar.gz
          echo "5e3ff99d428fabfcefdc95348f6560d1efe835f7b2d1ab3334fe0831076966b7  $RUNNER_TEMP/etcd.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
          echo "LOADGEN_ETCD=$RUNNER_TEMP/etcd-v3.7.2-linux-arm64/etcd" >> "$GITHUB_ENV"
      - name: Controlled warmup completions after the window
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=3 -v -timeout=1m -run '^TestDiag298WarmupSpansWindow$' ./cmd/loadgen 2>&1 | tee "$RUNNER_TEMP/diag-298-controlled.log"
      - name: Original named test and window checks
        if: always()
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 -v -timeout=3m -run '^TestEtcdWorkloads$|^TestCheckWindow$' ./cmd/loadgen 2>&1 | tee "$RUNNER_TEMP/diag-298-natural.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: diag-298
          path: ${{ runner.temp }}/diag-298-*.log
          retention-days: 30
