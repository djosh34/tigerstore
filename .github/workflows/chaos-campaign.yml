name: chaos-campaign
on:
  workflow_dispatch:
    inputs:
      seeds:
        description: Seeds spread over three shards
        default: "1483001 1483002 1483003 1483004 1483005 1483006"
      race:
        description: Build the runner and servers with the race detector
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  seeds:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
        mode: [lazyfs, plain]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    env:
      GORACE: halt_on_error=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install FUSE and LazyFS build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake g++ libfuse3-dev fuse3
      - name: Build and check the runner
        env:
          RACE: ${{ inputs.race }}
        run: |
          echo "LAZYFS=$(scripts/lazyfs.sh "$RUNNER_TEMP/lazyfs")" >> "$GITHUB_ENV"
          flags=()
          if [ "$RACE" = true ]; then flags=(-race); fi
          go vet ./cmd/chaos
          go test "${flags[@]}" -short ./cmd/chaos
          go build "${flags[@]}" -o "$RUNNER_TEMP/tigerstore" ./cmd/tigerstore
          go build "${flags[@]}" -o "$RUNNER_TEMP/chaos" ./cmd/chaos
      - name: Membership and overlapping faults
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          SHARD: ${{ matrix.shard }}
          SEEDS: ${{ inputs.seeds }}
        run: |
          set -uo pipefail
          lazy=()
          if [ "$MODE" = lazyfs ]; then lazy=(-lazyfs "$LAZYFS"); fi
          status=0
          i=0
          for seed in $SEEDS; do
            if [ $((i % 3)) -eq "$SHARD" ]; then
              echo "seed $seed, $MODE, branch exp/148-chaos-3"
              "$RUNNER_TEMP/chaos" -tigerstore "$RUNNER_TEMP/tigerstore" -seed "$seed" -out "$RUNNER_TEMP/chaos-out" -env "${lazy[@]}" -rate 4 -faults crash-partition-gray,rolling-loss-compact,replace-leader-learner || status=1
            fi
            i=$((i + 1))
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: round3-${{ matrix.mode }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/chaos-out
            !${{ runner.temp }}/chaos-out/**/disks
          retention-days: 30
