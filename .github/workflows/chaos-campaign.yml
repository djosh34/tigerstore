name: diag-295
on:
  workflow_dispatch:
    inputs:
      experiment:
        default: seed
        type: choice
        options: [seed, header]
permissions:
  contents: read
jobs:
  replay:
    if: inputs.experiment == 'seed'
    strategy:
      fail-fast: false
      matrix:
        revision: [e3243229e2b701883e2c43cf9b4ae77e2c09a9ef, 76dca7545fd21613ce320cacb6168829a770699a]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Select the product revision
        env:
          REVISION: ${{ matrix.revision }}
        run: |
          git show "$REVISION:internal/wal/wal.go" > internal/wal/wal.go
          git show "$REVISION:internal/node/node.go" > internal/node/node.go
          echo "Product $REVISION; diagnostics $GITHUB_SHA"
      - name: Install FUSE and build
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake g++ libfuse3-dev fuse3
          echo "LAZYFS=$(scripts/lazyfs.sh "$RUNNER_TEMP/lazyfs")" >> "$GITHUB_ENV"
          go build -o "$RUNNER_TEMP/tigerstore" ./cmd/tigerstore
          go build -o "$RUNNER_TEMP/chaos" ./cmd/chaos
      - name: Replay seed 20233900302 once
        run: |
          "$RUNNER_TEMP/chaos" -tigerstore "$RUNNER_TEMP/tigerstore" -seed 20233900302 -out "$RUNNER_TEMP/diag295" -env -lazyfs "$LAZYFS"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diag295-${{ matrix.revision }}
          path: |
            ${{ runner.temp }}/diag295
            !${{ runner.temp }}/diag295/**/disks
          retention-days: 30
  header:
    if: inputs.experiment == 'header'
    strategy:
      fail-fast: false
      matrix:
        variant: [main, pr294, header-fix]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Select the experiment
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          if [ "$VARIANT" = pr294 ]; then
            git show 76dca7545fd21613ce320cacb6168829a770699a:internal/wal/wal.go > internal/wal/wal.go
          fi
          if [ "$VARIANT" = header-fix ]; then
            python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/wal/wal.go')
          s = p.read_text()
          old = 'func (w *WAL) Flush() error {\n\tif len(w.buf) == 0 {'
          new = 'func (w *WAL) Flush() error {\n\tif len(w.buf) == 0 || w.size == 0 && len(w.buf) == headerSize {'
          assert old in s
          p.write_text(s.replace(old, new))
          PY
          fi
      - name: Install FUSE and build LazyFS
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q cmake g++ libfuse3-dev fuse3
          echo "CHAOS_LAZYFS=$(scripts/lazyfs.sh "$RUNNER_TEMP/lazyfs")" >> "$GITHUB_ENV"
      - name: Tear a write after an unsynced header-only flush
        run: go test -tags chaosenv -count=1 -v ./chaos/env -run '^TestDiag295HeaderOnlyFlush$' -timeout 90s
