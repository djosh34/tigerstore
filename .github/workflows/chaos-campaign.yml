name: chaos-campaign

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: Network/time seeds, spread across four shards
        default: "1482001 1482002 1482003 1482004 1482005 1482006 1482007 1482008"
      faults:
        description: Faults in each seeded schedule
        default: "leader-incoming,follower-island,leader-flap,peer-slow-leader,netem-election"

permissions:
  contents: read

jobs:
  network-time:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        race: [false, true]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build and vet
        env:
          RACE: ${{ matrix.race }}
        run: |
          flags=()
          if [ "$RACE" = true ]; then flags=(-race); fi
          go vet ./cmd/chaos
          go build "${flags[@]}" -o "$RUNNER_TEMP/tigerstore" ./cmd/tigerstore
          go build "${flags[@]}" -o "$RUNNER_TEMP/chaos" ./cmd/chaos
      - name: Run network/time schedules
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SEEDS: ${{ inputs.seeds }}
          FAULTS: ${{ inputs.faults }}
          GORACE: halt_on_error=1
        run: |
          set -uo pipefail
          status=0
          i=0
          for seed in $SEEDS; do
            if [ $((i % 4)) -eq "$SHARD" ]; then
              "$RUNNER_TEMP/chaos" -tigerstore "$RUNNER_TEMP/tigerstore" -seed "$seed" \
                -out "$RUNNER_TEMP/chaos-out" -env -faults "$FAULTS" || status=1
            fi
            i=$((i + 1))
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: network-time-${{ matrix.shard }}-race-${{ matrix.race }}
          path: |
            ${{ runner.temp }}/chaos-out
            !${{ runner.temp }}/chaos-out/**/disks
          retention-days: 30

  tally:
    needs: network-time
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v7
        with:
          pattern: network-time-*
          path: ${{ runner.temp }}/faults
      - run: go run ./cmd/chaos -tally "$RUNNER_TEMP/faults"
