name: chaos-campaign

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: Space-separated seeds for the storage schedules
        default: "148101 148102"
      pressure_keys:
        description: Number of 96 KiB cold keys, 2048 gives 192 MiB
        default: "0"
      memory:
        description: Per-node memory limit in bytes, 134217728 gives 128 MiB
        default: "0"
      scenarios:
        description: JSON array of storage schedules
        default: '["rotation-power","checkpoint-power","clean-power","install-power","recovery-power","checkpoint-full-cycle","checkpoint-fsync-eio","checkpoint-stall-cycle"]'

permissions:
  contents: read

jobs:
  storage:
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.scenarios) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install LazyFS tools
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake g++ libfuse3-dev fuse3
      - name: Build and check experiment
        run: |
          go vet ./cmd/chaos
          go test -short ./cmd/chaos ./chaos/env
          python3 scripts/storage-overlay.py "$RUNNER_TEMP/storage-overlay"
          go build -overlay "$RUNNER_TEMP/storage-overlay/overlay.json" -o "$RUNNER_TEMP/tigerstore" ./cmd/tigerstore
          go build -o "$RUNNER_TEMP/chaos" ./cmd/chaos
          echo "LAZYFS=$(scripts/lazyfs.sh "$RUNNER_TEMP/lazyfs")" >> "$GITHUB_ENV"
      - name: Run storage schedules with every checker
        env:
          SCENARIO: ${{ matrix.scenario }}
          SEEDS: ${{ inputs.seeds }}
          PRESSURE_KEYS: ${{ inputs.pressure_keys }}
          MEMORY: ${{ inputs.memory }}
        run: |
          set -uo pipefail
          lazy=()
          if [[ "$SCENARIO" == *power ]]; then lazy=(-lazyfs "$LAZYFS"); fi
          status=0
          for seed in $SEEDS; do
            "$RUNNER_TEMP/chaos" -tigerstore "$RUNNER_TEMP/tigerstore" -seed "$seed" \
              -out "$RUNNER_TEMP/chaos-out" -env "${lazy[@]}" -faults "$SCENARIO" \
              -value-size 16384 -compact-every 2s -rate 10 -checker-timeout 3m \
              -pressure-keys "$PRESSURE_KEYS" -memory "$MEMORY" || status=1
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: storage-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/chaos-out
            !${{ runner.temp }}/chaos-out/**/disks
            ${{ runner.temp }}/storage-overlay
          retention-days: 30
