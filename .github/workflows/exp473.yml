# Research #473, exp branch only: long seeds with CPU profiles in windows
# of 30 virtual minutes and counters of what grows with a run's age. A
# push that changes exp473-run.json runs the seeds it lists.
name: exp473
run-name: exp473 ${{ github.event.head_commit.message }}

on:
  push:
    branches: [exp/473-slowdown]
    paths: [exp473-run.json]

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      seeds: ${{ steps.p.outputs.seeds }}
      minutes: ${{ steps.p.outputs.minutes }}
      crash: ${{ steps.p.outputs.crash }}
      env: ${{ steps.p.outputs.env }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        run: |
          echo "seeds=$(jq -c .seeds exp473-run.json)" >>"$GITHUB_OUTPUT"
          echo "minutes=$(jq -r '.minutes // ""' exp473-run.json)" >>"$GITHUB_OUTPUT"
          echo "crash=$(jq -r '.crash // ""' exp473-run.json)" >>"$GITHUB_OUTPUT"
          echo "env=$(jq -r '.env // ""' exp473-run.json)" >>"$GITHUB_OUTPUT"
  seed:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(needs.plan.outputs.seeds) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/sim.sh ./internal/sim '^$'
      - run: nproc; free -m
      - name: Seed
        env:
          SEED: ${{ matrix.seed }}
          EXP441_MINUTES: ${{ needs.plan.outputs.minutes }}
          EXP441_CRASH: ${{ needs.plan.outputs.crash }}
          OUT: ${{ runner.temp }}/exp441
        run: |
          for kv in ${{ needs.plan.outputs.env }}; do export "$kv"; done
          if [[ "$SEED" != *" "* ]]; then
            exec scripts/exp441.sh
          fi
          # Several seeds at once on this runner.
          mkdir -p "$OUT"
          for s in $SEED; do
            OUT=$OUT/$s SEED=$s NOPKILL=1 NOCHECK=1 scripts/exp441.sh >"$OUT/$s.txt" 2>&1 &
          done
          ( peak=0; while sleep 5; do m=$(free -m | awk '/Mem:/ {print $3}'); [ "$m" -gt "$peak" ] && peak=$m && echo "$peak" >"$OUT/peak-used-mib"; done ) &
          wait $(jobs -p | head -n -1)
          echo "peak used memory of the runner: $(cat "$OUT/peak-used-mib") MiB"
          for s in $SEED; do echo "== $s"; head -1 "$OUT/$s.txt"; grep -E 'driver gosim|phase (run|own-checks|hashes|checkable|witness|checkers)' "$OUT/$s.txt"; mkdir -p "$OUT/par"; cp "$OUT/$s.txt" "$OUT/par/"; done
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: exp473-${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/exp441/seed.log
            ${{ runner.temp }}/exp441/cpu.*
            ${{ runner.temp }}/exp441/history.json.gz
            ${{ runner.temp }}/exp441/par
            ${{ runner.temp }}/exp441/*/cpu.*
          retention-days: 14
