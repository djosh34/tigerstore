name: ceiling-floor
on:
  workflow_dispatch:
  push:
    branches: [exp/484-ceiling-floor]
    paths: [.github/workflows/ceiling-floor.yml]
jobs:
  floor:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Match bench setup and record runner
        run: |
          sudo mount -o remount,barrier=1 /
          sudo modprobe sch_netem
          bench/netem.sh on 0
          mkdir -p results
          {
            git rev-parse HEAD
            lscpu
            free -b
            uname -a
            go version
            findmnt -T "$RUNNER_TEMP" -o TARGET,SOURCE,FSTYPE,OPTIONS
          } | tee results/runner.txt
      - name: Build
        run: |
          go build -o bin/loadgen ./cmd/loadgen
          go build -o bin/floor-server ./cmd/tigerstore
          scripts/dev-certs.sh certs
      - name: Check exact fixture sizes
        run: go test ./cmd/loadgen ./internal/floor ./internal/server -run '^TestFloor' -v | tee results/sizes.txt
      - name: One-core primitives (three repetitions)
        run: |
          set -o pipefail
          GOMAXPROCS=1 taskset -c 0 go test -p 1 ./internal/floor ./internal/core ./internal/wal ./internal/mvcc ./internal/server -run '^$' -bench '^BenchmarkFloor' -cpu 1 -benchtime=400ms -count=3 -benchmem | tee results/primitives.txt
      - name: Real TLS/HTTP2 front end, immediate null backend
        run: bench/ceiling-floor.sh
      - name: Summary
        if: always()
        run: |
          echo '## Runner ${{ matrix.runner }}' >> "$GITHUB_STEP_SUMMARY"
          cat results/summary.md results/sizes.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat results/primitives.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ceiling-floor-${{ matrix.runner }}
          path: results
          retention-days: 30
