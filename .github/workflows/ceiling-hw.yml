name: ceiling-hw
on:
  workflow_dispatch:
  push:
    branches: [exp/484-ceiling-hw]
jobs:
  hardware:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2, 3]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y fio sysbench iperf3 gcc
      - name: Build
        run: |
          mkdir -p bin results
          go build -o bin/diskbench ./cmd/diskbench
          go build -o bin/netraw ./bench/ceilinghw/net
          go test -c -o bin/primitives.test ./bench/ceilinghw
          gcc -O3 -pthread -o bin/raw bench/ceilinghw/c/raw.c
          scripts/dev-certs.sh certs
      - name: Match bench disk and qdisc
        run: |
          sudo mount -o remount,barrier=1 /
          test "$(findmnt -T "$RUNNER_TEMP" -n -o FSTYPE)" = ext4
          if findmnt -T "$RUNNER_TEMP" -n -o OPTIONS | grep -Eq 'nobarrier|barrier=0'; then exit 1; fi
          sudo modprobe sch_netem
      - name: Measure hardware
        run: bash bench/ceilinghw/run.sh results
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ceiling-hw-${{ matrix.runner }}
          path: results
          retention-days: 30
