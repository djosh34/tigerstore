name: wholebatch experiment
on:
  push:
    branches: [exp/pre-50-wholebatch]
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Candidate ref, empty uses workflow checkout
        type: string
        default: ''
      extra_baseline_ref:
        description: Optional best native frontend ref from issue 74
        type: string
        default: ''
      extra_baseline_frontend:
        description: Frontend selector for the optional baseline
        type: string
        default: native
permissions:
  contents: read
concurrency:
  group: wholebatch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  correctness:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Deadline gate
        id: deadline
        run: echo "open=$([[ $(date -u +%s) -lt $(date -ud 2026-10-13T22:00:00Z +%s) ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.deadline.outputs.open == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        if: steps.deadline.outputs.open == 'true'
        with:
          go-version-file: go.mod
      - name: Batch and real-node race tests
        if: steps.deadline.outputs.open == 'true'
        env:
          GOFLAGS: -p=2
          GOMEMLIMIT: 2GiB
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
        run: |
          set -euo pipefail
          test "$(date -u +%s)" -lt "$(date -ud 2026-10-13T22:00:00Z +%s)"
          if [[ -n ${CANDIDATE_REF:-} ]]; then git checkout --detach "$CANDIDATE_REF"; fi
          mkdir -p evidence/wholebatch-correctness
          git rev-parse HEAD > evidence/wholebatch-correctness/source.txt
          go test -race -count=1 -parallel 2 -timeout 5m ./internal/batchcmd ./internal/batchfront ./internal/core ./internal/node ./internal/lint 2>&1 | tee evidence/wholebatch-correctness/test.log
      - uses: actions/upload-artifact@v6
        if: always() && steps.deadline.outputs.open == 'true'
        with:
          name: wholebatch-correctness-${{ github.run_id }}
          path: evidence/wholebatch-correctness
          if-no-files-found: warn
  paired:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        clients: [16, 64, 256]
    steps:
      - name: Deadline gate
        id: deadline
        run: echo "open=$([[ $(date -u +%s) -lt $(date -ud 2026-10-13T22:00:00Z +%s) ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.deadline.outputs.open == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        if: steps.deadline.outputs.open == 'true'
        with:
          go-version-file: go.mod
      - name: Main, etcd and wholebatch back to back
        if: steps.deadline.outputs.open == 'true'
        env:
          CLIENTS: ${{ matrix.clients }}
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          EXTRA_BASELINE_REF: ${{ inputs.extra_baseline_ref || vars.WHOLEBATCH_EXTRA_BASELINE_REF }}
          EXTRA_BASELINE_FRONTEND: ${{ inputs.extra_baseline_frontend || vars.WHOLEBATCH_EXTRA_BASELINE_FRONTEND || 'native' }}
        run: timeout --kill-after=5s 780s bash experiments/wholebatch/run.sh
      - uses: actions/upload-artifact@v6
        if: always() && steps.deadline.outputs.open == 'true'
        with:
          name: wholebatch-c${{ matrix.clients }}-${{ github.run_id }}
          path: evidence/wholebatch/c${{ matrix.clients }}
          if-no-files-found: warn
      - name: Job summary
        if: always() && steps.deadline.outputs.open == 'true'
        run: |
          report=evidence/wholebatch/c${{ matrix.clients }}/summary.md
          if [[ -f $report ]]; then printf '%s\n' "$(<"$report")" >> "$GITHUB_STEP_SUMMARY"; fi
