name: ceiling-gap
on:
  workflow_dispatch:
  push:
    branches: [exp/484-ceiling-gap]
    paths: [.github/workflows/ceiling-gap.yml]
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        runner: [1, 2]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build original, instrumented and single-limit experiment
        run: |
          mkdir -p bin results
          go build -o bin/loadgen ./cmd/loadgen
          go build -o bin/gap ./cmd/tigerstore
          git worktree add --detach "$RUNNER_TEMP/pure" bd1ade319a4d0bfc92082a8bf8d335aa01199428
          (cd "$RUNNER_TEMP/pure" && go build -o "$GITHUB_WORKSPACE/bin/pure" ./cmd/tigerstore)
          python3 - <<'PY'
          from pathlib import Path
          p=Path('internal/core/node.go')
          s=p.read_text(); old='MaxInflightMsgs:           256,'
          assert s.count(old)==1
          p.write_text(s.replace(old,'MaxInflightMsgs:           1024,'))
          PY
          go build -o bin/wide ./cmd/tigerstore
          git restore internal/core/node.go
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" https://github.com/etcd-io/etcd/releases/download/v3.7.2/etcd-v3.7.2-linux-arm64.tar.gz
          echo "5e3ff99d428fabfcefdc95348f6560d1efe835f7b2d1ab3334fe0831076966b7  $RUNNER_TEMP/etcd.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/etcd-v3.7.2-linux-arm64/etcdctl" bin/
          scripts/dev-certs.sh certs
      - name: Prepare bench hardware
        run: |
          sudo mount -o remount,barrier=1 /
          sudo modprobe sch_netem
          sudo mount -o remount,size=8G /dev/shm
          test "$(findmnt -T "$RUNNER_TEMP" -n -o FSTYPE)" = ext4
          if findmnt -T "$RUNNER_TEMP" -n -o OPTIONS | grep -Eq 'nobarrier|barrier=0'; then exit 1; fi
          {
            git rev-parse HEAD
            lscpu
            free -b
            uname -a
            go version
            findmnt -T "$RUNNER_TEMP"
            lsblk
            sysctl net.ipv4.tcp_rmem net.ipv4.tcp_wmem net.core.rmem_max net.core.wmem_max
          } > results/runner.txt
      - name: Measure (three repetitions of each configuration)
        env:
          DATA: ${{ runner.temp }}/ceiling-gap
          OUT: results
        run: |
          export DISK=$(basename "$(findmnt -T "$RUNNER_TEMP" -n -o SOURCE)")
          bench/ceiling-gap.sh | tee results/measure.log
      - name: Symbolized profiles
        if: always()
        run: |
          find results -name '*.pprof' -type f | while read -r p; do
            case "$p" in
              */leader.pprof|*/follower.pprof)
                go tool pprof -raw "$p" > "$p.raw.txt" 2>/dev/null || true
                go tool pprof -top -nodecount=40 "$p" > "$p.top.txt" 2>/dev/null || true ;;
            esac
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ceiling-gap-${{ matrix.runner }}
          path: results
          retention-days: 30
