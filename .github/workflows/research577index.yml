name: research577index
on:
  workflow_dispatch:
jobs:
  primitives:
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./cmd/research577index
      - run: go build -o research577index ./cmd/research577index
      - name: Record runner
        run: |
          mkdir results
          { lscpu; free -b; uname -a; go version; git rev-parse HEAD; } > results/runner.txt
          cp cmd/research577index/README.md results/methodology.md
      - name: Measure pinned primitives
        run: taskset -c 0 ./research577index -duration 300ms -reps 3 > results/raw.jsonl
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: research577index-${{ matrix.repetition }}
          path: results/
