# Research for #499 (exp branch only): the witness from the revisions on
# busy no-fault histories of 320 s and 1,280 s, with main's checker and
# this branch's, three times each, as #485 measured.
name: exp499busy
on:
  push:
    branches: [exp/499-witness-busy]
permissions:
  contents: read
jobs:
  busy:
    strategy:
      fail-fast: false
      matrix:
        seconds: [320, 1280]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/sim.sh ./internal/sim '^$'
      - name: The seed
        env:
          SECONDS_: ${{ matrix.seconds }}
        run: |
          cd internal/sim
          GOSIMTOOL=$GITHUB_WORKSPACE/.gosim/bin/gosim SIM_OUT=$RUNNER_TEMP/out SIM_SEED=$SECONDS_ SIM_SEEDS=1 "$GITHUB_WORKSPACE/.gosim/bin/sim.test" -test.run '^TestExp499Busy$' -test.v -test.timeout 280m 2>&1 | grep -E 'busy|^--- |^(ok|PASS|FAIL)|saved in' | head
          ls -la $RUNNER_TEMP/out/*/
      - name: The witness, three times each
        run: |
          go build -o $RUNNER_TEMP/chk-new ./cmd/checkhistory
          git worktree add -q $RUNNER_TEMP/main origin/main
          go build -C $RUNNER_TEMP/main -o $RUNNER_TEMP/chk-old ./cmd/checkhistory
          h=$(ls $RUNNER_TEMP/out/*/history.json)
          for b in old new old new old new; do
            /usr/bin/time -f "$b %e s %M KB" $RUNNER_TEMP/chk-$b -checkers witness-revisions -timeout 200m "$h" | cut -c1-300 || true
          done
