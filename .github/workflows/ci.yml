# A pull request runs the fast set. The push to main and the nightly run
# also run every sim shard, race-sim and apiserver. The planted bugs run
# in planted.yml, and real-process chaos in chaos-env.yml. The
# simulator's tests run under gosim through scripts/sim.sh, except in
# race-sim. A failed job prints the command that runs each failure again
# (scripts/replay.sh for go test and scripts/sim.sh), and uploads its logs
# and evidence.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      fixed:
        description: Fixed seeds only, as while known-failures.txt lists any, to list a simulator change's failures again
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Diagnosis only (#684): the coverage job's gosim step, alone, verbose,
  # with room past its usual time and its logs always kept.
  gosim-time:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: The other simulator tests under gosim
        shell: bash
        env:
          SIM_OUT: ${{ runner.temp }}/sim-out
        run: |
          set -o pipefail
          status=0
          date -u
          time scripts/sim.sh ./internal/sim . -test.v -test.skip '^(TestSeeds|TestLinearizable|TestMembershipFaults)$' -test.timeout 55m 2>&1 | tee "$RUNNER_TEMP/sim-tests.log" || status=1
          date -u
          time scripts/sim.sh ./internal/node '^TestConcurrentCleanerSimulation$' -test.v -test.timeout 10m 2>&1 | tee "$RUNNER_TEMP/cleaner.log" || status=1
          date -u
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: gosim-time
          path: |
            ${{ runner.temp }}/sim-tests.log
            ${{ runner.temp }}/cleaner.log
          retention-days: 30
