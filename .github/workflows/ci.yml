# Branch-only checks for #183 and #218. Drop this prep-only commit.
name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l internal/sim/sim_test.go)"
      - run: go vet ./internal/sim
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --build-tags difftest,planted

  scenarios:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Repeat both scenarios and the coverage regression under race
        run: go test -race -count=5 -v -timeout 10m ./internal/sim -run 'Test(StalledLeaderIsReplaced|GrayLeaderIsReplaced|SeedCoverage)$'
      - name: Simulator suite under race
        run: go test -race -count=1 -timeout 20m ./internal/sim

  sim:
    strategy:
      fail-fast: false
      matrix:
        first: [1, 401, 1938892138, fresh]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Pick seeds
        env:
          FIRST: ${{ matrix.first }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$FIRST" = fresh ]; then
            FIRST=$((1000000 + (RUN_ID % 1000000000) * 2))
          fi
          echo "FIRST_SEED=$FIRST" >> "$GITHUB_ENV"
          echo "seeds $FIRST to $((FIRST + 399))"
      - name: Explore, run both deliberate scenarios, and check short histories
        run: go test -count=1 -v -timeout 14m ./internal/sim -run 'TestSeeds$|TestLinearizable$' -args -sim.seed="$FIRST_SEED" -sim.seeds=400 -sim.traces="$RUNNER_TEMP/a.txt" > "$RUNNER_TEMP/explore.log" 2>&1
      - name: Replay in a second process
        run: GOMAXPROCS=1 go test -count=1 -v -timeout 14m ./internal/sim -run 'TestSeeds$' -args -sim.seed="$FIRST_SEED" -sim.seeds=400 -sim.traces="$RUNNER_TEMP/b.txt" > "$RUNNER_TEMP/replay.log" 2>&1
      - name: Compare traces and require both scenarios in both processes
        run: |
          test "$(wc -l < "$RUNNER_TEMP/a.txt")" -eq 400
          diff "$RUNNER_TEMP/a.txt" "$RUNNER_TEMP/b.txt"
          for log in explore replay; do
            grep -F -- '--- PASS: TestSeeds/stalled-leader' "$RUNNER_TEMP/$log.log"
            grep -F -- '--- PASS: TestSeeds/gray-leader' "$RUNNER_TEMP/$log.log"
            grep '400 seeds:' "$RUNNER_TEMP/$log.log"
          done
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sim-${{ matrix.first }}
          path: |
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/*.txt
          retention-days: 30

  controls:
    strategy:
      fail-fast: false
      matrix:
        control: [gray-rule, stall-rule, gray-watchdog, stall-watchdog, old-shard]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Restore one old rule or disable one watchdog
        env:
          CONTROL: ${{ matrix.control }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          control = os.environ['CONTROL']
          if control == 'old-shard':
              raise SystemExit(0)
          if control.endswith('-rule'):
              path = Path('internal/sim/sim_test.go')
              old = 'func seedCoverage(ran int, total Stats) error {\n'
              if control == 'gray-rule':
                  rule = 'ran >= 2000 && total.GrayLeaderStops == 0'
              else:
                  rule = 'ran >= 64 && total.StallHandOffs == 0'
              new = old + '\tif ' + rule + ' {\n\t\treturn fmt.Errorf("old rare-event quota")\n\t}\n'
          else:
              path = Path('internal/core/node.go')
              if control == 'gray-watchdog':
                  old = 'if n.isLeader && n.commitStalled() && !alone {'
                  new = 'if n.isLeader && n.commitStalled() && !alone && false {'
              else:
                  old = '\t\tn.handOff()\n'
                  new = '\t\t// Control: do not transfer leadership.\n'
          text = path.read_text()
          if text.count(old) != 1:
              raise SystemExit('control target is not unique')
          path.write_text(text.replace(old, new))
          PY
          if [ "$CONTROL" = old-shard ]; then
            git show de4617eb:internal/sim/sim_test.go > internal/sim/sim_test.go
          fi
          git diff > "$RUNNER_TEMP/control.patch"
      - name: Require the intended regression failure
        env:
          CONTROL: ${{ matrix.control }}
        run: |
          case "$CONTROL" in
            *-rule) test=TestSeedCoverage; message='zero rare events must not fail exploration: old rare-event quota' ;;
            gray-watchdog) test=TestGrayLeaderIsReplaced; message='the gray leader never stopped' ;;
            stall-watchdog) test=TestStalledLeaderIsReplaced; message='the stalled leader never handed over' ;;
            old-shard) test=TestSeeds; message='0 stalled leaders that handed over' ;;
          esac
          if go test -count=1 -v -timeout 14m ./internal/sim -run "^$test$" -args -sim.seed=1938892138 -sim.seeds=400 > "$RUNNER_TEMP/control.log" 2>&1; then
            echo 'Control unexpectedly passed'
            exit 1
          fi
          grep -F "$message" "$RUNNER_TEMP/control.log"
          if grep -E '^panic:|^fatal error:|timed out|\[build failed\]' "$RUNNER_TEMP/control.log"; then
            exit 1
          fi
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: control-${{ matrix.control }}
          path: |
            ${{ runner.temp }}/control.log
            ${{ runner.temp }}/control.patch
          retention-days: 30
