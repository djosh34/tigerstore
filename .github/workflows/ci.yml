name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Regression tests under race
        run: go test -race -count=5 -v -run 'TestRangeReply' ./internal/core ./internal/server
      - name: Changed packages under race
        run: go test -race -short ./internal/mvcc ./internal/core ./internal/node ./internal/server ./internal/lint

  lint:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          gofmt -w $(git ls-files '*.go')
          git diff > formatting.patch
          git diff --exit-code
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: formatting
          path: formatting.patch
      - run: go vet ./internal/mvcc ./internal/core ./internal/node ./internal/server
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./internal/mvcc/... ./internal/core/... ./internal/node/... ./internal/server/...

  controls:
    strategy:
      matrix:
        control: [reservation, writer]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Each mutation must fail its regression
        env:
          CONTROL: ${{ matrix.control }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          if os.environ['CONTROL'] == 'reservation':
              p = Path('internal/core/replymemory.go')
              old, new = 'if n.cfg.MemoryBytes <= 0 {', 'if n.cfg.MemoryBytes >= 0 {'
          else:
              p = Path('internal/server/write.go')
              old, new = 'st.replyHold.Retain()', '// mutation: no socket ownership'
          text = p.read_text()
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          PY
          if [ "$CONTROL" = reservation ]; then
            package=core; pattern='^TestRangeReplyMemory$'; failure='range answers were not bounded'
          else
            package=server; pattern='^TestRangeReplyReservationLifetime$'; failure='reservation released while socket frames still reference the answer'
          fi
          set +e
          go test -count=1 -v -run "$pattern" "./internal/$package" > control.log 2>&1
          code=$?
          set -e
          cat control.log
          test "$code" -ne 0
          grep -q "$failure" control.log
