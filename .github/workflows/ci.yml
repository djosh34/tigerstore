name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./internal/node/...
  server:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./internal/server
  regression:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        run: test -z "$(gofmt -l internal/node)"
      - name: Regression with the fix
        run: go test -race -count=20 -run 'TestPersistReportsSyncDuringNextWrite$|TestSyncGroupsStopAt' ./internal/node
      - name: Node, core and WAL tests
        run: go test -race ./internal/node ./internal/core ./internal/wal
      - name: Regression without the fix must fail
        run: |
          git restore --source=b35d9f96 -- internal/node/node.go internal/node/pipeline_test.go
          set +e
          go test -count=1 -v -run '^TestPersistReportsSyncDuringNextWrite$' ./internal/node > before.log 2>&1
          result=$?
          set -e
          cat before.log
          test "$result" -eq 1
          grep -F 'durable entry 1 waited behind the next write' before.log
  stress:
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -count=20 -v -run 'TestLargeValuesAtRealTicks$' ./internal/server
        env:
          TIGERSTORE_STRESS: 10s
          GOMEMLIMIT: 8GiB
