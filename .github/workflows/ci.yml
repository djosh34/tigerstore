name: ci
on:
  workflow_dispatch:
jobs:
  compression:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format on Actions and retain the patch
        run: |
          gofmt -w internal/wal/compress.go internal/wal/compress_test.go internal/wal/wal.go internal/wal/pack.go internal/core/compression_test.go cmd/loadgen/corpus.go cmd/loadgen/corpus_test.go cmd/loadgen/main.go cmd/loadgen/walmetrics.go internal/node/clean_test.go internal/node/clean_sim_test.go internal/node/metadata_clean_test.go
          go mod tidy
          git diff > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@v6
        with:
          name: compression-format
          path: ${{ runner.temp }}/format.patch
      - name: Unit and driver tests under race
        run: |
          go test -short -race -count=1 -timeout=18m ./internal/wal ./internal/core ./internal/node ./cmd/loadgen
          go vet ./internal/wal ./internal/core ./internal/node ./cmd/loadgen
          CGO_ENABLED=0 go build ./cmd/tigerstore
      - name: Compression-disabled regression control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/wal/compress.go')
          s = p.read_text()
          old = 'func (w *WAL) CompressEntries(entries []*raftpb.Entry) ([]*raftpb.Entry, error) {'
          assert s.count(old) == 1
          p.write_text(s.replace(old, old + '\n if len(entries) >= 0 { return entries, nil }'))
          PY
          if go test ./internal/wal -run '^TestCompressionGateAndFallback/new$' -count=1 > control.log 2>&1; then
            cat control.log
            echo 'compression-disabled control was not caught'
            exit 1
          fi
          cat control.log
          grep -E 'stored [0-9]+ bytes of [0-9]+' control.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: compression-checks
          path: control.log
