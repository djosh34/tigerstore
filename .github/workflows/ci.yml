name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting and vet
        run: |
          mkdir evidence
          test -z "$(gofmt -l internal/node internal/server/stress_test.go)"
          go vet ./internal/node ./internal/server
      - name: Regression and race tests
        run: |
          go test -race -count=20 -run 'TestPersistReports|TestSyncGroupsStopAt' ./internal/node
          go test -race ./internal/node ./internal/core ./internal/wal ./internal/server
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./internal/node/... ./internal/server/...
      - name: Regression without the rotation fix must fail
        run: |
          git restore --source=0446443e -- internal/node/node.go internal/node/persist_timing.go
          set +e
          go test -count=1 -v -run '^TestPersistReportsBeforeRotation/header$' ./internal/node > evidence/control.log 2>&1
          result=$?
          set -e
          cat evidence/control.log
          test "$result" -eq 1
          grep -F 'durable entry waited for the next segment' evidence/control.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regression
          path: evidence/
  stress:
    strategy:
      fail-fast: false
      matrix:
        mode: [plain, traced]
        repetition: [1, 2, 3]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build test and install observers
        run: |
          go test -c -o /tmp/server.test ./internal/server
          sudo apt-get update -qq
          sudo apt-get install -y strace sysstat
      - name: Stress with the unchanged deadline
        env:
          TIGERSTORE_STRESS: 10s
          GOMEMLIMIT: 8GiB
          MODE: ${{ matrix.mode }}
        run: |
          mkdir evidence
          uname -a > evidence/host.txt
          lscpu >> evidence/host.txt
          findmnt -T /tmp >> evidence/host.txt
          lsblk >> evidence/host.txt
          iostat -x -t 1 > evidence/iostat.txt &
          io=$!
          vmstat -t 1 > evidence/vmstat.txt &
          vm=$!
          (
            while true; do
              date -u +%s.%N
              cat /proc/pressure/{cpu,io,memory}
              cat /sys/fs/cgroup/cpu.stat
              sleep 1
            done
          ) > evidence/pressure.txt &
          pressure=$!
          trap 'kill "$io" "$vm" "$pressure"; wait' EXIT
          result=0
          if [ "$MODE" = plain ]; then
            /tmp/server.test -test.v -test.count=20 -test.run '^TestLargeValuesAtRealTicks$' > evidence/test.log 2>&1 || result=$?
            cat evidence/test.log
          else
            for n in $(seq 1 20); do
              code=0
              strace -f -ttt -T -yy -e trace=fsync,fdatasync,pwrite64,ftruncate,renameat,renameat2 -o "evidence/syscalls-$n.txt" \
                /tmp/server.test -test.v -test.run '^TestLargeValuesAtRealTicks$' -test.trace="evidence/trace-$n.out" > "evidence/test-$n.log" 2>&1 || code=$?
              cat "evidence/test-$n.log"
              if [ "$code" -eq 0 ]; then
                rm "evidence/trace-$n.out"
              else
                result=$code
                go tool trace -pprof=syscall "evidence/trace-$n.out" > "evidence/syscall-$n.pprof"
                go tool pprof -top "evidence/syscall-$n.pprof" > "evidence/syscall-$n.txt"
                go tool trace -pprof=sched "evidence/trace-$n.out" > "evidence/sched-$n.pprof"
                go tool pprof -top "evidence/sched-$n.pprof" > "evidence/sched-$n.txt"
              fi
            done
          fi
          exit "$result"
      - name: Summarize wall times
        if: always()
        run: |
          python3 - <<'PY'
          import glob, json, re
          from pathlib import Path
          scale = {'ns': 1e-6, 'µs': 1e-3, 'ms': 1, 's': 1000}
          def millis(text):
              m = re.fullmatch(r'([0-9.]+)(ns|µs|ms|s)', text)
              return float(m[1]) * scale[m[2]]
          result = {'passed': 0, 'failed': 0, 'max_ms': {}, 'max_commit_ticks': 0}
          def maximum(key, value):
              result['max_ms'][key] = max(result['max_ms'].get(key, 0), value)
          for path in glob.glob('evidence/test*.log'):
              text = Path(path).read_text()
              result['passed'] += text.count('--- PASS: TestLargeValuesAtRealTicks')
              result['failed'] += text.count('--- FAIL: TestLargeValuesAtRealTicks')
              for put, ticks, write in re.findall(r'longest put (\S+), longest commit wait (\d+) ticks of \S+, longest log write (\S+)', text):
                  maximum('successful_put', millis(put))
                  maximum('log_write', millis(write))
                  result['max_commit_ticks'] = max(result['max_commit_ticks'], int(ticks))
              for stage, duration in re.findall(r'\b(total|queue|append|flush|sync_queue|sync|report)=([0-9.]+(?:ns|µs|ms|s))', text):
                  maximum(stage, millis(duration))
              for duration in re.findall(r'slow log rotation: (\S+)', text):
                  maximum('slow_rotation', millis(duration))
          output = json.dumps(result, indent=2)
          print(output)
          Path('evidence/summary.json').write_text(output + '\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stress-${{ matrix.mode }}-${{ matrix.repetition }}
          path: evidence/
          retention-days: 30
