name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format and vet
        run: |
          test -z "$(gofmt -l internal/core/removal_test.go internal/core/members.go internal/core/node.go)"
          go vet ./internal/core ./internal/sim
      - name: Removal and saved-disk regressions under race
        run: |
          go test -race -v -count=5 ./internal/core -run '^TestRemoved'
          go test -race -v -count=5 ./internal/sim -run '^TestMembershipRemovalColdFixture$|^TestMembershipColdRestart$'
      - name: Core and node suites
        run: go test -race -short -timeout=12m ./internal/core ./internal/node
  membership:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Membership seeds 1 through 256
        run: go test -v -count=1 -timeout=12m ./internal/sim -run '^TestMembershipFaults$' -args -sim.seed=1 -sim.seeds=256
      - name: Ordinary simulator regressions
        run: go test -count=1 -timeout=12m ./internal/sim -run '^TestSeeds$|^TestLinearizable$' -args -sim.seed=1 -sim.seeds=64
  control:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Remove only the self-removal fix
        run: git checkout d6ef01da -- internal/core/members.go
      - name: Direct regression must fail
        shell: bash
        run: |
          if go test -v -count=1 ./internal/core -run '^TestRemovedLeaderDrainsCommit$' > "$RUNNER_TEMP/core.log" 2>&1; then
            cat "$RUNNER_TEMP/core.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/core.log"
          grep 'node 1: core: apply entry .*the member has been permanently removed' "$RUNNER_TEMP/core.log"
      - name: Saved disks must fail without the fix
        shell: bash
        run: |
          if go test -v -count=1 ./internal/sim -run '^TestMembershipRemovalColdFixture$' > "$RUNNER_TEMP/fixture.log" 2>&1; then
            cat "$RUNNER_TEMP/fixture.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/fixture.log"
          test "$(grep -c -- '--- FAIL: TestMembershipRemovalColdFixture/' "$RUNNER_TEMP/fixture.log")" -eq 16
      - name: Late self-ack control must fail
        shell: bash
        run: |
          git checkout HEAD -- internal/core/members.go
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/core/node.go')
          s = p.read_text()
          old = 'if n.removeAt != 0 && m.GetType() == raftpb.MsgAppResp {'
          assert s.count(old) == 1
          p.write_text(s.replace(old, 'if false {'))
          PY
          if go test -v -count=1 ./internal/core -run '^TestRemovedLeaderDrainsCommit$' > "$RUNNER_TEMP/ack.log" 2>&1; then
            cat "$RUNNER_TEMP/ack.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/ack.log"
          grep 'core: step local MsgAppResp: raft: cannot step as peer not found' "$RUNNER_TEMP/ack.log"
  lint:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
