# Temporary investigation for #88. Drop this prep-only commit.
name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting and vet
        run: |
          test -z "$(gofmt -l internal/node/node.go internal/node/sync_queue_test.go)"
          go vet ./internal/node ./internal/core ./internal/wal ./internal/server
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./internal/node
      - name: Progress and error regressions
        run: go test -race -count=20 -v -run 'TestSyncGroups|TestPersistReports' ./internal/node
      - name: Race suites
        run: go test -race ./internal/node ./internal/core ./internal/wal ./internal/server
  old-code:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Require the regression to fail without the fix
        shell: bash
        run: |
          git show 215a7315:internal/node/node.go > internal/node/node.go
          set +e
          go test -race -count=1 -v -run '^TestSyncGroupsReportWrittenPrefix$' ./internal/node > control.log 2>&1
          status=$?
          set -e
          cat control.log
          test "$status" -eq 1
          grep -F 'written group 1 waited for a later sync' control.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: old-code-control
          path: control.log
  stress:
    strategy:
      fail-fast: false
      matrix:
        code: [before, after]
        shard: [1, 2, 3]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Restore baseline for the before runs
        if: matrix.code == 'before'
        run: git show 215a7315:internal/node/node.go > internal/node/node.go
      - name: Stress with unchanged deadlines
        run: go test -count=20 -v -run 'TestLargeValuesAtRealTicks$' ./internal/server | tee stress.log
        env:
          TIGERSTORE_STRESS: 10s
          GOMEMLIMIT: 8GiB
      - name: Summarize independent maxima
        if: always()
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path('stress.log').read_text()
          def ms(s):
              units = {'ns': 1e-6, 'µs': 1e-3, 'ms': 1, 's': 1000, 'm': 60000}
              return sum(float(n) * units[u] for n, u in re.findall(r'([0-9.]+)(ns|µs|ms|s|m)', s))
          lines = [f"passed={text.count('--- PASS: TestLargeValuesAtRealTicks')} failed={text.count('--- FAIL: TestLargeValuesAtRealTicks')}"]
          for label, pattern in {
              'put_ms': r'longest put (\S+),',
              'write_ms': r'longest log write (\S+)',
              'queue_ms': r' total=\S+ queue=(\S+)',
              'sync_queue_ms': r' sync_queue=(\S+)',
              'sync_ms': r' sync=(\S+)',
              'rotation_ms': r'slow log rotation: (\S+)',
          }.items():
              values = [ms(v) for v in re.findall(pattern, text)]
              lines.append(f'{label}={max(values, default=0):.6f}')
          ticks = [int(v) for v in re.findall(r'longest commit wait (\d+) ticks', text)]
          lines.append(f'commit_ticks={max(ticks, default=0)}')
          summary = '\n'.join(lines) + '\n'
          print(summary)
          Path('summary.txt').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('Independent maxima, not one request timeline.\n\n```\n' + summary + '```\n')
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: stress-${{ matrix.code }}-${{ matrix.shard }}
          path: |
            stress.log
            summary.txt
