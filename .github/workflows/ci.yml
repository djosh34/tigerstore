name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configmaps:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/kind
      - name: Create 50k ConfigMaps and delete their namespace
        run: timeout --kill-after=30s 30m python3 k8stest/configmaps.py
      - name: Collect logs
        if: always()
        run: bash k8stest/collect.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: configmaps-${{ github.sha }}
          path: ${{ runner.temp }}/k8stest/results
          if-no-files-found: error
          retention-days: 30
