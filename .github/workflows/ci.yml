# Branch-only checks for #223 and #224. Drop this commit before integration.
name: ci
on:
  workflow_dispatch:
    inputs:
      timing_only:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format and vet
        run: |
          gofmt -d cmd/chaos
          test -z "$(gofmt -l cmd/chaos)"
          go vet ./cmd/chaos ./chaos/...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./cmd/chaos/... ./chaos/...
      - name: Race regressions
        run: |
          go build -race -o "$RUNNER_TEMP/tigerstore" ./cmd/tigerstore
          CHAOS_TIGERSTORE="$RUNNER_TEMP/tigerstore" go test -race -v -count=3 ./cmd/chaos ./chaos/proxy
      - name: Check the regressions without each fix
        shell: bash
        run: |
          set -euo pipefail
          git show 8d44e969:cmd/chaos/envfaults.go > cmd/chaos/envfaults.go
          if CHAOS_TIGERSTORE="$RUNNER_TEMP/tigerstore" go test -race -v -run '^TestCrashInInstall$' ./cmd/chaos > "$RUNNER_TEMP/control-223.log" 2>&1; then
            cat "$RUNNER_TEMP/control-223.log"
            echo 'The old snapshot step escaped the regression'
            exit 1
          fi
          cat "$RUNNER_TEMP/control-223.log"
          grep -E 'snapshot crash missed the fetch|snapshot crash did not hold a reply before the kill' "$RUNNER_TEMP/control-223.log"
          git restore cmd/chaos/envfaults.go
          git show 8d44e969:cmd/chaos/schedule.go > cmd/chaos/schedule.go
          if go test -race -v -run '^TestNetworkWaitsForClient$' ./cmd/chaos > "$RUNNER_TEMP/control-224.log" 2>&1; then
            cat "$RUNNER_TEMP/control-224.log"
            echo 'The old client step escaped the regression'
            exit 1
          fi
          cat "$RUNNER_TEMP/control-224.log"
          grep 'fault ended before the client reconnected' "$RUNNER_TEMP/control-224.log"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: timing-controls
          path: ${{ runner.temp }}/control-*.log
          retention-days: 30

  chaos-env:
    if: ${{ !inputs.timing_only }}
    strategy:
      fail-fast: false
      matrix:
        mode: [lazyfs, plain]
        seed: [7856403745, 7866580249, 223224]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install FUSE and LazyFS's build tools
        run: sudo apt-get update -q && sudo apt-get install -y -q cmake g++ libfuse3-dev fuse3
      - name: Build LazyFS, tigerstore and chaos
        run: |
          echo "LAZYFS=$(scripts/lazyfs.sh "$RUNNER_TEMP/lazyfs")" >> "$GITHUB_ENV"
          go build -o "$RUNNER_TEMP/tigerstore" ./cmd/tigerstore
          go build -o "$RUNNER_TEMP/chaos" ./cmd/chaos
      - name: Test the environment
        if: matrix.seed == 223224 && matrix.mode == 'lazyfs'
        run: CHAOS_LAZYFS="$LAZYFS" go test -race -tags chaosenv ./chaos/env/
      - name: Run a seed
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          lazy=()
          if [ "$MODE" = lazyfs ]; then lazy=(-lazyfs "$LAZYFS"); fi
          "$RUNNER_TEMP/chaos" -tigerstore "$RUNNER_TEMP/tigerstore" -seed "$SEED" -out "$RUNNER_TEMP/chaos-out" -env "${lazy[@]}"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: chaos-env-evidence-${{ matrix.mode }}-${{ matrix.seed }}
          path: |
            ${{ runner.temp }}/chaos-out
            !${{ runner.temp }}/chaos-out/**/disks
          retention-days: 30
