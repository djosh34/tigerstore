name: ci
on:
  workflow_dispatch:
    inputs:
      nospace_only:
        type: boolean
        default: false
      skip_sim:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  core:
    if: ${{ !inputs.nospace_only }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting
        run: |
          gofmt -d internal/core > "$RUNNER_TEMP/formatting.patch"
          cat "$RUNNER_TEMP/formatting.patch"
          test ! -s "$RUNNER_TEMP/formatting.patch"
      - run: go test -race -count=1 -timeout 15m ./internal/core
      - run: go test -race -count=20 ./internal/core -run 'Test(MemberUpdate|VersionRollback|VersionConfirmations)'
      - name: Pre-alarm checkpoint removed control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/core/node.go')
          s = p.read_text()
          guard = 'n.cutNow = n.cutNow || n.state.noSpace || !n.capable()'
          assert s.count(guard) == 1
          p.write_text(s.replace(guard, 'n.cutNow = n.cutNow || n.state.noSpace'))
          PY
          if go test -count=1 -v ./internal/core -run '^TestCompactionBeforeAlarmVersion$' > "$RUNNER_TEMP/compact-control.log" 2>&1; then
            cat "$RUNNER_TEMP/compact-control.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/compact-control.log"
          grep -q 'compaction before alarm support did not cut a checkpoint' "$RUNNER_TEMP/compact-control.log"
          git restore internal/core/node.go
      - name: Membership queue removed control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/core/members.go')
          s = p.read_text()
          guard = 'st.Applied < n.confGate || '
          assert s.count(guard) == 1
          p.write_text(s.replace(guard, ''))
          PY
          if go test -count=1 -v ./internal/core -run '^TestMemberUpdateAfterFollowerReply$' > "$RUNNER_TEMP/members-control.log" 2>&1; then
            cat "$RUNNER_TEMP/members-control.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/members-control.log"
          grep -q 'second MemberUpdate disappeared' "$RUNNER_TEMP/members-control.log"
          git restore internal/core/members.go
      - name: Confirmation removed control
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/core/version.go')
          s = p.read_text()
          assert s.count('if a.hasEpoch {') == 1
          p.write_text(s.replace('if a.hasEpoch {', 'if false {'))
          PY
          if go test -count=1 -v ./internal/core -run '^TestVersionRollbackBeforeAnnouncement$' > "$RUNNER_TEMP/control.log" 2>&1; then
            cat "$RUNNER_TEMP/control.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/control.log"
          grep -q 'version 2, want 1' "$RUNNER_TEMP/control.log"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-evidence
          path: |
            ${{ runner.temp }}/formatting.patch
            ${{ runner.temp }}/control.log
            ${{ runner.temp }}/members-control.log
            ${{ runner.temp }}/compact-control.log
  difftest:
    if: ${{ !inputs.nospace_only }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        server: [etcd, tigerstore]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install etcd v3.7.2
        run: |
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" https://github.com/etcd-io/etcd/releases/download/v3.7.2/etcd-v3.7.2-linux-arm64.tar.gz
          echo "5e3ff99d428fabfcefdc95348f6560d1efe835f7b2d1ab3334fe0831076966b7  $RUNNER_TEMP/etcd.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
          echo "ETCD=$RUNNER_TEMP/etcd-v3.7.2-linux-arm64/etcd" >> "$GITHUB_ENV"
      - name: Repeat TestBoundaries
        run: |
          for repetition in 1 2 3 4 5; do
            echo "repetition $repetition"
            scripts/difftest.sh ${{ matrix.server }}
          done
        env:
          ONLY: '^TestBoundaries$'
          RACE: '1'
  lint:
    if: ${{ !inputs.nospace_only }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./internal/core/... ./cmd/chaos/...
      - run: go vet ./internal/core/... && go test ./internal/lint/
  nospace:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, current]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Select baseline
        if: matrix.source == 'baseline'
        run: |
          cp internal/core/compact_version_test.go "$RUNNER_TEMP/compact_version_test.go"
          git checkout --detach e6c654e8253674f972d4227aea157fa907102363
          cp "$RUNNER_TEMP/compact_version_test.go" internal/core/compact_version_test.go
      - name: Prove the pre-alarm gap exists on the baseline
        if: matrix.source == 'baseline'
        run: |
          if go test -race -count=1 -v ./internal/core -run '^TestCompactionBeforeAlarmVersion$' > "$RUNNER_TEMP/compact-baseline.log" 2>&1; then
            cat "$RUNNER_TEMP/compact-baseline.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/compact-baseline.log"
          grep -q 'compaction before alarm support did not cut a checkpoint' "$RUNNER_TEMP/compact-baseline.log"
      - name: Repeat the NOSPACE recovery test
        run: |
          set -o pipefail
          git rev-parse HEAD
          go test -race -count=20 -timeout 15m -v ./internal/node -run '^TestNoSpace$' 2>&1 | tee "$RUNNER_TEMP/nospace.log"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nospace-${{ matrix.source }}
          path: |
            ${{ runner.temp }}/nospace.log
            ${{ runner.temp }}/compact-baseline.log
  integration:
    if: ${{ !inputs.nospace_only }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -timeout 20m ./internal/node ./internal/server ./internal/peer ./internal/wal
  sim:
    if: ${{ !inputs.nospace_only && !inputs.skip_sim }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -timeout 20m ./internal/sim
      - run: go test -count=1 -timeout 10m ./internal/sim -run '^TestSeeds$|^TestLinearizable$' -args -sim.seeds=400 -sim.traces="$RUNNER_TEMP/a.txt"
      - run: GOMAXPROCS=1 go test -count=1 -timeout 10m ./internal/sim -run '^TestSeeds$' -args -sim.seeds=400 -sim.traces="$RUNNER_TEMP/b.txt"
      - run: diff "$RUNNER_TEMP/a.txt" "$RUNNER_TEMP/b.txt"
  rolling:
    if: ${{ !inputs.nospace_only }}
    uses: ./.github/workflows/rolling-upgrade.yml
