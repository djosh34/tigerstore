name: ci

on:
  workflow_dispatch:
    inputs:
      histories_only:
        description: Check the archived chaos histories instead of the package tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  tests:
    if: ${{ !inputs.histories_only }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Formatting and race tests
        run: |
          test -z "$(gofmt -l check internal/core internal/node internal/sim)"
          go test -race -short -count=1 ./check ./internal/core ./internal/node
          go test -race -short -count=1 ./internal/sim -run '^TestCampaignSeeds$|^TestSnapshotFromCorruptLeader$|^TestWitnessGaps$|^TestLinearizable$|^TestAmbiguousWritesInTheLog$'
      - name: Repeat campaign regressions
        run: |
          go test -v -count=5 ./check -run '^TestWitnessedCampaignPrefixes$'
          go test -v -count=5 ./internal/sim -run '^TestCampaignSeeds$'
      - name: Check planted stale reads in both witness modes
        run: |
          go test -tags planted -v -count=1 ./internal/sim -run '^TestPlanted$' -args -planted=B01a
          go test -tags planted -v -count=1 ./internal/sim -run '^TestPlanted$' -args -planted=B01b
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./check/... ./internal/core/... ./internal/node/... ./internal/sim/...
  controls:
    if: ${{ !inputs.histories_only }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Each checker regression must fail with the original search
        run: |
          git show 40e7c0a009a08d6ba80f369dd2e66c9735512dbb:check/witness_revisions.go > check/witness_revisions.go
          for seed in 5068434 5058843; do
            if go test -v -count=1 ./check -run "^TestWitnessedCampaignPrefixes$/$seed$" > "$RUNNER_TEMP/control-$seed.log" 2>&1; then
              cat "$RUNNER_TEMP/control-$seed.log"
              echo "The original checker unexpectedly passed $seed"
              exit 1
            fi
            cat "$RUNNER_TEMP/control-$seed.log"
            grep -q 'timed out' "$RUNNER_TEMP/control-$seed.log"
          done
          git restore check/witness_revisions.go
      - name: The snapshot regression must fail without the corruption stop
        run: |
          git diff 3b02c421 7b829c24 -- internal/core/snapshot.go | git apply -R
          if go test -v -count=1 ./internal/sim -run '^TestCampaignSeeds$/5038431$' > "$RUNNER_TEMP/control-5038431.log" 2>&1; then
            cat "$RUNNER_TEMP/control-5038431.log"
            echo 'The corrupt sender unexpectedly passed'
            exit 1
          fi
          cat "$RUNNER_TEMP/control-5038431.log"
          grep -q 'liveness:.*sim: connection lost' "$RUNNER_TEMP/control-5038431.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: campaign-controls
          path: ${{ runner.temp }}/control-*.log
  histories:
    if: ${{ inputs.histories_only }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check archived round 2 and 3 histories, one at a time
        run: |
          go build -o "$RUNNER_TEMP/checkhistory" ./cmd/checkhistory
          for ref in 374b44c6d0a4e0fe732275285aa7e85118e4e7d7 93c4b85b2bd14e495aebf154356641093f76c45a; do
            git ls-tree -r --name-only "$ref" | grep -E '/history(-[^/.]+)?\.json\.gz$' > "$RUNNER_TEMP/paths"
            while IFS= read -r file; do
              mkdir -p "$(dirname "$file")"
              git show "$ref:$file" > "$file"
            done < "$RUNNER_TEMP/paths"
          done
          find experiments -name 'history*.json.gz' -print0 | xargs -0 -n1 env GOMEMLIMIT=2GiB "$RUNNER_TEMP/checkhistory" -checkers witness-revisions -timeout 10s | tee "$RUNNER_TEMP/histories.jsonl"
          jq -s '{histories:length, passed:map(select(.passed))|length, ops:map(.ops)|add, slowest:map(.seconds)|max}' "$RUNNER_TEMP/histories.jsonl"
          # These refs contain 589 history variants and 148 raw workload histories.
          test "$(wc -l < "$RUNNER_TEMP/histories.jsonl")" -eq 737
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: archived-history-verdicts
          path: ${{ runner.temp }}/histories.jsonl
