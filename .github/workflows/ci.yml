name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: |
          files='internal/core/snapshot.go internal/core/snapshot_error_test.go internal/node/node.go internal/node/serve_test.go internal/sim/sim.go internal/sim/sim_test.go'
          gofmt -d $files
          test -z "$(gofmt -l $files)"
      - name: Core and node race tests
        run: go test -race -count=1 ./internal/core ./internal/node
      - name: Simulator regression under race
        run: go test -race -count=10 ./internal/sim -run '^TestSnapshotFromCorruptLeader$'
      - name: Simulator suite
        run: go test -count=1 ./internal/sim
      - name: Vet changed packages
        run: go vet ./internal/core ./internal/node ./internal/sim

  without-fix:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Remove only the corruption stop
        run: git show de92cd02:internal/core/snapshot.go > internal/core/snapshot.go
      - name: Core regression must fail without the fix
        run: |
          if go test -count=1 -v ./internal/core -run '^TestSnapshotSendError$' > core.log 2>&1; then
            cat core.log
            exit 1
          fi
          cat core.log
          grep -F 'want the serve error' core.log
      - name: Node regression must fail without the fix
        run: |
          if go test -count=1 -v ./internal/node -run '^TestServeCorruptRecordStops$' > node.log 2>&1; then
            cat node.log
            exit 1
          fi
          cat node.log
          grep -F 'sender kept running after serving a corrupt record' node.log
      - name: Seed regression must fail without the fix
        run: |
          if go test -count=1 -v ./internal/sim -run '^TestSnapshotFromCorruptLeader$' > sim.log 2>&1; then
            cat sim.log
            exit 1
          fi
          cat sim.log
          grep -F 'liveness:' sim.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: without-fix
          path: '*.log'

  seeds:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Reproduce seed 3314 twice
        run: go test -count=1 -v ./internal/sim -run '^TestSeeds$' -args -sim.seed 3314 -sim.seeds 1
      - name: Seeds 3000 to 3499 with determinism and checkers
        run: go test -count=1 -timeout=15m ./internal/sim -run '^TestSeeds$' -args -sim.seed 3000 -sim.seeds 500
