# Temporary, branch-only diagnosis workflow. Never merge this branch.
name: diag-276
on:
  workflow_dispatch:
    inputs:
      test:
        description: One targeted loadgen test
        default: TestDiag276QuantizedCPU
        type: choice
        options:
          - TestDiag276QuantizedCPU
          - TestCheckWindow
          - TestEtcdWorkloads
          - TestFailedCPUSampleIsInvalid
      count:
        description: Repetitions
        default: '10'
        type: string
permissions:
  contents: read
jobs:
  targeted:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install etcd only for the integration test
        if: inputs.test == 'TestEtcdWorkloads'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" https://github.com/etcd-io/etcd/releases/download/v3.7.2/etcd-v3.7.2-linux-arm64.tar.gz
          echo "5e3ff99d428fabfcefdc95348f6560d1efe835f7b2d1ab3334fe0831076966b7  $RUNNER_TEMP/etcd.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
          echo "LOADGEN_ETCD=$RUNNER_TEMP/etcd-v3.7.2-linux-arm64/etcd" >> "$GITHUB_ENV"
      - name: One short targeted test
        env:
          TEST: ${{ inputs.test }}
          COUNT: ${{ inputs.count }}
        run: |
          set -o pipefail
          go test -race -count="$COUNT" -v -run "^${TEST}$" ./cmd/loadgen 2>&1 | tee "$RUNNER_TEMP/diag276.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: diag276
          path: ${{ runner.temp }}/diag276.log
