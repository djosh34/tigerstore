name: review97-compact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compact:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        backend: [etcd, tigerstore]
    env:
      REVIEW_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - run: bash experiments/review97/compact.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: review97-${{ matrix.backend }}
          path: experiments/review97/results
