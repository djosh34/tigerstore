name: ci
on:
  workflow_dispatch:
    inputs:
      memory:
        description: Run the five-hour memory diagnostic instead of unit checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  answers:
    if: ${{ !inputs.memory }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format and save patch
        run: |
          gofmt -w internal/core internal/mvcc internal/node internal/server
          git diff > "$RUNNER_TEMP/format.patch"
      - uses: actions/upload-artifact@v6
        with:
          name: format
          path: ${{ runner.temp }}/format.patch
      - name: Require committed formatting
        run: git diff --exit-code
      - name: Answer and comparison regressions
        run: go test -race -count=5 -v ./internal/core ./internal/mvcc ./internal/server -run 'TestSnapshotMemory|TestCompareMemory|TestAnswerMemory|TestRangeReply|TestRangeReservation|TestRangeBudget|TestRangeStream|TestReplyHold'
      - name: Related suites
        run: go test -race -short ./internal/core ./internal/mvcc ./internal/node ./internal/server ./internal/lint
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: ./internal/core/... ./internal/mvcc/... ./internal/node/... ./internal/server/...
  controls:
    if: ${{ !inputs.memory }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        mode: [txn, chunk, committed, watch, candidates, allocation, writer, revision, inputs, stale-inputs, snapshot]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Remove the selected fix
        env:
          MODE: ${{ matrix.mode }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          mode = os.environ['MODE']
          if mode in ('txn', 'chunk', 'committed', 'watch'):
              p = Path('internal/core/replymemory.go')
              s = p.read_text()
              a = s.index('func (n *Node) replyReservation(')
              b = s.index('// ReleaseReplyBytes', a)
              s = s[:a] + 'func (n *Node) replyReservation(held *int64) func(int64) error { return nil }\n\n' + s[b:]
          elif mode in ('candidates', 'allocation'):
              p = Path('internal/mvcc/ops.go')
              s = p.read_text()
              if mode == 'candidates':
                  s = s.replace('kvReplyBytes*int64(cap(kvs)-len(kvs)) + 512*int64(len(kvs))', '512*int64(cap(kvs))')
              else:
                  s = s.replace('if reserve != nil && !r.CountOnly {', 'if false {')
          elif mode == 'revision':
              p = Path('internal/core/watch.go')
              s = p.read_text().replace('if err := n.reserveReply(bytes); err != nil {', 'if err := n.reserveReply(bytes); err != nil {\n n.flushWatcher(w)')
          elif mode == 'inputs':
              p = Path('internal/mvcc/ops.go')
              s = p.read_text().replace('w.compares = compares', 'w.compares = nil')
          elif mode == 'snapshot':
              p = Path('internal/core/snapshot.go')
              s = p.read_text().replace('n.cache.clear()', 'n.fillCache(n.applied)')
          elif mode == 'stale-inputs':
              p = Path('internal/mvcc/compare.go')
              s = p.read_text().replace('if p.rev != rev {', 'if p.rev == 0 {')
          else:
              p = Path('internal/server/write.go')
              s = p.read_text().replace('hold.Retain()', '// control: no socket-writer reference')
          assert s != p.read_text()
          p.write_text(s)
          PY
      - name: Require the regression to fail for the expected reason
        env:
          MODE: ${{ matrix.mode }}
        run: |
          case "$MODE" in
            txn|chunk) pkg=core; test="TestAnswerMemoryReads/$MODE"; reason='answers not bounded' ;;
            committed) pkg=core; test=TestAnswerMemoryCommittedTxn; reason='committed answer not reserved' ;;
            watch) pkg=core; test=TestAnswerMemoryWatch; reason='watch history not bounded' ;;
            candidates) pkg=mvcc; test=TestRangeReservationCandidates; reason='reserved=' ;;
            allocation) pkg=mvcc; test=TestRangeReservationBeforeAllocation; reason='before admission' ;;
            writer) pkg=server; test=TestAnswerMemoryStreamLifetime; reason='socket frames lost their reservation' ;;
            revision) pkg=core; test=TestAnswerMemoryWatchKeepsRevisionWhole; reason='memory cancellation sent a partial revision' ;;
            inputs) pkg=core; test=TestCompareMemoryBounded; reason='comparison read not bounded' ;;
            stale-inputs) pkg=core; test=TestCompareMemoryRevisionChange; reason='comparison reused a stale prefix' ;;
            snapshot) pkg=core; test=TestSnapshotMemoryDropsCacheBeforeLoad; reason='snapshot retained' ;;
          esac
          if go test -count=1 -v "./internal/$pkg" -run "^$test" > "$RUNNER_TEMP/control.txt" 2>&1; then
            cat "$RUNNER_TEMP/control.txt"
            echo 'Regression passed without its fix'
            exit 1
          fi
          cat "$RUNNER_TEMP/control.txt"
          grep -q "$reason" "$RUNNER_TEMP/control.txt"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: control-${{ matrix.mode }}
          path: ${{ runner.temp }}/control.txt
  simulation:
    if: ${{ !inputs.memory }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -count=1 -timeout=18m ./internal/sim -run 'TestSeeds$|TestLinearizable$' -args -sim.seed=1 -sim.seeds=64
  memory:
    if: ${{ inputs.memory }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build unchanged product and soak
        run: |
          go build -o "$RUNNER_TEMP/tigerstore" ./cmd/tigerstore
          go build -o "$RUNNER_TEMP/soak" ./cmd/soak
      - name: Five-hour soak with external memory sampling
        run: |
          python3 .github/scripts/memory-diagnostic.py "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/soak-out" \
            "$RUNNER_TEMP/soak" -tigerstore "$RUNNER_TEMP/tigerstore" -out "$RUNNER_TEMP/soak-out" \
            -duration 5h -seed 1 -objects 600000 -memory $((640 << 20)) \
            -disk-budget $((3 << 30)) -workers 16 -rate 400 -node-arg=--enable-pprof=true
      - if: always()
        name: Keep reports and decode sampled heaps
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          for file in "$RUNNER_TEMP/soak-out/report.json" "$RUNNER_TEMP/soak-out/"node*.log; do
            if [ -f "$file" ]; then cp "$file" "$RUNNER_TEMP/evidence/"; fi
          done
          for file in "$RUNNER_TEMP/evidence/"*.pb.gz; do
            if [ -f "$file" ]; then
              go tool pprof -top -nodecount=40 -inuse_space "$RUNNER_TEMP/tigerstore" "$file" > "$file.top.txt"
            fi
          done
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: memory-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 30
