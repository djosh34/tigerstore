name: ci
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  membership:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Membership faults, seeds 1 through 256
        run: go test -v -count=1 -timeout=10m ./internal/sim -run '^TestMembershipFaults$' -args -sim.seeds=256
      - name: Membership faults, seeds 4096 through 4159, cross-process replay
        if: always()
        shell: bash
        run: |
          go test -v -count=1 -timeout=5m ./internal/sim -run '^TestMembershipFaults$' -args -sim.seed=4096 -sim.seeds=64 | tee "$RUNNER_TEMP/a.log"
          GOMAXPROCS=1 go test -v -count=1 -timeout=5m ./internal/sim -run '^TestMembershipFaults$' -args -sim.seed=4096 -sim.seeds=64 | tee "$RUNNER_TEMP/b.log"
          grep ' trace ' "$RUNNER_TEMP/a.log" > "$RUNNER_TEMP/a.traces"
          grep ' trace ' "$RUNNER_TEMP/b.log" > "$RUNNER_TEMP/b.traces"
          test "$(wc -l < "$RUNNER_TEMP/a.traces")" -eq 64
          diff "$RUNNER_TEMP/a.traces" "$RUNNER_TEMP/b.traces"
      - name: Membership with the race detector
        if: always()
        run: go test -race -count=1 -timeout=10m ./internal/sim -run '^TestMembershipFaults$' -args -sim.seeds=16
      - name: Metadata cleaning, restart and snapshot catch-up
        if: always()
        run: go test -race -v -count=5 -timeout=5m ./internal/node -run '^TestMetadataAfterCleaning$'
      - name: Planted membership bug and inventory
        if: always()
        run: go test -tags planted -v -count=1 -timeout=5m ./internal/sim -run '^TestPlanted$|^TestPlantedInventory$' -args -planted=B28
  cold-restart:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Named seeds and saved-disk regression for issue 211
        run: go test -v -count=1 ./internal/sim -run '^TestMembershipColdRestart$|^TestMembershipRemovalColdFixture$'
      - name: Check the same saved disks for 30 virtual seconds
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/sim/faults.go')
          text = p.read_text()
          old = 'r.endAt = 6 * Second'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'r.endAt = 30 * Second'))
          PY
          go test -v -count=1 ./internal/sim -run '^TestMembershipRemovalColdFixture$'
  removed-reply-control:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -v -count=1 ./internal/sim -run '^TestMembershipColdRestart$/26$'
      - name: Disable the simulated removed-member reply
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/sim/sim.go')
          text = p.read_text()
          old = 'if slices.Contains(n.core.RemovedMembers(), m.GetFrom()) {'
          assert text.count(old) == 1
          text = text.replace(old, 'if false && slices.Contains(n.core.RemovedMembers(), m.GetFrom()) {')
          assert text.count('s.memberConnect(n)') == 1
          p.write_text(text.replace('s.memberConnect(n)', '// Removed-member handshakes disabled for this control.'))
          PY
          if go test -v -count=1 ./internal/sim -run '^TestMembershipColdRestart$/26$' >control.log 2>&1; then
            cat control.log
            exit 1
          fi
          cat control.log
          grep -E 'node 4 applied .*node 1 applied|cold restart did not converge' control.log
  volatile-stop-control:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -v -count=1 ./internal/sim -run '^TestMembershipColdRestart$/165$'
      - name: Copy the volatile removed flag across cold boot
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('internal/sim/faults.go')
          text = p.read_text()
          old = 'r.nodes[i].inactive = c.inactive[i] && c.runs[i] == 0'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'r.nodes[i].inactive = c.inactive[i]'))
          PY
          if go test -v -count=1 ./internal/sim -run '^TestMembershipColdRestart$/165$' >control.log 2>&1; then
            cat control.log
            exit 1
          fi
          cat control.log
          grep 'cold restart did not converge' control.log
  metadata-controls:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        state: [members, users, roles, alarms]
        path: [restart, catch-up]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Drop one checkpoint field on recovery
        env:
          STATE: ${{ matrix.state }}
          RECOVERY: ${{ matrix.path }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path('internal/core/checkpoint.go')
          target = 1 if os.environ['RECOVERY'] == 'restart' else 3
          replacements = {
              'members': ('st.members[m.ID] = m', 'm.PeerURLs = nil'),
              'users': ('st.auth = h.auth', 'delete(st.auth.users, "alice")'),
              'roles': ('st.auth = h.auth', 'delete(st.auth.roles, "rw")'),
              'alarms': ('st.alarms = h.alarms', 'st.alarms = nil'),
          }
          old, drop = replacements[os.environ['STATE']]
          new = old + '; if cfg.ID == ' + str(target) + ' { ' + drop + ' }'
          text = p.read_text()
          assert text.count(old) == 1
          p.write_text(text.replace(old, new))
          PY
      - name: Require the metadata regression to fail on that field
        env:
          STATE: ${{ matrix.state }}
        run: |
          if go test -v -count=1 -timeout=3m ./internal/node -run '^TestMetadataAfterCleaning$' >control.log 2>&1; then
            cat control.log
            echo 'The test missed the omitted checkpoint field'
            exit 1
          fi
          cat control.log
          case "$STATE" in
            members) finding='members:' ;;
            users) finding='user name not found|users:' ;;
            roles) finding='role name not found|permissions:' ;;
            alarms) finding='alarms:' ;;
          esac
          grep -E "$finding" control.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: metadata-control-${{ matrix.state }}-${{ matrix.path }}
          path: control.log
  baseline-traces:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Compare the unchanged three-voter workload with the base
        run: |
          go test -count=1 ./internal/sim -run '^TestSeeds$' -args -sim.seeds=64 -sim.traces="$RUNNER_TEMP/current.traces"
          git worktree add "$RUNNER_TEMP/base" 63219a94
          cd "$RUNNER_TEMP/base"
          go test -count=1 ./internal/sim -run '^TestSeeds$' -args -sim.seeds=64 -sim.traces="$RUNNER_TEMP/base.traces"
          diff "$RUNNER_TEMP/base.traces" "$RUNNER_TEMP/current.traces"
  regression-packages:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race -short -count=1 -timeout=20m ./internal/core ./internal/node
      - run: go test -race -short -count=1 -timeout=10m ./internal/sim -run '^TestSeeds$|^TestLinearizable$'
  lint:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          args: --build-tags difftest,planted
      - run: go test -count=1 ./internal/lint
  inventory:
    if: false
    strategy:
      matrix:
        bug: [B01a, B01b, B02, B03, B04a, B04b, B04c, B05, B06a, B06b, B06c, B06d, B07, B08, B09a, B09b, B10, B11, B12, B13, B14, B15, B16, B17, B18, B19, B20, B21, B22, B23, B24, B25, B26, B27, B28]
    runs-on: ubuntu-24.04-arm
    steps:
      - run: echo '${{ matrix.bug }}'
