name: exp448 checker floor
on:
  push:
    branches: [exp/448-check-floor]
    paths: ['.github/workflows/exp448-floor.yml']
jobs:
  finish-native-large:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Native revision witness with enough wall time, no simulation
        run: |
          gh run download 40282690495 -n exp441-202610260009002 -D "$RUNNER_TEMP/120m"
          go build -o "$RUNNER_TEMP/checkhistory" ./cmd/checkhistory
          "$RUNNER_TEMP/checkhistory" -timeout 180s -checkers witness-revisions "$RUNNER_TEMP/120m/history.json.gz" | tee "$RUNNER_TEMP/large.jsonl"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp448-large-native
          path: ${{ runner.temp }}/large.jsonl
