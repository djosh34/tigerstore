name: exp448 checker floor
on:
  push:
    branches: [exp/448-check-floor]
jobs:
  short:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      GOMAXPROCS: '2'
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build and run short histories
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/floor/seeds" "$RUNNER_TEMP/floor/kube"
          export SIM_SEED=1 SIM_SEEDS=1
          EXP441_OUT="$RUNNER_TEMP/floor/seeds" scripts/sim.sh ./internal/sim '^TestSeeds$' -test.v -test.timeout 8m 2>&1 | tee "$RUNNER_TEMP/floor/seeds/seed.log"
          cd internal/sim
          EXP441_OUT="$RUNNER_TEMP/floor/kube" GOSIMTOOL="$GITHUB_WORKSPACE/.gosim/bin/gosim" "$GITHUB_WORKSPACE/.gosim/bin/sim.test" -test.run '^TestKubernetesLoad$' -test.v -test.timeout 8m 2>&1 | tee "$RUNNER_TEMP/floor/kube/seed.log"
      - name: Native checker timings
        run: |
          go build -o "$RUNNER_TEMP/checkhistory" ./cmd/checkhistory
          for f in "$RUNNER_TEMP"/floor/*/history.json.gz; do
            "$RUNNER_TEMP/checkhistory" -timeout 5s -checkers durable,revisions,watches,witness-log,witness-revisions,linearizable "$f" || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exp448-short
          path: ${{ runner.temp }}/floor
