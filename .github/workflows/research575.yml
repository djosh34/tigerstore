name: research575 allocation census
on:
  push:
    branches: [research/575-allocation-census]
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p bin
          go build -o bin/tigerstore ./cmd/tigerstore
          go build -o bin/loadgen ./cmd/loadgen
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" https://github.com/etcd-io/etcd/releases/download/v3.7.2/etcd-v3.7.2-linux-arm64.tar.gz
          echo '5e3ff99d428fabfcefdc95348f6560d1efe835f7b2d1ab3334fe0831076966b7' "$RUNNER_TEMP/etcd.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/etcd-v3.7.2-linux-arm64/etcdctl" bin/
          scripts/dev-certs.sh certs
      - name: Measure
        run: |
          sudo mount -o remount,barrier=1 /
          bash bench/research575.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: research575
          path: results
          retention-days: 30
