name: research575 allocation census
on:
  workflow_dispatch:
    inputs:
      script:
        description: bench/research575.sh or bench/research575-headroom.sh
        default: bench/research575-headroom.sh
      points:
        description: GiB added to the leader's Go memory limit, one run each
        default: 0 1 3 0 1 3
jobs:
  measure:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    env:
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          mkdir -p bin
          go build -o bin/tigerstore ./cmd/tigerstore
          go build -o bin/loadgen ./cmd/loadgen
          curl -fsSL -o "$RUNNER_TEMP/etcd.tgz" https://github.com/etcd-io/etcd/releases/download/v3.7.2/etcd-v3.7.2-linux-arm64.tar.gz
          echo '5e3ff99d428fabfcefdc95348f6560d1efe835f7b2d1ab3334fe0831076966b7' "$RUNNER_TEMP/etcd.tgz" | sha256sum -c
          tar xzf "$RUNNER_TEMP/etcd.tgz" -C "$RUNNER_TEMP"
          cp "$RUNNER_TEMP/etcd-v3.7.2-linux-arm64/etcdctl" bin/
          scripts/dev-certs.sh certs
      - name: Measure
        env:
          POINTS: ${{ inputs.points }}
        run: |
          sudo mount -o remount,barrier=1 /
          bash ${{ inputs.script }}
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: research575
          path: results
          retention-days: 30
