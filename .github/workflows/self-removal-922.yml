# Supplemental fixed scenario shard; full qualification is run 46100868364.
name: self-removal-922 fixed scenarios
on:
  push:
    branches: [scratch/922-self-removal-validation]
permissions:
  contents: read
env:
  ETCD_UNSAFE_LOG_RING_BYTES: "536870912"
jobs:
  scenarios:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Second CI fixed scenario shard under gosim
        shell: bash
        env:
          SIM_SEED: "401"
          SIM_SEEDS: "100"
        run: |
          scripts/sim.sh ./internal/sim '^TestScenarios$' -test.v -test.timeout 15m 2>&1 | tee "$RUNNER_TEMP/scenarios.log"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: scenarios-401
          path: ${{ runner.temp }}/scenarios.log
          retention-days: 7
