name: sim-size
run-name: sim-size ${{ inputs.objects }} x ${{ inputs.duration }} seed ${{ inputs.seed }} values /${{ inputs.value_divisor }}
on:
  workflow_dispatch:
    inputs:
      objects:
        description: JSON object counts
        default: '[1000]'
        required: true
      duration:
        description: JSON simulated durations in seconds (churn after preload)
        default: '[60]'
        required: true
      seed:
        description: One harness and scheduler seed
        default: '1'
        required: true
      watch_after_preload:
        description: Start watches after the preload revision, as cmd/soak does (otherwise stock adversarial replay)
        type: boolean
        default: false
      value_divisor:
        description: Divide histogram value sizes by this number (minimum 64 bytes), for a control
        default: '1'
        required: true
      wall_seconds:
        description: Cell wall limit, at most 19800 (leaves reporting time below six hours)
        default: '1800'
        required: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Generate parameter wrappers
        env:
          OBJECTS: ${{ inputs.objects || '[1000]' }}
          DURATION: ${{ inputs.duration || '[60]' }}
          SEED: ${{ inputs.seed || '1' }}
          DIVISOR: ${{ inputs.value_divisor || '1' }}
          WATCH_LATEST: ${{ inputs.watch_after_preload || false }}
        run: |
          python3 - <<'PY'
          import json, os
          objects=json.loads(os.environ['OBJECTS']); durations=json.loads(os.environ['DURATION']); seed=int(os.environ['SEED']); divisor=int(os.environ['DIVISOR'])
          watch_latest=int(os.environ['WATCH_LATEST'].lower()=='true')
          assert divisor>0
          assert all(type(n) is int and n>0 for n in objects+durations) and seed>0
          with open('internal/sim/size_parameters_test.go','w') as f:
            f.write('//go:build sim\n\npackage sim\nimport "testing"\n')
            for n,d in sorted({(1000,60)} | {(n,d) for n in objects for d in durations}):
              f.write(f'func TestSize_{n}_{d}(t *testing.T) {{ sizeProbe(t,{n},{d},{seed},{divisor},{watch_latest}) }}\n')
          PY
      - name: Build as the simulator campaign does (no tests)
        run: scripts/sim.sh ./internal/sim '^$'
      - name: Package translated test binary
        run: |
          find .gosim/metatest -type f -name '*.test' -print
          cp "$(find .gosim/metatest -type f -name '*.test' | head -1)" "$RUNNER_TEMP/size.test"
          mkdir -p "$RUNNER_TEMP/size-bin"
          cp "$RUNNER_TEMP/size.test" "$RUNNER_TEMP/size-bin/size.test"
      - name: Small validation before releasing matrix cells
        env:
          OBJECTS: '1000'
          DURATION: '60'
          SEED: ${{ inputs.seed }}
          WALL_SECONDS: '300'
          VALUE_DIVISOR: ${{ inputs.value_divisor || '1' }}
          WATCH_AFTER_PRELOAD: ${{ inputs.watch_after_preload || false }}
        run: |
          python3 scripts/sim-size.py
          python3 -c 'import json,os; assert json.load(open(os.environ["RUNNER_TEMP"]+"/size-result.json"))["outcome"] == "finished"'
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: size-smoke
          path: |
            ${{ runner.temp }}/size.log
            ${{ runner.temp }}/size-time.txt
            ${{ runner.temp }}/size-samples.jsonl
            ${{ runner.temp }}/size-result.json
      - uses: actions/upload-artifact@v6
        with:
          name: size-binary
          path: ${{ runner.temp }}/size.test
  cell:
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        objects: ${{ fromJSON(inputs.objects || '[1000]') }}
        duration: ${{ fromJSON(inputs.duration || '[60]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: size-binary
          path: ${{ runner.temp }}/size-bin
      - name: Measure one seed
        env:
          OBJECTS: ${{ matrix.objects }}
          DURATION: ${{ matrix.duration }}
          SEED: ${{ inputs.seed || '1' }}
          WALL_SECONDS: ${{ inputs.wall_seconds || '600' }}
          VALUE_DIVISOR: ${{ inputs.value_divisor || '1' }}
          WATCH_AFTER_PRELOAD: ${{ inputs.watch_after_preload || false }}
        run: |
          chmod +x "$RUNNER_TEMP/size-bin/size.test"
          python3 scripts/sim-size.py
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: size-${{ matrix.objects }}-${{ matrix.duration }}
          path: |
            ${{ runner.temp }}/size.log
            ${{ runner.temp }}/size-time.txt
            ${{ runner.temp }}/size-samples.jsonl
            ${{ runner.temp }}/size-result.json
