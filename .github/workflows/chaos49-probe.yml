name: chaos49 throwaway probe
on:
  push:
    branches: [exp/49-real-process-chaos]
    paths:
      - '.github/workflows/chaos49-probe.yml'
      - 'experiments/chaos49/network.py'
      - 'experiments/chaos49/process.py'
      - 'experiments/chaos49/disk/**'
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  disk:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
        probe: [fuse, dm, tmpfs, loop]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - if: matrix.probe == 'fuse'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fuse3 libfuse3-dev pkg-config
      - env:
          PROBE: ${{ matrix.probe }}
        run: |
          mkdir -p results
          uname -a | tee results/versions.txt
          printenv ImageOS ImageVersion >> results/versions.txt
          dpkg-query -W dmsetup util-linux e2fsprogs >> results/versions.txt
          if [ "$PROBE" = fuse ]; then dpkg-query -W fuse3 libfuse3-dev >> results/versions.txt; fi
          case "$PROBE" in
            fuse|dm) bash "experiments/chaos49/disk/probes/probe-$PROBE.sh" 2>&1 | tee results/disk.txt ;;
            *) bash experiments/chaos49/disk/probes/probe-enospc.sh "$PROBE" 2>&1 | tee results/disk.txt ;;
          esac
          grep -q '^PASS ' results/disk.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: disk-${{ matrix.probe }}-${{ matrix.runner }}
          path: |
            results
            experiments/chaos49/disk/results
  network:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - run: |
          mkdir -p results
          uname -a | tee results/versions.txt
          dpkg-query -W iproute2 python3 systemd >> results/versions.txt
          printenv ImageOS ImageVersion >> results/versions.txt
          if (false | tee results/negative-pipeline.txt); then exit 1; fi
          sudo unshare --net python3 experiments/chaos49/network.py 2>&1 | tee results/network.txt
          grep -q '^PASS:' results/network.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: network-${{ matrix.runner }}
          path: results
  process:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - run: |
          mkdir -p results
          uname -a | tee results/versions.txt
          dpkg-query -W iproute2 python3 systemd >> results/versions.txt
          printenv ImageOS ImageVersion >> results/versions.txt
          sudo python3 experiments/chaos49/process.py "$PWD/results/process" 2>&1 | tee results/process.txt
          grep -q '^PASS:' results/process.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: process-${{ matrix.runner }}
          path: results
