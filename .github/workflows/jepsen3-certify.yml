name: Jepsen round 3 register certificates
on:
  push:
    branches: [exp/correct-round3-jepsen]
    paths: ['.github/workflows/jepsen3-certify.yml']
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        default: '38468196852'
      store:
        type: choice
        options: [tigerstore, etcd]
        default: tigerstore
permissions:
  contents: read
  actions: read
jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id || '38468196852' }}
          name: jepsen3-${{ inputs.store || 'tigerstore' }}-register-rep${{ matrix.repetition }}
          path: saved
      - name: Install solver and replay runtime
        shell: bash
        env:
          LEIN_JVM_OPTS: '-Xmx512m'
        run: |
          test "$(date -u +%s)" -lt "$(date -ud 2026-10-13T21:48:00Z +%s)"
          mkdir -p solver-results "$HOME/bin"
          { date -u; python --version; java -version; free -h; uname -a; git rev-parse HEAD; } > solver-results/runtime.txt 2>&1
          python -m pip install z3-solver==4.15.3.0 edn-format==0.7.5
          python -m pip freeze > solver-results/pip-freeze.txt
          curl -fsSL --retry 3 https://raw.githubusercontent.com/technomancy/leiningen/2.12.0/bin/lein -o "$HOME/bin/lein"
          chmod +x "$HOME/bin/lein"
          cd experiments/jepsen2-solver/offline
          timeout 240s "$HOME/bin/lein" classpath > ../../../solver-results/classpath.txt
      - name: Verify provenance and test both verifiers
        shell: bash
        run: |
          remaining=$(( $(date -ud 2026-10-13T21:48:00Z +%s) - $(date -u +%s) ))
          (( remaining > 0 )) || exit 2
          timeout --signal=TERM --kill-after=10s "$remaining" python experiments/jepsen3/check-solver.py
      - name: Certify complete original history
        shell: bash
        run: |
          remaining=$(( $(date -ud 2026-10-13T21:48:00Z +%s) - $(date -u +%s) ))
          (( remaining > 0 )) || exit 2
          sha256sum saved/store/latest/history.edn > solver-results/history.sha256
          cp saved/product-commit.txt solver-results/ 2>/dev/null || true
          timeout --signal=TERM --kill-after=10s "$remaining" python experiments/jepsen2-solver/run-case.py --full saved/store/latest/history.edn --classpath solver-results/classpath.txt --out solver-results/case --seconds 90 --restricted-seconds 10
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jepsen3-cert-${{ inputs.store || 'tigerstore' }}-${{ inputs.run_id || '38468196852' }}-rep${{ matrix.repetition }}
          path: solver-results
          retention-days: 14
