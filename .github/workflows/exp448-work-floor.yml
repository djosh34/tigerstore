name: exp448-work-floor
on:
  push:
    branches: [exp/448-work-floor]
permissions:
  contents: read
jobs:
  floor:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    env:
      GOMAXPROCS: '1'
      GOFLAGS: -p=1
      GOMEMLIMIT: 10GiB
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: |
          mkdir -p exp448-results
          (git rev-parse HEAD; lscpu; free -g; go version) > exp448-results/host.txt
          go test ./internal/sim -run '^$' -bench Benchmark448 -benchtime=1s -count=3 | tee exp448-results/bench.txt
      - run: scripts/sim.sh ./internal/sim '^$'
      - name: Measure seeds sequentially
        run: bash scripts/exp448.sh
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: exp448-work-floor
          path: exp448-results
          retention-days: 14
