# Diagnosis-only: does repairing a failed CutUnsynced remove #374?
name: sim-campaign
on:
  workflow_dispatch:
    inputs:
      test:
        type: choice
        options: [TestSeeds, TestMembershipFaults]
        default: TestSeeds
      first:
        required: true
        default: "1"
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 35
    env:
      GOMAXPROCS: "2"
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/sim.sh ./internal/sim '^$'
      - name: Reproduce the twelve seeds serially
        env:
          SIM_OUT: ${{ runner.temp }}/sim-out
        shell: bash
        run: |
          set +e
          status=0
          for seed in 425327 428609 440692 445105 462560 468460 469496 479590 483273 483694 415228 454465; do
            SIM_SEED=$seed SIM_SEEDS=1 scripts/sim.sh ./internal/sim "^TestSeeds$/^$seed$" >"$RUNNER_TEMP/seed-$seed.log" 2>&1
            result=$?
            echo "seed $seed: exit $result"
            if [ "$result" != 0 ]; then status=1; fi
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diag374
          path: |
            ${{ runner.temp }}/seed-*.log
            ${{ runner.temp }}/sim-out
