# Throwaway diagnosis for #375. 14b19066 has the same diagnostic
# logging, but not the rot witness guard.
name: sim-campaign
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnosis:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: [before, after]
    env:
      GOMAXPROCS: "2"
      GOFLAGS: -p=1
      SIM_SEEDS: "1"
      SIM_KEEP: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Select version
        run: |
          if [ '${{ matrix.version }}' = before ]; then
            git checkout --detach 14b190668f16025ff61e606a3e70471d6d0b418a
          fi
          git log -1 --oneline
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build once
        run: scripts/sim.sh ./internal/sim '^$'
      - name: Replay four seeds
        shell: bash
        run: |
          set -uo pipefail
          export GOSIMTOOL="$GITHUB_WORKSPACE/.gosim/bin/gosim"
          export SIM_OUT="$RUNNER_TEMP/sim-out"
          cd internal/sim
          status=0
          for seed in 483056 422677 449788 460792; do
            SIM_SEED=$seed "$GITHUB_WORKSPACE/.gosim/bin/sim.test" -test.run "^TestSeeds$/^$seed$" -test.v -test.timeout 5m >"$RUNNER_TEMP/seed-$seed.log" 2>&1
            rc=$?
            echo "${{ matrix.version }} $(git rev-parse HEAD) seed $seed exit $rc"
            grep -E -- 'DIAG rot candidate|DIAG skip rot|failed: seed|^--- (PASS|FAIL)|^    --- (PASS|FAIL)|^(PASS|FAIL)$' "$RUNNER_TEMP/seed-$seed.log" || true
            expected=1
            if [ '${{ matrix.version }}' = after ] && [ "$seed" = 483056 ]; then expected=0; fi
            if [ "$rc" != "$expected" ]; then status=1; fi
          done
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diag-375-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/seed-*.log
            ${{ runner.temp }}/sim-out
