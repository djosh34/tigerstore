# Diagnosis only. This branch and its code must not be merged.
name: sim-campaign

on:
  workflow_dispatch:
    inputs:
      test:
        description: Unused diagnostic input
        default: TestSeeds
      first:
        description: Unused diagnostic input
        default: "888737"

permissions:
  contents: read

jobs:
  diagnosis:
    strategy:
      fail-fast: false
      matrix:
        version: [original, prototype]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Restore the original checker for the negative control
        if: matrix.version == 'original'
        run: git restore --source=8896f002 -- check/witness_revisions.go
      - name: Cut history regression
        shell: bash
        run: |
          set +e
          go test ./check -run '^TestDiagnosis386$' -v -count=1 > "$RUNNER_TEMP/cut.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/cut.log"
          echo "cut history status=$status version=${{ matrix.version }}"
          if [ '${{ matrix.version }}' = original ]; then
            test "$status" -eq 1 && grep -q 'steps=100001' "$RUNNER_TEMP/cut.log"
          else
            test "$status" -eq 0
          fi
      - name: Replay seed 888737
        shell: bash
        run: |
          set +e
          SIM_OUT="$RUNNER_TEMP/sim-out" SIM_SEED=888737 SIM_SEEDS=1 scripts/sim.sh ./internal/sim '^TestSeeds$/^888737$' -test.v -test.timeout 25m > "$RUNNER_TEMP/replay.log" 2>&1
          status=$?
          grep -E 'witness:|hashes: seed|hashes of seed|replay:|^(ok|FAIL|PASS)|^--- (PASS|FAIL)' "$RUNNER_TEMP/replay.log" | head -30 || true
          echo "simulator status=$status version=${{ matrix.version }}"
          if [ '${{ matrix.version }}' = original ]; then
            test "$status" -eq 1 && grep -q 'timed out after 50000000 steps' "$RUNNER_TEMP/replay.log"
          else
            test "$status" -eq 0
          fi
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diag386-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/cut.log
            ${{ runner.temp }}/replay.log
            ${{ runner.temp }}/sim-out
