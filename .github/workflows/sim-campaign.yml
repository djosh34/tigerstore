name: diag-301
on:
  workflow_dispatch:
    inputs:
      first:
        description: Evidence label
        default: focused-red
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Check the closed-prefix wait on head and main
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          cp internal/sim/diag301_test.go "$RUNNER_TEMP/diag301_test.go"
          status=0
          for variant in head main; do
            if [ "$variant" = main ]; then
              git checkout e3243229 -- internal/node internal/wal internal/sim
              cp "$RUNNER_TEMP/diag301_test.go" internal/sim/diag301_test.go
            fi
            go test -v -count=1 -timeout=30s ./internal/sim -run '^TestDiag301ClosedPrefix$' >"$RUNNER_TEMP/evidence/$variant.log" 2>&1 || status=1
            grep -E -- 'FAIL|PASS|snapshot fault' "$RUNNER_TEMP/evidence/$variant.log" | tail -12
          done
          exit "$status"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: diag-301-${{ inputs.first }}
          path: ${{ runner.temp }}/evidence
