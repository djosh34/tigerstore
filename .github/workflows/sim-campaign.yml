# A seed campaign of one simulator test of internal/sim under gosim.
# Up to ten runners share the ordinary seeds, four processes per runner
# (#500); every long seed gets a runner and process of its own (#877).
# The planner uses campaignKind, not a second allocation in the workflow.
# A final summary requires a native driver result for every requested seed,
# including seeds whose runner never uploaded an artifact.
# TestSeeds on 100,000 seeds keeps 2,500 a process: each fault must take
# effect in 95% of the seeds; a process of at least 64 seeds also runs the
# deliberate stalled leader, and one of at least 2,000 seeds must have a
# random stalled leader that went silent and a write torn by a crash.
# TestMembershipFaults on 10,000 seeds keeps 250 a process. Shorter sets
# apply only the rules their size supports. SIM_TWICE replays 1% of each
# process queue and requires identical hashes, even across a long-seed gap.
# A failing seed prints its hashes and replay command; its trace, nodes,
# history and disks are uploaded separately from the seed and memory logs.
#   gh workflow run sim-campaign.yml -f test=<test> -f seeds=<count> -f first=<seed>
name: sim-campaign
# The title names the test and the count, which release.yml looks for.
run-name: sim-campaign ${{ inputs.test }}, ${{ inputs.seeds }} seeds from seed ${{ inputs.first }}

on:
  workflow_dispatch:
    inputs:
      test:
        description: The simulator test to run, one that runs a set of seeds
        required: true
        default: TestSeeds
      seeds:
        description: How many seeds
        required: true
        default: "100000"
      first:
        description: The first seed
        required: true
        default: "1"

permissions:
  contents: read

# Tests format a 512 MiB log ring, not the quota's default 2 GiB (#602).
env:
  ETCD_UNSAFE_LOG_RING_BYTES: "536870912"

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test the planner and completeness check (no simulator runs)
        run: |
          python3 -m unittest discover -s scripts -p test_sim_campaign.py
          go test ./internal/simrun
          go test -tags simio ./internal/sim -run '^TestCampaignLongSeeds$'
      - id: plan
        env:
          TEST: ${{ inputs.test }}
          SEEDS: ${{ inputs.seeds }}
          FIRST: ${{ inputs.first }}
          SIM_CAMPAIGN_LONG_SEEDS: ${{ runner.temp }}/long-seeds.json
        run: |
          go test -tags simio ./internal/sim -run '^TestCampaignPlan$' -count=1
          python3 scripts/sim-campaign.py plan --long-seeds "$SIM_CAMPAIGN_LONG_SEEDS" --output "$RUNNER_TEMP/plan.json"
      - uses: actions/upload-artifact@v6
        with:
          name: sim-campaign-plan
          path: ${{ runner.temp }}/plan.json
          if-no-files-found: error
  seeds:
    name: seeds (${{ matrix.shard }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Builds the gosim and native test binaries, and runs no test.
      - run: scripts/sim.sh ./internal/sim '^$'
      - name: Verify the unchanged lease-free fork trace and history pin
        env:
          SIM_OUT: ${{ runner.temp }}/hash-pin
        run: scripts/sim.sh ./internal/sim '^TestLeaseFreeForkTrace$' -test.v
      - name: Run the planned process queues
        env:
          TEST: ${{ inputs.test }}
          PROCESSES: ${{ toJSON(matrix.processes) }}
          SHARD: ${{ matrix.shard }}
          SIM_OUT: ${{ runner.temp }}/sim-out
          SIM_DIAL_EVIDENCE: ${{ runner.temp }}/dial-progress.log
        run: |
          touch "$SIM_DIAL_EVIDENCE"
          tail -F "$SIM_DIAL_EVIDENCE" &
          reader=$!
          trap 'kill "$reader" 2>/dev/null || true' EXIT
          bash scripts/sim-campaign.sh
      # Even successful seeds retain hashes for replay. A dead runner may
      # upload nothing: the summary must still account for its seeds.
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sim-campaign-logs-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/seeds-*.log
            ${{ runner.temp }}/memory.log
            ${{ runner.temp }}/dial-progress.log
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dial-classification-evidence-${{ matrix.shard }}
          path: ${{ runner.temp }}/sim-out/dial-evidence
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sim-campaign-files-${{ matrix.shard }}
          path: ${{ runner.temp }}/sim-out
  summary:
    needs: [plan, seeds]
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        id: download
        continue-on-error: true
        with:
          pattern: sim-campaign-logs-*
          path: ${{ runner.temp }}/campaign
      - name: Require a result for every requested seed
        env:
          SEEDS_RESULT: ${{ needs.seeds.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          DOWNLOAD_RESULT: ${{ steps.download.outcome }}
          TEST: ${{ inputs.test }}
          FIRST: ${{ inputs.first }}
          SEEDS: ${{ inputs.seeds }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set +e
          set -uo pipefail
          python3 scripts/sim-campaign.py summary --artifacts "$RUNNER_TEMP/campaign" | tee -a "$GITHUB_STEP_SUMMARY"
          status=$?
          # Completeness is not success: failed seed jobs, aggregate
          # checks, and download/digest validation must remain failures.
          if [ "$PLAN_RESULT" != success ] || [ "$SEEDS_RESULT" != success ] || [ "$DOWNLOAD_RESULT" != success ]; then
            echo "Plan: $PLAN_RESULT; seed jobs: $SEEDS_RESULT; download: $DOWNLOAD_RESULT" | tee -a "$GITHUB_STEP_SUMMARY"
            status=1
          fi
          exit "$status"
