# A seed campaign of one simulator test of internal/sim under gosim, in
# up to 10 jobs of four processes, one a CPU of the runner, every checker
# on each seed (four a runner give 3.1 times the seeds a minute of one,
# against 1.7 times for two: #500). The test is
# one that runs a set of seeds (simrun.Seeds), such as TestSeeds,
# TestLinearizable, TestMembershipFaults or TestKubernetesLoad. The seeds
# are split evenly over the processes:
#   - TestSeeds, 100,000 seeds: 2,500 a process, the witness checker in
#     both modes among them (#148). Each process requires each fault to
#     take effect in 95% of its seeds, and a process of 2,000 seeds or
#     more a stalled leader that went silent and a write a crash tore
#     too (#218, #233, #378).
#   - TestMembershipFaults, 10,000 seeds: 250 a process.
# A short campaign of any such test runs the same way with fewer seeds;
# some of a test's rules over a set apply only to a process with enough
# seeds. Every seed is a gosim run of its own, and 1% of each process's
# seeds run twice and must give the same hashes. Started by the worker:
#   gh workflow run sim-campaign.yml -f test=<test> -f seeds=<count> -f first=<seed>
# A failing seed prints its hashes and the command that runs it again,
# and its trace, how it left each node, its history and its disks are
# uploaded with the job's logs.
name: sim-campaign
# The title names the test and the count, which release.yml looks for.
run-name: sim-campaign ${{ inputs.test }}, ${{ inputs.seeds }} seeds from seed ${{ inputs.first }}

on:
  workflow_dispatch:
    inputs:
      test:
        description: The simulator test to run, one that runs a set of seeds
        required: true
        default: TestSeeds
      seeds:
        description: How many seeds
        required: true
        default: "100000"
      first:
        description: The first seed
        required: true
        default: "1"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04-arm
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      per: ${{ steps.plan.outputs.per }}
    steps:
      - id: plan
        env:
          TEST: ${{ inputs.test }}
          SEEDS: ${{ inputs.seeds }}
          FIRST: ${{ inputs.first }}
        run: |
          set -euo pipefail
          [[ "$TEST" =~ ^Test[A-Za-z0-9_]+$ ]] || { echo "test $TEST is not the name of a test"; exit 1; }
          [[ "$SEEDS" =~ ^[1-9][0-9]*$ ]] || { echo "seeds $SEEDS is not a positive count"; exit 1; }
          [[ "$FIRST" =~ ^[0-9]+$ ]] || { echo "first $FIRST is not a seed"; exit 1; }
          # The seeds of a process are as many as with up to 40 processes,
          # so that a process of TestSeeds keeps its 2,500 seeds and the
          # rules of a set of 2,000; four processes a job, every process
          # but the last the same number of seeds.
          procs=$(( (SEEDS + 1) / 2 ))
          procs=$(( procs > 40 ? 40 : procs ))
          per=$(( (SEEDS + procs - 1) / procs ))
          jobs=$(( (SEEDS + 4 * per - 1) / (4 * per) ))
          echo "$jobs jobs, $per seeds a process"
          echo "shards=$(seq -s, 0 $((jobs - 1)) | sed 's/^/[/; s/$/]/')" >>"$GITHUB_OUTPUT"
          echo "per=$per" >>"$GITHUB_OUTPUT"
  seeds:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Builds the gosim and native test binaries, and runs no test.
      - run: scripts/sim.sh ./internal/sim '^$'
      - name: Run the seeds in four processes
        shell: bash
        env:
          TEST: ${{ inputs.test }}
          SEEDS: ${{ inputs.seeds }}
          FIRST: ${{ inputs.first }}
          PER: ${{ needs.plan.outputs.per }}
          SHARD: ${{ matrix.shard }}
          SIM_OUT: ${{ runner.temp }}/sim-out
        run: |
          set -uo pipefail
          export GOSIMTOOL="$GITHUB_WORKSPACE/.gosim/bin/gosim"
          cd internal/sim
          pids=()
          procs=()
          for p in 0 1 2 3; do
            k=$((SHARD * 4 + p))
            n=$((SEEDS - k * PER))
            n=$((n > PER ? PER : n))
            if [ "$n" -le 0 ]; then
              continue
            fi
            seed=$((FIRST + k * PER))
            echo "process $p: seeds $seed to $((seed + n - 1)) of $TEST"
            SIM_SEED=$seed SIM_SEEDS=$n SIM_TWICE=$((n / 100)) "$GITHUB_WORKSPACE/.gosim/bin/sim.test" -test.run "^$TEST\$" -test.v -test.timeout 340m >"$RUNNER_TEMP/seeds-$p.log" 2>&1 &
            pids+=($!)
            procs+=("$p")
          done
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          # The step's shell stops at the first failed command, and grep
          # fails once head has its 50 lines, so all processes are waited
          # for first.
          for p in "${procs[@]}"; do
            grep -E -- '^--- FAIL|^    --- FAIL| seeds: |took effect|^(ok|FAIL|PASS)$' "$RUNNER_TEMP/seeds-$p.log" | head -50 || true
            PKG=./internal/sim "$GITHUB_WORKSPACE/scripts/replay.sh" "$RUNNER_TEMP/seeds-$p.log" -gosim
          done
          # A test name that matches no test, or a test that runs no set of
          # seeds, would pass with no seed run.
          for p in "${procs[@]}"; do
            grep -qE -- "^=== RUN   $TEST/[0-9]+\$" "$RUNNER_TEMP/seeds-$p.log" || { echo "process $p ran no seed of a test $TEST"; status=1; }
          done
          exit $status
      # The logs, with every seed's hashes, also when the campaign passed:
      # any seed of them replays alone with the same hashes.
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sim-campaign-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/seeds-*.log
            ${{ runner.temp }}/sim-out
