name: sim-campaign

on:
  workflow_dispatch:
    inputs:
      first:
        description: First seed of the network/time campaign
        required: true
        default: "1482001"
      seeds:
        description: Seeds per scenario
        default: "100"
      scenario:
        description: One scenario, or all
        default: all
      race:
        description: Build with the race detector
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lease-witness:
    if: inputs.scenario == 'lease-witness'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Minimal unused-branch lease history
        run: go test -v -count=1 ./check -run '^TestRound2UnusedTxnLease$'

  network-time:
    strategy:
      fail-fast: false
      matrix:
        scenario: [leader-incoming, follower-island, leader-flap, peer-slow-leader, minority-bridge, clock-leader, clock-follower]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run network and time schedules
        if: inputs.scenario == 'all' || inputs.scenario == matrix.scenario || (inputs.scenario == 'clocks' && startsWith(matrix.scenario, 'clock-'))
        shell: bash
        env:
          FIRST: ${{ inputs.first }}
          SEEDS: ${{ inputs.seeds }}
          SCENARIO: ${{ matrix.scenario }}
          RACE: ${{ inputs.race }}
        run: |
          set -o pipefail
          flags=()
          if [ "$RACE" = true ]; then flags=(-race); fi
          go test "${flags[@]}" -v -count=1 -timeout=60m ./internal/sim -run '^TestNetworkTime$' \
            -args -sim.seed="$FIRST" -sim.seeds="$SEEDS" -sim.network="$SCENARIO" \
            -sim.out="$RUNNER_TEMP/sim-out" 2>&1 | tee "$RUNNER_TEMP/network-time.log"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: network-time-${{ matrix.scenario }}
          path: |
            ${{ runner.temp }}/network-time.log
            ${{ runner.temp }}/sim-out
          retention-days: 30
