name: sim-campaign
on:
  workflow_dispatch:
    inputs:
      first:
        description: Diagnostic seed
        required: true
        default: "434594"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - revision: '9169cb637e8a5bab006bea152e5870e5a8335ab1'
            label: atomic-replacement
            expected: 0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Named regression
        env:
          EXPECTED: ${{ matrix.expected }}
        shell: bash
        run: |
          set +e
          scripts/sim.sh ./internal/sim '^TestFailedSyncKillRestart$' -test.v > "$RUNNER_TEMP/scenario.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/scenario.log"
          echo "test exit=$status, expected=$EXPECTED"
          test "$status" = "$EXPECTED"
      - name: Original seed with prototype rewrite
        if: matrix.label == 'atomic-replacement'
        env:
          SIM_SEED: ${{ inputs.first }}
          SIM_SEEDS: 1
          SIM_OUT: ${{ runner.temp }}/sim-out
        shell: bash
        run: |
          set +e
          scripts/sim.sh ./internal/sim '^TestSeeds$/^434594$' -test.v > "$RUNNER_TEMP/seed.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/seed.log"
          echo "seed exit=$status (schedule can move with a code change)"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diag-364-${{ matrix.label }}
          path: |
            ${{ runner.temp }}/scenario.log
            ${{ runner.temp }}/seed.log
            ${{ runner.temp }}/sim-out
