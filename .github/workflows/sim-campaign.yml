name: diag-301
on:
  workflow_dispatch:
    inputs:
      first:
        description: Evidence label
        default: red-green-red
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Change only the snapshot-fault wait, then remove the change
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/evidence"
          cp internal/sim/storage.go "$RUNNER_TEMP/fixed-storage.go"
          status=0
          for variant in broken fixed broken-again; do
            if [ "$variant" = fixed ]; then
              cp "$RUNNER_TEMP/fixed-storage.go" internal/sim/storage.go
            else
              git show b97c3594:internal/sim/storage.go > internal/sim/storage.go
            fi
            result=0
            go test -v -count=1 -timeout=30s ./internal/sim -run '^TestDiag301' >"$RUNNER_TEMP/evidence/$variant.log" 2>&1 || result=$?
            echo "$variant exit=$result"
            grep -E -- 'FAIL|PASS|stopped: core: the disk failed|snapshot fault|transport shutdown' "$RUNNER_TEMP/evidence/$variant.log" | tail -12
            if [ "$variant" = fixed ]; then
              [ "$result" = 0 ] || status=1
            else
              [ "$result" = 1 ] || status=1
              grep -q 'the disk-failed leader has not exited because transport shutdown is stuck' "$RUNNER_TEMP/evidence/$variant.log" || status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: diag-301-${{ inputs.first }}
          path: ${{ runner.temp }}/evidence
