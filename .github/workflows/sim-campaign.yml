name: sim-campaign
on:
  workflow_dispatch:
    inputs:
      first:
        description: Diagnostic seed
        required: true
        default: "434594"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        revision: ['809b4e1c5f4aa4a576cabf586754fb15ccd8396a', '9e278809b920261368b216e1d29e8ca7bcefc5a2']
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Keep full disk traces
        run: python3 -c 'from pathlib import Path; p=Path("internal/sim/sim.go"); p.write_text(p.read_text().replace("3000, 4000", "3000, 400000"))'
      - name: Replay
        env:
          SIM_SEED: ${{ inputs.first }}
          SIM_SEEDS: 1
          SIM_OUT: ${{ runner.temp }}/sim-out
        run: scripts/sim.sh ./internal/sim '^TestSeeds$/^434594$' -test.v 2>&1 | tee "$RUNNER_TEMP/replay.log"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diag-364-${{ matrix.revision }}
          path: |
            ${{ runner.temp }}/replay.log
            ${{ runner.temp }}/sim-out
