# Diagnosis only for #387. This branch and its code must not be merged.
name: sim-campaign

on:
  workflow_dispatch:
    inputs:
      test:
        description: Unused diagnostic input
        default: TestSeeds
      first:
        description: Unused diagnostic input
        default: "1"

permissions:
  contents: read

jobs:
  diagnosis:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      GOMAXPROCS: "2"
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: The original checker exhausts the cut's search budget
        shell: bash
        run: |
          git restore --source=3cdd632e -- check/witness_revisions.go
          set +e
          go test ./check -run '^TestDiagnosis387$' -v -count=1 > "$RUNNER_TEMP/original-cut.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/original-cut.log"
          test "$status" -eq 1 && grep -q '100001 steps, 12966 backtracks: timed out' "$RUNNER_TEMP/original-cut.log"
      - name: The prototype refutes the cut and passes the check package
        shell: bash
        run: |
          git restore --source=HEAD -- check/witness_revisions.go
          go test ./check -count=1 -v > "$RUNNER_TEMP/prototype-check.log" 2>&1
          grep -E 'TestDiagnosis387|TestWitnessedCampaignPrefixes|steps,|^(ok|FAIL|PASS)' "$RUNNER_TEMP/prototype-check.log"
      - name: Replay B01a seed 1 with the prototype
        shell: bash
        env:
          SIM_OUT: ${{ runner.temp }}/sim-out
        run: |
          set -o pipefail
          SIM_PLANTED=B01a SIM_SEED=1 SIM_SEEDS=1 TAGS=planted scripts/sim.sh ./internal/sim '^TestPlanted$/^1$' -test.v -test.timeout 15m 2>&1 | tee "$RUNNER_TEMP/replay.log"
          grep -q 'the witness checker (revisions):.*real time allows' "$RUNNER_TEMP/replay.log"
          grep -q 'B01a .*caught by seed 1' "$RUNNER_TEMP/replay.log"
      - name: Check the replay's saved history in both modes
        shell: bash
        run: |
          h="$RUNNER_TEMP/sim-out/TestPlanted_1/history.json"
          sha256sum "$h"
          test "$(sha256sum "$h" | cut -d ' ' -f 1)" = 5b54d87dccd1c6dd03dac6c21e0e68fac7b9aed7c9f42e62d51211cad91b4bce
          set +e
          go run ./cmd/checkhistory -checkers witness-log,witness-revisions -timeout 20m "$h" > "$RUNNER_TEMP/history-check.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/history-check.log"
          test "$status" -eq 1 && test "$(grep -c 'real time allows' "$RUNNER_TEMP/history-check.log")" -eq 2 && ! grep -q 'timed out' "$RUNNER_TEMP/history-check.log"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diag387
          path: |
            ${{ runner.temp }}/original-cut.log
            ${{ runner.temp }}/prototype-check.log
            ${{ runner.temp }}/replay.log
            ${{ runner.temp }}/history-check.log
            ${{ runner.temp }}/sim-out
