# Diagnosis only. This branch is never merged.
name: sim-campaign

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag376:
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: before
            revision: e47dbff860b35c81476bd1a16a76c683a5e3a2fe
          - mode: after
            revision: c87ce4f39f2deb8e45c6755d4687dd6241f2220b
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      GOMAXPROCS: "2"
      GOFLAGS: "-p=1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/sim.sh ./internal/sim '^$'
      - name: Replay both seeds
        shell: bash
        env:
          MODE: ${{ matrix.mode }}
          SIM_OUT: ${{ runner.temp }}/sim-out
        run: |
          export GOSIMTOOL="$GITHUB_WORKSPACE/.gosim/bin/gosim"
          export SIM_SEEDS=1
          cd internal/sim
          result=0
          for seed in 401579 477576; do
            status=0
            SIM_SEED=$seed "$GITHUB_WORKSPACE/.gosim/bin/sim.test" -test.run '^TestSeeds$' -test.v -test.timeout 5m >"$RUNNER_TEMP/seed-$seed.log" 2>&1 || status=$?
            tail -15 "$RUNNER_TEMP/seed-$seed.log"
            if [ "$MODE" = before ]; then
              if [ "$status" -eq 0 ] || ! grep -q 'witness check (revisions)' "$RUNNER_TEMP/seed-$seed.log"; then
                result=1
              fi
            elif [ "$status" -ne 0 ]; then
              result=1
            fi
          done
          exit "$result"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diag376-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/seed-*.log
            ${{ runner.temp }}/sim-out
