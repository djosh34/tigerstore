name: sim-campaign
on:
  workflow_dispatch:
    inputs:
      first:
        description: Diagnostic seed
        default: "452360"
      test:
        description: Diagnostic test
        default: TestSeeds
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 12
    env:
      GOMAXPROCS: "2"
      GOFLAGS: -p=1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: scripts/sim.sh ./internal/sim '^$'
      - name: Extract before checkers, then check natively
        shell: bash
        run: |
          mkdir -p diag-out
          cd internal/sim
          set +e
          printf '%s\n' '{"Test":"TestSeeds","Seed":452360,"ExtraEnv":["SIM_SEED=452360","SIM_SEEDS=1","SIM_PLANTED=diag369"]}' | timeout -s QUIT -k 5 120 ../../.gosim/metatest/linux_arm64/translated-github.com-djosh34-tigerstore-internal_-sim.test -metatest > ../../diag-out/raw.json 2> ../../diag-out/stack.log
          cd ../..
          python3 - <<'PY'
          import json,base64,pathlib
          p=pathlib.Path('diag-out')
          raw=json.loads((p/'raw.json').read_text())
          (p/'log.txt').write_bytes(base64.b64decode(raw['LogOutput']))
          for name,data in raw.get('Artifacts',{}).items():
            target=p/name
            target.parent.mkdir(parents=True,exist_ok=True)
            target.write_bytes(base64.b64decode(data))
          PY
          find diag-out -name history.json -exec go run ./cmd/checkhistory -timeout 10s -checkers durable,revisions,watches,witness-log,witness-revisions {} \; > diag-out/checks.log 2>&1
          cat diag-out/checks.log
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: diag-369
          path: diag-out
