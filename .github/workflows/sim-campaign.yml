name: sim-campaign
on:
  workflow_dispatch:
    inputs:
      first:
        description: First membership round 3 seed
        required: true
        default: "1483001"
      count:
        description: Seeds per shard
        default: "32"
permissions:
  contents: read
jobs:
  membership:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        race: [false]
        include:
          - shard: 0
            race: true
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Stage-timed membership faults and rolling power loss
        shell: bash
        env:
          FIRST: ${{ inputs.first }}
          COUNT: ${{ inputs.count }}
          SHARD: ${{ matrix.shard }}
          RACE: ${{ matrix.race }}
        run: |
          set -o pipefail
          flags=()
          count=$COUNT
          if [ "$RACE" = true ]; then flags=(-race); count=4; fi
          seed=$((FIRST + SHARD * COUNT))
          go test "${flags[@]}" -count=1 -v -timeout=40m ./internal/sim -run '^TestMembershipRound3$' -args -sim.seed="$seed" -sim.seeds="$count" -sim.out="$RUNNER_TEMP/sim-out" 2>&1 | tee "$RUNNER_TEMP/membership.log"
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: membership-${{ matrix.shard }}-${{ matrix.race }}
          path: |
            ${{ runner.temp }}/membership.log
            ${{ runner.temp }}/sim-out
          retention-days: 30
