name: kube-burner external store comparison
on:
  push:
    branches: [exp/kube-burner]
    paths:
      - '.github/workflows/kube-burner.yml'
      - 'experiments/kube-burner/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        store: [etcd, tigerstore]
        rep: [1, 2, 3]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      TIGERSTORE_REF: 90870876b6459334c7eddd67c0f9d184267f2eba
      BOOT_ONLY: '0'
      STORE: ${{ matrix.store }}
      REP: ${{ matrix.rep }}
      GOFLAGS: -p=2
      GOMEMLIMIT: 2GiB
    steps:
      - uses: actions/checkout@v4
      - name: Enforce deadline
        run: test "$(date -u +%s)" -lt "$(date -u -d '2026-10-13T22:00:00Z' +%s)"
      - uses: actions/checkout@v4
        if: matrix.store == 'tigerstore'
        with:
          ref: ${{ env.TIGERSTORE_REF }}
          path: product
      - uses: actions/setup-go@v5
        with:
          go-version: 1.27.2
          cache: false
      - name: Boot and measure one fresh cluster
        run: timeout --kill-after=20s 1260s bash experiments/kube-burner/run.sh
      - name: Keep logs and measurements on failure too
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kube-burner-${{ matrix.runner }}-${{ matrix.store }}-${{ matrix.rep }}
          path: .burner-results/
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
