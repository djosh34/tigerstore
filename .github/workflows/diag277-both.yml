name: diag277-both
run-name: 'diag277 reference: old and current red controls'
on:
  push:
    branches: [diag/277-witness-both]
permissions:
  contents: read
  actions: read
jobs:
  saved:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rule: [old, current]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Select placement rule (only checker file changes)
        env:
          RULE: ${{ matrix.rule }}
        run: |
          if [ "$RULE" != prototype ]; then
            git show 9d230880:check/witness_revisions.go > check/witness_revisions.go
            if [ "$RULE" = old ]; then
              python3 - <<'PY'
          p = 'check/witness_revisions.go'
          s = open(p).read()
          assert s.count('at = max(at, by)') == 1
          open(p, 'w').write(s.replace('at = max(at, by)', 'at = max(at, by+1)'))
          PY
            fi
          fi
          git diff -- check/witness_revisions.go
          mkdir -p evidence
      - name: Saved-history reductions, Porcupine and both witnesses
        run: go test -v -count=1 ./check -run '^TestDiag277' 2>&1 | tee evidence/reductions.log
      - name: All checker tests (positive and negative regressions)
        if: ${{ !cancelled() }}
        run: go test -v -count=1 ./check 2>&1 | tee evidence/check.log
      - name: Fetch the original histories, not simulator replays
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 39170367649 -R djosh34/tigerstore -n sim-campaign-8 -D "$RUNNER_TEMP/old"
          gh run download 39185668816 -R djosh34/tigerstore -D "$RUNNER_TEMP/new"
      - name: Every original artifact through both witnesses
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -uo pipefail
          status=0
          while IFS= read -r h; do
            echo "::group::$h"
            go run ./cmd/checkhistory -timeout 30s -checkers witness-log,witness-revisions "$h" 2>&1 | tee -a evidence/originals.log || status=1
            echo "::endgroup::"
          done < <(find "$RUNNER_TEMP/old" "$RUNNER_TEMP/new" -name history.json | sort)
          exit "$status"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: diag277-${{ matrix.rule }}
          path: evidence
