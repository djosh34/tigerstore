name: diag284 witness ordering

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  targeted:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Fetch the exact failed seed 30120 recording
        uses: actions/download-artifact@v6
        with:
          github-token: ${{ github.token }}
          run-id: 39219800052
          name: sim-campaign-6
          path: ${{ runner.temp }}/issue284
      - name: Five-call reduction and stale-read negative control
        run: go test -v -count=1 -timeout 30s ./check -run '^TestIssue284Reduced$'
      - name: Recheck original failed history in both witness modes
        if: ${{ !cancelled() }}
        env:
          ISSUE284_HISTORY: ${{ runner.temp }}/issue284/sim-out/TestSeeds_30120/history.json
        run: go test -v -count=1 -timeout 60s ./check -run '^TestIssue284ArtifactHistory$'
      - name: Existing checker tests (no simulation)
        run: go test -count=1 -timeout 5m ./check
