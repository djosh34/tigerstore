name: diag-281
on:
  workflow_dispatch:
    inputs:
      checker:
        type: string
        default: compare
permissions:
  contents: read
  actions: read
jobs:
  saved-history:
    strategy:
      fail-fast: false
      matrix:
        checker: ${{ inputs.checker == 'compare' && fromJSON('["f943be1c","9d230880","db982766"]') || fromJSON(format('["{0}"]', inputs.checker)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Original saved history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 39193407810 -n sim-campaign-13 -D original
      - name: Select checker control
        if: matrix.checker != 'fixed'
        run: git restore --source=${{ matrix.checker }} -- check/witness.go check/witness_revisions.go
      - name: Saved-history witnesses
        run: go run ./cmd/checkhistory -timeout 60s -checkers witness-log,witness-revisions original/sim-out/TestSeeds_8367529/history.json
      - name: Reduced-history witnesses
        if: always()
        run: go run ./cmd/checkhistory -timeout 10s -checkers witness-log,witness-revisions check/testdata/diag281-prefix.json
      - name: Named reproduction and pruning controls
        if: always()
        run: go test -v -count=1 -timeout=30s ./check -run '^TestDiag281'
      - name: All checker tests
        if: always() && matrix.checker == 'fixed'
        run: go test -count=1 -timeout=3m ./check
