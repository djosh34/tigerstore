name: diag only issue 300
on:
  workflow_dispatch:
    inputs:
      product_sha:
        default: e3243229
      mode:
        default: jepsen
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: One watch LazyFS replay
        if: inputs.mode == 'jepsen'
        env:
          PRODUCT_SHA: ${{ inputs.product_sha }}
        run: bash scripts/jepsen/run.sh tigerstore watch lazyfs 90 50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag300
          path: results
          retention-days: 30
