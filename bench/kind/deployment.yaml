apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-{{.Replica}}
spec:
  replicas: 0
  selector:
    matchLabels:
      app: deploy-{{.Replica}}
  template:
    metadata:
      labels:
        app: deploy-{{.Replica}}
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
